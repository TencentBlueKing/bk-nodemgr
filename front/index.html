<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="/favicon.png" type="image/x-icon" />
    <title>Loading</title>
    <script>
      ;(function () {
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        const setting = localStorage.getItem('vueuse-color-scheme') || 'auto'
        if (setting === 'dark' || (prefersDark && setting !== 'light'))
          document.documentElement.classList.toggle('dark', true)
      })()
    </script>
  </head>
  <body class="font-sans">
    <div id="app"></div>
    <script>
      window.PROJECT_CONFIG = (function () {
        const BK_API_PREFIX = '{{ .BK_API_PREFIX }}'                           // API 前缀
        const BK_SHARED_RES_BASE_JS_URL = '{{ .BK_SHARED_RES_BASE_JS_URL }}'   // 统一配置的平台资源url（logo，标题，footer，版本号等）
        const BK_LOGIN_URL = '{{ .BK_LOGIN_URL }}'                             // 登录地址
        const BK_REQUEST_ID_HEADER_KEY = '{{ .BK_REQUEST_ID_HEADER_KEY }}'     // x-bkapi-request-id
        const PASSWORD_VAULT_SWITCH = '{{ .PASSWORD_VAULT_SWITCH }}'           // 密码库开关
        const PASSWORD_VAULT_NAME = '{{ .PASSWORD_VAULT_NAME }}'               // 密码库名称
        const BK_DOMAIN = '{{ .BK_DOMAIN }}'                                   // 域名
        const BKAPP_NAV_OPEN_SOURCE_URL = '{{ .BKAPP_NAV_OPEN_SOURCE_URL }}'   // 开源社区地址
        const BK_DOCS_CENTER_URL = '{{ .BK_DOCS_CENTER_URL }}'                 // 产品文档地址
        const BK_USER_WEB_URL = '{{ .BK_USER_WEB_URL }}'                       // 用户中心地址
        const BK_TENANT = '{{ .BK_TENANT }}'                                   // 租户ID
        const ENABLE_NOTICE = '{{ .ENABLE_NOTICE }}'                           // 通知功能开关
        const APP_VERSION = '{{ .APP_VERSION }}'                               // 版本
        const LOGIN_NAME = '{{ .LOGIN_NAME }}'                                   // 当前登录用户名
        const WINDOWS_WMI_PORT_DEFAULT = '{{ .WINDOWS_WMI_PORT_DEFAULT }}'     // Windows WMI 默认端口
        const UNIX_SSH_PORT_DEFAULT = '{{ .UNIX_SSH_PORT_DEFAULT }}'           // Unix SSH 默认端口
        return {
          BK_API_PREFIX,
          BK_SHARED_RES_BASE_JS_URL,
          BK_LOGIN_URL,
          BK_REQUEST_ID_HEADER_KEY,
          PASSWORD_VAULT_SWITCH,
          PASSWORD_VAULT_NAME,
          BK_DOMAIN,
          BKAPP_NAV_OPEN_SOURCE_URL,
          BK_DOCS_CENTER_URL,
          BK_USER_WEB_URL,
          BK_TENANT,
          ENABLE_NOTICE,
          APP_VERSION,
          LOGIN_NAME,
          WINDOWS_WMI_PORT_DEFAULT,
          UNIX_SSH_PORT_DEFAULT,
        }
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
    <noscript> This website requires JavaScript to function properly. Please enable JavaScript to continue. </noscript>
    {{ .BK_PASS_ANALYTICS_SCRIPT }}
  </body>
</html>

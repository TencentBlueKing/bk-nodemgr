# CMDB mock data for integration tests.
# Rules:
#   - DO NOT modify or delete existing entries (other tests depend on them).
#   - Append new entries to the end of each section.
#   - Each section must keep at least one entry.
#   - Bug fixes to existing data are allowed with reviewer approval.

businesses:
  - bk_biz_id: 1
    bk_biz_name: "测试业务1"

areas:
  - bk_cloud_id: 0
    bk_cloud_name: "默认云区域"

hosts:
  - bk_host_id: 1
    bk_biz_id: 1
    bk_cloud_id: 0
    bk_inner_ip: "127.0.0.1"
    bk_inner_ipv6: ""
    bk_os_type: "1"
    bk_cpu_arch: "amd64"

# object attributes for enum constant synchronization
# these attributes define enum options for CMDB object properties
objectAttributes:
  # cloud vendor enum for plat object
  - bk_obj_id: "plat"
    bk_property_id: "bk_cloud_vendor"
    option:
      - id: "0"
        name: "default"

  # os type enum for host object
  - bk_obj_id: "host"
    bk_property_id: "bk_os_type"
    option:
      - id: "1"
        name: "linux"
      - id: "2"
        name: "windows"

  # cpu architecture enum for host object
  - bk_obj_id: "host"
    bk_property_id: "bk_cpu_architecture"
    option:
      - id: "x86_64"
        name: "x86_64"
      - id: "arm64"
        name: "arm64"
      - id: "amd64"
        name: "amd64"

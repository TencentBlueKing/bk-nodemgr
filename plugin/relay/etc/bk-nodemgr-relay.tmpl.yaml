plugin:
  pidFile: "{{ .BK_NODEMGR_PID_FILE }}}"
  messageDomainSocketPath: "{{ .GSE_MESSAGE_DOMAIN_SOCKET_PATH }}"
  messageLocalSocketPort: {{ .BK_NODEMGR_MESSAGE_LOCAL_SOCKET_PORT }}

callbackServer:
  bindIP: "{{ .BK_NODEMGR_CALLBACK_SERVER_BIND_IP }}"
  port: {{ .BK_NODEMGR_CALLBACK_SERVER_PORT }}
  advertiseIPV4: "{{ .BK_NODEMGR_CALLBACK_SERVER_ADVERTISE_IPV4 }}"

downloadServer: 
  bindIP: "{{ .BK_NODEMGR_DOWNLOAD_SERVER_BIND_IP }}"
  port: {{ .BK_NODEMGR_DOWNLOAD_SERVER_PORT }}
  advertiseIPV4: "{{ .BK_NODEMGR_DOWNLOAD_SERVER_ADVERTISE_IPV4 }}"

relayWorkspaceFileGroup:
  fullPath: "{{ .BK_NODEMGR_RELAY_WORKSPACE_FILE_GROUP_FULL_PATH }}"

log:
  dir: "{{ .RELAY_LOG_DIR }}"
  maxSizeMB: "{{ .RELAY_LOG_MAX_SIZE_MB }}"
  maxNum: "{{ .RELAY_LOG_MAX_NUM }}"
  level: "{{ .RELAY_LOG_LEVEL }}"

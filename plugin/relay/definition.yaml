configTemplates:
  - name: bk-nodemgr-relay.conf
    isMainConfig: true
    filePath: etc
    sourcePath: templates/bk-nodemgr-relay.conf.template
    variables:
      - title: Log
        type: object
        default:
        required: false
        description: 日志配置
        descriptionEn: Log Configuration
        properties:
          - title: LogDir
            type: string
            default: ""
            required: false
            description: 日志目录
            descriptionEn: Log Directory
            properties:
          - title: LogLevel
            type: string
            default: INFO
            required: false
            description: 日志级别
            descriptionEn: Log Level
            properties:
          - title: LogMaxSizeMB
            type: number
            default: 100
            required: false
            description: 日志文件最大大小（MB）
            descriptionEn: Log Max Size (MB)
            properties:
          - title: LogMaxNum
            type: number
            default: 7
            required: false
            description: 最大日志文件数量
            descriptionEn: Log Max File Number
            properties:
          - title: LogToStderr
            type: bool
            default: false
            required: false
            description: 是否将日志输出到标准错误
            descriptionEn: Whether to output logs to standard error
            properties:
          - title: LogAlsoToStderr
            type: bool
            default: false
            required: false
            description: 是否同时将日志输出到标准错误
            descriptionEn: Whether to also output logs to standard error
            properties:
      - title: InfoServer
        type: object
        default:
        required: false
        description: 信息服务器信息
        descriptionEn: Info Server Information
        properties:
          - title: Port
            type: number
            default: 28300
            required: false
            description: 绑定端口
            descriptionEn: Bind Port
            properties:
      - title: AdminServer
        type: object
        default:
        required: false
        description: 管理服务器信息
        descriptionEn: Admin Server Information
        properties:
          - title: Port
            type: number
            default: 28301
            required: false
            description: 绑定端口
            descriptionEn: Bind Port
            properties:
      - title: WorkspaceFileGroupFullPath
        type: string
        default: ""
        required: false
        description: 文件分发工作空间路径，留空则按部署环境自动隔离为 /tmp/bknm/{部署环境}/relay（Windows 为 c:/tmp/bknm/{部署环境}/relay）
        descriptionEn: File distribution workspace path. Leave empty to isolate per deploy env at /tmp/bknm/{deploy_env}/relay (c:/tmp/bknm/{deploy_env}/relay on Windows)
        properties:
      - title: Tracing
        type: object
        default:
        required: false
        description: APM 链路追踪配置
        descriptionEn: APM tracing configuration
        properties:
          - title: ExporterType
            type: string
            default: stdout
            required: false
            description: 链路导出类型，支持 stdout 或 otlp
            descriptionEn: Trace exporter type, stdout or otlp
            properties:
          - title: OtlpEndpoint
            type: string
            default: ""
            required: false
            description: OTLP 服务地址，填写 host:port
            descriptionEn: OTLP endpoint in host:port format
            properties:
          - title: OtlpProtocol
            type: string
            default: grpc
            required: false
            description: OTLP 传输协议，支持 grpc 或 http
            descriptionEn: OTLP transport protocol, grpc or http
            properties:
          - title: OtlpInsecure
            type: bool
            default: false
            required: false
            description: 是否使用不加密的 OTLP 连接
            descriptionEn: Whether to use an insecure OTLP connection
            properties:
          - title: OtlpHeaders
            type: array
            default: []
            required: false
            description: OTLP 请求头列表
            descriptionEn: OTLP request headers
            properties:
              - title: Key
                type: string
                default: ""
                required: false
                description: 请求头名称
                descriptionEn: Header name
                properties:
              - title: Value
                type: string
                default: ""
                required: false
                description: 请求头值
                descriptionEn: Header value
                properties:
          - title: GlobalService
            type: object
            default:
            required: false
            description: 全局链路服务配置
            descriptionEn: Global trace service configuration
            properties:
              - title: TraceServiceName
                type: string
                default: relay
                required: false
                description: APM 服务名称
                descriptionEn: APM service name
                properties:
              - title: TraceSampleRate
                type: number
                default: 0
                required: false
                description: 链路采样率，取值范围 0 到 1
                descriptionEn: Trace sample rate from 0 to 1
                properties:
control:
  start: "./start.sh bk-nodemgr-relay"
  stop: "./stop.sh bk-nodemgr-relay"
  restart: "./restart.sh bk-nodemgr-relay"
  reload: "./reload.sh bk-nodemgr-relay"
  debug: "./debug.sh bk-nodemgr-relay"
  version: "./bk-nodemgr-relay -v"

configTemplates:
  - name: bk-nodemgr-relay.conf
    isMainConfig: true
    filePath: etc
    sourcePath: templates/bk-nodemgr-relay.conf.template
    variables:
      - title: Log
        type: object
        default:
        required: false
        description: 日志配置
        descriptionEn: Log Configuration
        properties:
          - title: LogDir
            type: string
            default: ""
            required: false
            description: 日志目录
            descriptionEn: Log Directory
            properties:
          - title: LogLevel
            type: string
            default: INFO
            required: false
            description: 日志级别
            descriptionEn: Log Level
            properties:
          - title: LogMaxSizeMB
            type: number
            default: 100
            required: false
            description: 日志文件最大大小（MB）
            descriptionEn: Log Max Size (MB)
            properties:
          - title: LogMaxNum
            type: number
            default: 7
            required: false
            description: 最大日志文件数量
            descriptionEn: Log Max File Number
            properties:
          - title: LogToStderr
            type: bool
            default: false
            required: false
            description: 是否将日志输出到标准错误
            descriptionEn: Whether to output logs to standard error
            properties:
          - title: LogAlsoToStderr
            type: bool
            default: false
            required: false
            description: 是否同时将日志输出到标准错误
            descriptionEn: Whether to also output logs to standard error
            properties:
      - title: InfoServer
        type: object
        default:
        required: false
        description: 信息服务器信息
        descriptionEn: Info Server Information
        properties:
          - title: Port
            type: number
            default: 28300
            required: false
            description: 绑定端口
            descriptionEn: Bind Port
            properties:
      - title: AdminServer
        type: object
        default:
        required: false
        description: 管理服务器信息
        descriptionEn: Admin Server Information
        properties:
          - title: Port
            type: number
            default: 28301
            required: false
            description: 绑定端口
            descriptionEn: Bind Port
            properties:
      - title: WorkspaceFileGroupFullPath
        type: string
        default: /tmp/bknm/relay/
        required: false
        description: 文件分发工作空间路径
        descriptionEn: File Distribution Workspace Path
        properties:
control:
  start: "./start.sh bk-nodemgr-relay"
  stop: "./stop.sh bk-nodemgr-relay"
  restart: "./restart.sh bk-nodemgr-relay"
  reload: "./reload.sh bk-nodemgr-relay"
  version: "./bk-nodemgr-relay -v"

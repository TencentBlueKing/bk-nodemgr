configTemplates:
  - name: bk-nodemgr-relay.template
    isMainConfig: true
    filePath: etc
    variables:
      - title: LogLevel
        type: string
        default: INFO
        required: false
        description: 日志级别
        descriptionEn: Log Level
        properties:
      - title: LogMaxSizeMB
        type: int
        default: 100
        required: false
        description: 日志文件最大大小（MB）
        descriptionEn: Log Max Size (MB)
        properties:
      - title: LogMaxNum
        type: int
        default: 7
        required: false
        description: 最大日志文件数量
        descriptionEn: Log Max File Number
        properties:
      - title: CallbackServer
        type: object
        default:
        required: true
        description: 回调服务器信息
        descriptionEn: Callback Server Information
        properties:
          - title: BindIP
            type: string
            default:
            required: true
            description: 绑定IP地址
            descriptionEn: Bind IP Address
            properties:
          - title: Port
            type: int
            default:
            required: true
            description: 绑定端口
            descriptionEn: Bind Port
            properties:
          - title: AdvertiseIPV4
            type: string
            default:
            required: false
            description: 广播IPv4地址
            descriptionEn: Advertise IPv4 Address
            properties:
          - title: AdvertiseIPV6
            type: string
            default:
            required: false
            description: 广播IPv6地址
            descriptionEn: Advertise IPv6 Address
            properties:
      - title: DownloadServer
        type: object
        default:
        description: 下载服务器信息
        descriptionEn: Download Server Information
        properties:
          - title: BindIP
            type: string
            default:
            required: true
            description: 绑定IP地址
            descriptionEn: Bind IP Address
            properties:
          - title: Port
            type: int
            default:
            required: true
            description: 绑定端口
            descriptionEn: Bind Port
            properties:
          - title: AdvertiseIPV4
            type: string
            default:
            required: false
            description: 广播IPv4地址
            descriptionEn: Advertise IPv4 Address
            properties:
          - title: AdvertiseIPV6
            type: string
            default:
            required: false
            description: 广播IPv6地址
            descriptionEn: Advertise IPv6 Address
            properties:
      - title: WorkspaceFileGroupFullPath
        type: string
        default: ../workspace/
        required: true
        description: 文件分发工作空间路径
        descriptionEn: File Distribution Workspace Path
        properties:
control:
  start: "./start.sh bk-nodemgr-relay"
  stop: "./stop.sh bk-nodemgr-relay"
  restart: "./restart.sh bk-nodemgr-relay"
  reload: "./reload.sh bk-nodemgr-relay"
  version: "./bk-nodemgr-relay -v"
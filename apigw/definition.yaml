spec_version: 2

release:
  # 发布版本号
  version: 3.0.1-alpha.102
  title: "bk-nodemgr"
  comment: "3.0.1-alpha.102"

apigateway:
  description: "蓝鲸节点管理"
  description_en: "Blue Whale Node Management"
  is_public: false
  api_type: 1
  maintainers:
    - "admin"

stages:
  - name: "prod"
    description: "正式环境"
    description_en: "This is a test"
    backends:
      - name: "default"
        config:
          timeout: 60
          loadbalance: "roundrobin"
          hosts:
            # 网关调用后端服务的默认域名或IP，不包含Path，比如：http://api.example.com
            - host: "https://httpbin.org"
              weight: 100
    mcp_servers:
      - name: "topo"
        title: "节点管理拓扑查询"
        description: >-
          提供节点管理拓扑的只读查询能力，用于查询业务拓扑、网络区域、网络单元、
          接入点、图节点及主机信息，不提供创建、修改或删除操作。
        resource_names:
          - "Topo_BusinessList"
          - "Topo_BusinessHostCountGet"
          - "Topo_BusinessInstTopoGet"
          - "Topo_NetworkAreaList"
          - "Topo_NetworkAreaGet"
          - "Topo_NetworkUnitList"
          - "Topo_NetworkUnitGet"
          - "Topo_AccessPointList"
          - "Topo_AccessPointListBrief"
          - "Topo_TopoGraphNodeGetReq"
          - "Topo_HostList"
        protocol_type: "streamable_http"
        is_public: false
        status: 0
        oauth2_public_client_enabled: false
        oauth2_personal_client_enabled: false
        raw_response_enabled: false

# 资源文档
# 资源文档的目录格式样例如下，en 为英文文档，zh 为中文文档：
# ./
# - en
#   - anything.md
# - zh
#   - anything.md
resource_docs:
  basedir: "/data/apidocs/"

# 主动授权，网关主动给应用，添加访问网关所有资源的权限
grant_permissions:
  - bk_app_code: "{{ settings.BK_APP_CODE }}"
    grant_dimension: "gateway"

related_apps:
  - "{{ settings.BK_APP_CODE }}" # 环境变量方式："{{ environ.BK_APP_CODE }}"

# Product MCP catalog, shared by stages without an explicit deployment override.
mcp_servers:
  - name: "topo"
    title: "节点管理-拓扑查询"
    category_names:
      - "Official"
    description: >-
      提供节点管理拓扑的只读查询能力，用于查询业务拓扑、网络区域、网络单元、
      接入点、图节点及主机信息，不提供创建、修改或删除操作。
    resource_names:
      - "OpenTopo_OpenTopoBusinessList"
      - "OpenTopo_OpenTopoBusinessHostCountGet"
      - "OpenTopo_OpenTopoBusinessInstTopoGet"
      - "OpenTopo_OpenTopoNetworkAreaList"
      - "OpenTopo_OpenTopoNetworkAreaGet"
      - "OpenTopo_OpenTopoNetworkUnitList"
      - "OpenTopo_OpenTopoNetworkUnitGet"
      - "OpenTopo_OpenTopoAccessPointList"
      - "OpenTopo_OpenTopoAccessPointListBrief"
      - "OpenTopo_OpenTopoGraphNodeGet"
      - "OpenTopo_OpenTopoHostList"
    protocol_type: "streamable_http"
    is_public: false
    status: 0
    oauth2_public_client_enabled: false
    oauth2_personal_client_enabled: true
    raw_response_enabled: false
  - name: "execution"
    title: "节点管理-执行诊断"
    category_names:
      - "Official"
    description: >-
      提供节点与插件执行情况的用户态只读查询。调用方需明确指定 node 或 plugin，
      并提供 workflow_id 或 operation_id；通过工作流、操作、执行实例与步骤日志查询定位执行情况。
      operation_id 可直接用于实例查询，无需先查询工作流。节点安装诊断可通过 workflow_id 和 operation_ids
      查询历史 Agent 或 Proxy 安装操作可恢复的参数，不返回认证凭据。不提供重试、终止或修改操作。
    resource_names:
      - "OpenNodeWorkflow_OpenNodeWorkflowList"
      - "OpenNodeWorkflow_OpenNodeWorkflowOperationList"
      - "OpenNodeWorkflow_OpenNodeWorkflowOperationInstallParamsGet"
      - "OpenNodeWorkflow_OpenNodeWorkflowOperationInstanceList"
      - "OpenNodeWorkflow_OpenNodeWorkflowOperationInstanceLogGet"
      - "OpenPluginWorkflow_OpenPluginWorkflowList"
      - "OpenPluginWorkflow_OpenPluginWorkflowOperationList"
      - "OpenPluginWorkflow_OpenPluginWorkflowOperationInstanceList"
      - "OpenPluginWorkflow_OpenPluginWorkflowOperationInstanceLogGet"
    protocol_type: "streamable_http"
    is_public: false
    status: 0
    oauth2_public_client_enabled: false
    oauth2_personal_client_enabled: true
    raw_response_enabled: false
  - name: "system-diagnosis"
    title: "节点管理-系统诊断"
    category_names:
      - "Official"
    description: >-
      面向内部维护人员的系统诊断只读入口，统一承载系统诊断工具，采用用户态认证，需网关管理员授权应用。
      当前提供定时任务调度诊断和全局配置查询，用户须具备系统访问及对应功能域的平台管理资源权限。
      全局配置查询需 global_settings 资源权限，返回全局共享数据库中的全部保存值，包括可能敏感的自定义项；
      不读取服务启动配置，不补默认值，不保证为运行时实际生效值，不提供修改或删除。
      workflow_id 查询当前触发器的 Operation，
      operation_id 或 oper_inst_id 可直接查询实例，oper_inst_id 查询步骤及额外执行日志；
      workflow_id 配合 parent_oper_inst_id 查询某轮派发的直接子 Operation，再沿同一实例及日志链路下钻。
      enabled、interval 表示长期调度配置，不表示执行完成；父实例 success 不代表子任务成功。
      仅查询当前触发器关联且尚未清理的记录，不提供完整历史归档，不提供启停、重试、终止或立即执行。
    resource_names:
      - "OpenScheduleWorkflow_OpenScheduleWorkflowList"
      - "OpenScheduleWorkflow_OpenScheduleWorkflowOperationList"
      - "OpenScheduleWorkflow_OpenScheduleWorkflowOperationInstanceList"
      - "OpenScheduleWorkflow_OpenScheduleWorkflowOperationInstanceLogGet"
      - "OpenGlobalSettings_OpenGlobalSettingsList"
    protocol_type: "streamable_http"
    is_public: false
    status: 0
    oauth2_public_client_enabled: false
    oauth2_personal_client_enabled: false
    raw_response_enabled: false

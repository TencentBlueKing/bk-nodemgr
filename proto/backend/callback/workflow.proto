syntax = "proto3";
package callback;
option go_package = "github.com/TencentBlueKing/bk-nodemgr/pkg/protocol/backend/callback";

import "common.proto";

import "google/api/annotations.proto";

// GetAgentConfReq describes the HTTP request body when get agent conf.
message GetAgentConfReq {
  string os_type = 1;
  string cpu_arch = 2;
  string node_role = 3;
  string token = 4;
}

// GetFileProxyConfReq describes the HTTP request body when get file proxy conf.
message GetFileProxyConfReq {
  string os_type = 1;
  string cpu_arch = 2;
  string node_role = 3;
  string token = 4;
}

// GetDataProxyConfReq describes the HTTP request body when get data proxy conf.
message GetDataProxyConfReq {
  string os_type = 1;
  string cpu_arch = 2;
  string node_role = 3;
  string token = 4;
}

// GetCheckListReq describes the HTTP request body when get check list.
message GetCheckListReq {
  string os_type = 1;
  string cpu_arch = 2;
  string node_role = 3;
  string token = 4;
}

// ReportLogReq describes the HTTP request body when report log.
message ReportLogReq {
  string token = 1;
  repeated ReportLog logs = 2;
  string oper_inst_id = 3;
}

// ReportLog
message ReportLog {
  int64 timestamp = 1;
  string level = 2;
  string step = 3;
  string log = 4;
  string status = 5;
}

// ReportDataReq describes the HTTP request body when report data.
message ReportDataReq {
  string token = 1;
  string agent_id = 2;
}

// ReportStatusReq describes the HTTP request body when report status.
message ReportStatusReq {
  string token = 1;
  string status = 2;
  string oper_inst_id = 3;
}

// ReportFileState describes the HTTP request body when report relay file.
message ReportFileStateReq {
  string action_name = 1;
  string oper_inst_id = 2;
  string storage_tmp_dir = 3;
  message fileState {
    string file_name = 1;
    string file_status = 2;
  }
  repeated fileState file_state = 4;
}

// ReportStorageResultReq describes the HTTP request body when report relay
// storage result.
message ReportStorageResultReq {
  string action_name = 1;
  string oper_inst_id = 2;
  string err_msg = 3;
}

// ReportDetectResultReq describes the HTTP request body when report relay
// detect result.
message ReportDetectResultReq {
  string action_name = 1;
  string oper_inst_id = 2;
  string err_msg = 3;
  string os_type = 4;
  string cpu_arch = 5;
  string connection_dir = 6;
}

// ReportInstallResultReq describes the HTTP request body when report relay
// install by ssh result.
message ReportInstallResultReq {
  string action_name = 1;
  string oper_inst_id = 2;
  string err_msg = 3;
  string out_str = 4;
}

// PluginReportLogReq describes the HTTP request body when report log.
message PluginReportLogReq {
  string token = 1;
  repeated PluginReportLog logs = 2;
  string oper_inst_id = 3;
}

// PluginReportLog
message PluginReportLog {
  int64 timestamp = 1;
  string level = 2;
  string step = 3;
  string log = 4;
  string status = 5;
}
// PluginReportLogResp describes the HTTP request body when report log.
message PluginReportLogResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;

  message Data {}
  Data data = 5;
}

// PluginReportStatusReq describes the HTTP request body when report status.
message PluginReportStatusReq {
  string token = 1;
  string status = 2;
  string oper_inst_id = 3;
}

// PluginReportStatusResp describes the HTTP request body when report status.
message PluginReportStatusResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;

  message Data {}
  Data data = 5;
}

// PluginGetMainConfigReq describes the HTTP request body when get agent conf.
message PluginGetMainConfigReq { string token = 1; }

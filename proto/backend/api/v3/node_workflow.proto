syntax = "proto3";
package v3;
option go_package = "github.com/TencentBlueKing/bk-nodemgr/pkg/protocol/backend/api/v3";

import "common.proto";
import "workflow.proto";
import "node_agent.proto";
import "node_proxy.proto";

import "google/api/annotations.proto";

// NodeWorkflowInfo describes the node workflow information.
message NodeWorkflowInfo {
  optional string tenant_id = 1;
  optional string workflow_id = 2;
  optional string trigger_id = 3;
  optional string type = 4;
  repeated int64 bk_biz_id = 5;
  repeated int64 bk_networkarea_id = 6;
  repeated int64 bk_networkunit_id = 7;
  optional string operator = 8;
  optional int64 operate_time = 9;
  optional int64 finish_time = 10;
  optional string status = 11;
}

// NodeWorkflowExactConditions describes the exact conditions of node workflow
// list request.
message NodeWorkflowExactConditions {
  repeated string workflow_id = 1;
  repeated string type = 2;
  repeated int64 bk_biz_id = 3;
  repeated string status = 4;
  repeated string operator = 5;
}

// NodeWorkflowFuzzyConditions describes the fuzzy conditions of node workflow
// list request.
message NodeWorkflowFuzzyConditions {}

// NodeWorkflowListReq describes the node workflow list request.
message NodeWorkflowListReq {
  Page page = 1;
  bool only_count = 2;

  NodeWorkflowExactConditions exact_include_conditions = 3;
  NodeWorkflowFuzzyConditions fuzzy_include_conditions = 4;
  TimeRange operate_time_range = 5;
}

// NodeWorkflowListResp describes the node workflow list response.
message NodeWorkflowListResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {
    int64 total = 1;
    repeated NodeWorkflowInfo items = 2;
  }
  Data data = 5;
}

// NodeWorkflowDistinctReq describes the node workflow distinct request.
message NodeWorkflowDistinctReq {
  NodeWorkflowExactConditions exact_include_conditions = 1;
  NodeWorkflowFuzzyConditions fuzzy_include_conditions = 2;
}

// NodeWorkflowDistinctResp describes the node workflow distinct response.
message NodeWorkflowDistinctResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {
    repeated string type = 1;
    repeated int64 bk_biz_id = 2;
    repeated string operator = 3;
    repeated string status = 4;
  }
  Data data = 5;
}

// NodeWorflowOperationInstance describes the node operation instance.
message NodeWorflowOperationInstance {
  string operation_id = 1;
  string oper_inst_id = 2;
  string oper_inst_status = 3;
  string bk_host_innerip = 4;
  string bk_networkunit_id = 5;
  string bk_biz_id = 6;
  string node_version = 7;

  message Action {
    string action_name = 1;
    string action_status = 2;
    int64 cost_time_sec = 3;
  }
  repeated Action action = 8;
}

// NodeWorkflowOperationListReq describes the node operation list
// request.
message NodeWorkflowOperationListReq {
  bool only_count = 1;
  Page page = 2;
  string workflow_id = 3;
  message ExactConditions {
    repeated string node_version = 1;
    repeated string bk_host_innerip = 2;
    repeated string bk_host_innerip_v6 = 3;
    repeated int64 bk_biz_id = 4;
    repeated int64 bk_networkarea_id = 5;
    repeated int64 bk_networkunit_id = 6;
    repeated string state = 7;
  }

  message FuzzyConditions {}
  ExactConditions exact_include_conditions = 4;
  FuzzyConditions fuzzy_include_conditions = 5;
}

// NodeWorkflowOperationListResp describes the node operation list by
// workflow-id response.
message NodeWorkflowOperationListResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message NodeDeploymentInfo {
    int64 bk_host_id = 1;
    int64 bk_biz_id = 2;
    repeated string bk_host_innerip_list = 3;
    repeated string bk_host_innerip_v6_list = 4;
    int64 bk_networkarea_id = 5;
    int64 bk_networkunit_id = 6;
    string node_version = 7;
  }

  message LatestOperInstBriefData {
    WorkflowLifeCycle life_cycle = 1;
    WorkflowActionInstBriefData latest_action_inst_brief_data = 5;
  }

  message NodeWorkflowOperation {
    string operation_id = 1;
    repeated string instance_ids = 2;
    string operator = 3;
    int64 create_time = 4;
    NodeDeploymentInfo node_deployment_info = 5;
    LatestOperInstBriefData latest_oper_inst_brief_data = 6;
  }

  message Data {
    repeated NodeWorkflowOperation operations = 1;
    int64 total = 2;
  }

  Data data = 5;
}

// NodeWorkflowOperationDistinctSelector describes the node workflow operation
// distinct selector.
message NodeWorkflowOperationDistinctSelector { bool state = 1; }

// NodeWorkflowOperationDistinctReq describes the node workflow operation
// distinct request.
message NodeWorkflowOperationDistinctReq {
  string workflow_id = 1;
  NodeWorkflowOperationDistinctSelector selector = 2;
}

// NodeWorkflowOperationDistinctResp describes the node workflow operation
// distinct response.
message NodeWorkflowOperationDistinctResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data { repeated string state = 1; }
  Data data = 5;
}

// NodeWorkflowOperationInstanceListReq describes the node operation instance
// list by operation-id request.
message NodeWorkflowOperationInstanceListReq {
  bool only_count = 1;
  repeated string operation_id = 2;
  repeated string oper_inst_id = 3;
}

// NodeWorkflowOperationInstanceListResp describes the node operation instance
// list by operation-id response.
message NodeWorkflowOperationInstanceListResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {
    int64 total = 1;
    repeated WorflowOperationInstanceData oper_inst_data = 2;
  }
  Data data = 5;
}

// NodeWorkflowOperationInstanceLogGetReq describes the node operation instance
// log request.
message NodeWorkflowOperationInstanceLogGetReq { string oper_inst_id = 1; }

// NodeWorkflowOperationInstanceLogGetResp describes the node operation action
// instance log response.
message NodeWorkflowOperationInstanceLogGetResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {
    map<string, WorkflowActionData> oper_inst_logs = 1;
    WorkflowActionMessage extra_execution_logs = 2;
  }
  Data data = 5;
}

// NodeWorkflowOperationRetryReq
message NodeWorkflowOperationRetryReq {
  string workflow_id = 1;
  string retry_mod = 2;
  repeated string operation_ids = 3;
}

// NodeWorkflowOperationRetryResp
message NodeWorkflowOperationRetryResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {}
  Data data = 5;
}

// NodeWorkflowOperationTerminateReq
message NodeWorkflowOperationTerminateReq {
  string workflow_id = 1;
  repeated string operation_ids = 2;
}

// NodeWorkflowOperationTerminateResp
message NodeWorkflowOperationTerminateResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {}
  Data data = 5;
}

// ManualCommand describes the manual command.
message ManualCommand {
  string type = 1;
  string command = 2;
};

// ManualInfo describes the manual info.
message ManualInfo {
  repeated NetworkPolicy network_policies = 1;
  repeated ManualCommand commands = 2;
}

// NodeWorkflowOperationManualInfoGetReq
message NodeWorkflowOperationManualInfoGetReq {
  string workflow_id = 1;
  string operation_id = 2;
}

// NodeWorkflowOperationManualInfoGetResp
message NodeWorkflowOperationManualInfoGetResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  ManualInfo data = 5;
}

// NodeWorkflowOperationInstanceStatusDistributionListReq
// describes the node workflow latest operation instance status distribution
// request.
message NodeWorkflowOperationInstanceStatusDistributionListReq {
  repeated string trigger_id = 1;
}

// NodeWorkflowOperationInstanceStatusDistributionListResp describes
// the node workflow latest operation instance status distribution response.
message NodeWorkflowOperationInstanceStatusDistributionListResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;
  message StatusDistribution {
    int64 not_inited_count = 1;
    map<string, int64> state_counts = 2;
  }
  message Data { map<string, StatusDistribution> items = 1; }
  Data data = 5;
}

// NodeWorkflowOperationOfflineInstallInfoGetReq describes the offline install
// info get request.
message NodeWorkflowOperationOfflineInstallInfoGetReq {
  string operation_id = 1;
}

// NodeWorkflowOperationOfflineInstallInfoGetResp describes the offline install
// info get response.
message NodeWorkflowOperationOfflineInstallInfoGetResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message ReleaseInfo {
    int64 generation = 1;
    string os_type = 2;
    string cpu_arch = 3;
    string version = 4;
  }

  message InstallerInfo {
    int64 generation = 1;
    string os_type = 2;
    string cpu_arch = 3;
  }

  message Data {
    string install_script = 1;
    string metadata = 2;
    map<string, string> configs = 3;
    string precheck = 4;
    ReleaseInfo release_info = 5;
    InstallerInfo installer_info = 6;
    string package_name = 7;
  }
  Data data = 5;
}

// NodeWorkflowOperationOfflineInstallResultSubmitReq describes the offline
// install result submit request.
message NodeWorkflowOperationOfflineInstallResultSubmitReq {
  string operation_id = 1;
  string result_data = 2;
}

// NodeWorkflowOperationOfflineInstallResultSubmitResp describes the offline
// install result submit response.
message NodeWorkflowOperationOfflineInstallResultSubmitResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;
}

// NodeWorkflow provdies node workflow service.
service NodeWorkflow {
  // NodeWorkflowList provides node workflow list.
  rpc NodeWorkflowList(NodeWorkflowListReq) returns (NodeWorkflowListResp) {
    option (google.api.http) = {
      post : "/api/v3/node/workflow/list"
      body : "*"
    };
  }

  // NodeWorkflowDistinct provides node workflow distinct.
  rpc NodeWorkflowDistinct(NodeWorkflowDistinctReq)
      returns (NodeWorkflowDistinctResp) {
    option (google.api.http) = {
      post : "/api/v3/node/workflow/distinct"
      body : "*"
    };
  }

  // NodeWorkflowOperationList provides node workflow operation list.
  rpc NodeWorkflowOperationList(NodeWorkflowOperationListReq)
      returns (NodeWorkflowOperationListResp) {
    option (google.api.http) = {
      post : "/api/v3/node/workflow/operation/list"
      body : "*"
    };
  }

  // NodeWorkflowOperationDistinct provides node workflow operation distinct.
  rpc NodeWorkflowOperationDistinct(NodeWorkflowOperationDistinctReq)
      returns (NodeWorkflowOperationDistinctResp) {
    option (google.api.http) = {
      post : "/api/v3/node/workflow/operation/distinct"
      body : "*"
    };
  }

  // NodeWorkflowOperationInstanceStatusDistribution provides latest operation
  // instance status distribution.
  rpc NodeWorkflowOperationInstanceStatusDistributionList(
      NodeWorkflowOperationInstanceStatusDistributionListReq)
      returns (NodeWorkflowOperationInstanceStatusDistributionListResp) {
    option (google.api.http) = {
      post : "/api/v3/node/workflow/operation/instance/status_distribution/list"
      body : "*"
    };
  }

  // NodeWorkflowOperationInstanceList provides node workflow operation instance
  // list.
  rpc NodeWorkflowOperationInstanceList(NodeWorkflowOperationInstanceListReq)
      returns (NodeWorkflowOperationInstanceListResp) {
    option (google.api.http) = {
      post : "/api/v3/node/workflow/operation/instance/list"
      body : "*"
    };
  }

  // NodeWorkflowOperationInstanceLogGet provides node operation instance log
  // get.
  rpc NodeWorkflowOperationInstanceLogGet(
      NodeWorkflowOperationInstanceLogGetReq)
      returns (NodeWorkflowOperationInstanceLogGetResp) {
    option (google.api.http) = {
      post : "/api/v3/node/workflow/operation/instance/log/get"
      body : "*"
    };
  }

  // NodeWorkflowOperationRetry provides node operation retry.
  rpc NodeWorkflowOperationRetry(NodeWorkflowOperationRetryReq)
      returns (NodeWorkflowOperationRetryResp) {
    option (google.api.http) = {
      post : "/api/v3/node/workflow/operation/retry"
      body : "*"
    };
  }

  // NodeWorkflowOperationTerminate provides node operation terminate.
  rpc NodeWorkflowOperationTerminate(NodeWorkflowOperationTerminateReq)
      returns (NodeWorkflowOperationTerminateResp) {
    option (google.api.http) = {
      post : "/api/v3/node/workflow/operation/terminate"
      body : "*"
    };
  }

  // NodeWorkflowOperationManualInfoGet provides node operation manual info get.
  rpc NodeWorkflowOperationManualInfoGet(NodeWorkflowOperationManualInfoGetReq)
      returns (NodeWorkflowOperationManualInfoGetResp) {
    option (google.api.http) = {
      post : "/api/v3/node/workflow/operation/manual/info/get"
      body : "*"
    };
  }

  // NodeWorkflowOperationOfflineInstallInfoGet returns scripts, metadata,
  // release and installer constraints for proxy offline manual install (POST
  // /api/v3/node/workflow/operation/offline/info).
  rpc NodeWorkflowOperationOfflineInstallInfoGet(
      NodeWorkflowOperationOfflineInstallInfoGetReq)
      returns (NodeWorkflowOperationOfflineInstallInfoGetResp) {
    option (google.api.http) = {
      post : "/api/v3/node/workflow/operation/offline/info"
      body : "*"
    };
  }

  // NodeWorkflowOperationOfflineInstallResultSubmit accepts installer output
  // JSON and resumes the workflow (POST
  // /api/v3/node/workflow/operation/offline/result).
  rpc NodeWorkflowOperationOfflineInstallResultSubmit(
      NodeWorkflowOperationOfflineInstallResultSubmitReq)
      returns (NodeWorkflowOperationOfflineInstallResultSubmitResp) {
    option (google.api.http) = {
      post : "/api/v3/node/workflow/operation/offline/result"
      body : "*"
    };
  }
}

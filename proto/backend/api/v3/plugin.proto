syntax = "proto3";
package v3;
option go_package = "github.com/TencentBlueKing/bk-nodemgr/pkg/protocol/backend/api/v3";

import "common.proto";
import "workflow.proto";

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";

// PluginInstallReq describes the plugin install request.
message PluginInstallReq {
  message DeploymentSpec {
    optional ProcessResource resource = 1;
    optional ProcessMonitorPolicy monitor_policy = 2;
  }

  message InstallInfo {
    int64 bk_host_id = 1;
    string plugin_name = 2;
    string version = 3;
    repeated string config_template_name = 4;
    optional google.protobuf.Struct custom_config_context = 5;
    optional DeploymentSpec custom_spec = 6;
  }

  repeated InstallInfo plugin = 1;
}

// PluginInstallResp describes the plugin install response.
message PluginInstallResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data { string workflow_id = 1; }
  Data data = 5;
}

// PluginUpgradeReq describes the plugin upgrade request.
message PluginUpgradeReq {
  message UpgradeInfo {
    int64 bk_host_id = 1;
    string plugin_name = 2;
    string version = 3;
    repeated string config_template_name = 4;
    optional google.protobuf.Struct custom_config_context = 5;
  }

  repeated UpgradeInfo plugin = 1;
}

// PluginUpgradeResp describes the plugin upgrade response.
message PluginUpgradeResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data { string workflow_id = 1; }
  Data data = 5;
}

// PluginUninstallReq describes the plugin uninstall request.
message PluginUninstallReq {
  message UninstallInfo {
    int64 bk_host_id = 1;
    string plugin_name = 2;
  }

  repeated UninstallInfo plugin = 1;
}

// PluginListConfigFilesReq describes the plugin config file list request.
message PluginListConfigFilesReq {
  int64 bk_host_id = 1;
  string plugin_name = 2;
}

// PluginListConfigFilesResp describes the plugin config file list response.
message PluginListConfigFilesResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message ConfigFile {
    string name = 1;
    string template_name = 2;
    string process_name = 3;
    int64 bk_host_id = 4;
    string set = 5;
    bool is_main_config = 6;
    string content = 7;
    string md5 = 8;
    string file_path = 9;
    google.protobuf.Struct custom_config_context = 10;
  }

  message Data { repeated ConfigFile items = 1; }
  Data data = 5;
}

// PluginUninstallResp describes the plugin uninstall response.
message PluginUninstallResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data { string workflow_id = 1; }
  Data data = 5;
}

// PluginApplySubConfigReq describes the plugin apply sub-configuration
// request.
message PluginApplySubConfigReq {
  message ApplySubConfigInfo {
    int64 bk_host_id = 1;
    string plugin_name = 2;
    repeated string config_template_name = 3;
    optional google.protobuf.Struct custom_config_context = 4;
  }

  repeated ApplySubConfigInfo plugin = 1;
}

// PluginApplySubConfigResp describes the plugin apply sub-configuration
// response.
message PluginApplySubConfigResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data { string workflow_id = 1; }
  Data data = 5;
}

// PluginRemoveSubConfigReq describes the plugin remove sub-configuration
// request.
message PluginRemoveSubConfigReq {
  message RemoveSubConfigInfo {
    int64 bk_host_id = 1;
    string plugin_name = 2;
    // Select sub-config files by the originating template name. When set,
    // config_file_name MUST be empty.
    repeated string config_template_name = 3;
    // Select sub-config files by exact file name. When set,
    // config_template_name MUST be empty.
    repeated string config_file_name = 4;
  }

  repeated RemoveSubConfigInfo plugin = 1;
}

// PluginRemoveSubConfigResp describes the plugin remove sub-configuration
// response.
message PluginRemoveSubConfigResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data { string workflow_id = 1; }
  Data data = 5;
}

// PluginListReq describes the plugin list request.
message PluginListReq {
  Page page = 1;
  bool only_count = 2;

  message ExactConditions {
    repeated string name = 1;
    repeated string group = 2;
    repeated int64 visible_biz_ids = 3;
  }
  ExactConditions exact_include_conditions = 3;

  message FuzzyConditions {
    repeated string name = 1;
    repeated string pkg_name = 2;
  }
  FuzzyConditions fuzzy_include_conditions = 4;
}

// PluginListResp describes the plugin list response.
message PluginListResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Plugin {
    optional string tenant_id = 1;
    optional string name = 2;
    optional string group = 3;
    optional string pkg_name = 4;
    optional string memo = 5;
    repeated int64 visible_biz_ids = 6;
  }

  message Data {
    int64 total = 1;
    repeated Plugin items = 2;
  }
  Data data = 5;
}

// PluginSetMemoReq describes the plugin set memo request.
message PluginSetMemoReq {
  string plugin_name = 1;
  string memo = 2;
}

// PluginSetMemoResp describes the plugin set memo response.
message PluginSetMemoResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;
}

// PluginRestartReq describes the plugin restart request.
message PluginRestartReq {
  message RestartInfo {
    int64 bk_host_id = 1;
    string plugin_name = 2;
  }

  repeated RestartInfo plugin = 1;
}

// PluginStartReq describes the plugin start request.
message PluginStartReq {
  message StartInfo {
    int64 bk_host_id = 1;
    string plugin_name = 2;
  }

  repeated StartInfo plugin = 1;
}

// PluginStartResp describes the plugin start response.
message PluginStartResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data { string workflow_id = 1; }
  Data data = 5;
}

// PluginRestartResp describes the plugin restart response.
message PluginRestartResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data { string workflow_id = 1; }
  Data data = 5;
}

// PluginStopReq describes the plugin stop request.
message PluginStopReq {
  message StopInfo {
    int64 bk_host_id = 1;
    string plugin_name = 2;
  }

  repeated StopInfo plugin = 1;
}

// PluginStopResp describes the plugin stop response.
message PluginStopResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data { string workflow_id = 1; }
  Data data = 5;
}

// PluginStartDebugReq describes the plugin debug start request.
message PluginStartDebugReq {
  message DebugInfo {
    ScopeInstance scope = 1;
    string plugin_name = 2;
    string version = 3;
    repeated string config_template_name = 4;
    optional google.protobuf.Struct custom_config_context = 5;
  }

  DebugInfo debug_info = 1;
}

// PluginStartDebugResp describes the plugin debug start response.
message PluginStartDebugResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data { string workflow_id = 1; }
  Data data = 5;
}

// PluginStopDebugReq describes the plugin debug stop request.
message PluginStopDebugReq { string workflow_id = 1; }

// PluginStopDebugResp describes the plugin debug stop response.
message PluginStopDebugResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {}
  Data data = 5;
}

// PluginMigrateFromV2Req describes the plugin migrate from v2 request.
message PluginMigrateFromV2Req {
  message MigrateFromV2Info {
    int64 bk_host_id = 1;
    string plugin_name = 2;
  }

  repeated MigrateFromV2Info plugin = 1;
}

// PluginMigrateFromV2Resp describes the plugin migrate from v2 response.
message PluginMigrateFromV2Resp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data { string workflow_id = 1; }
  Data data = 5;
}

service Plugin {
  // InstallPlugin installs a plugin on specified hosts.
  rpc InstallPlugin(PluginInstallReq) returns (PluginInstallResp) {
    option (google.api.http) = {
      post : "/api/v3/plugin/install"
      body : "*"
    };
  }

  // UpgradePlugin upgrades a plugin on specified hosts.
  rpc UpgradePlugin(PluginUpgradeReq) returns (PluginUpgradeResp) {
    option (google.api.http) = {
      post : "/api/v3/plugin/upgrade"
      body : "*"
    };
  }

  // UninstallPlugin uninstalls a plugin on specified hosts.
  rpc UninstallPlugin(PluginUninstallReq) returns (PluginUninstallResp) {
    option (google.api.http) = {
      post : "/api/v3/plugin/uninstall"
      body : "*"
    };
  }

  // ListPluginConfigFiles lists plugin config files by host ID and plugin name.
  rpc ListPluginConfigFiles(PluginListConfigFilesReq)
      returns (PluginListConfigFilesResp) {
    option (google.api.http) = {
      post : "/api/v3/plugin/list_config_files"
      body : "*"
    };
  }

  // ApplyPluginSubConfig applies sub-configuration for a plugin on specified
  // hosts.
  rpc ApplyPluginSubConfig(PluginApplySubConfigReq)
      returns (PluginApplySubConfigResp) {
    option (google.api.http) = {
      post : "/api/v3/plugin/apply_subconfig"
      body : "*"
    };
  }

  // RemovePluginSubConfig removes a non-main sub-configuration file (or set of
  // such files selected by template name) from a single host + plugin and
  // reloads the plugin once after the remote files have been deleted.
  rpc RemovePluginSubConfig(PluginRemoveSubConfigReq)
      returns (PluginRemoveSubConfigResp) {
    option (google.api.http) = {
      post : "/api/v3/plugin/remove_subconfig"
      body : "*"
    };
  }

  // ListPlugins lists plugins based on the given conditions.
  rpc ListPlugins(PluginListReq) returns (PluginListResp) {
    option (google.api.http) = {
      post : "/api/v3/plugin/list"
      body : "*"
    };
  }

  // SetPluginMemo sets the memo for a plugin.
  rpc SetPluginMemo(PluginSetMemoReq) returns (PluginSetMemoResp) {
    option (google.api.http) = {
      post : "/api/v3/plugin/set_memo"
      body : "*"
    };
  }

  // StartPlugin starts the plugin process on specified hosts.
  rpc StartPlugin(PluginStartReq) returns (PluginStartResp) {
    option (google.api.http) = {
      post : "/api/v3/plugin/start"
      body : "*"
    };
  }

  // RestartPlugin restarts the plugin process on specified hosts.
  rpc RestartPlugin(PluginRestartReq) returns (PluginRestartResp) {
    option (google.api.http) = {
      post : "/api/v3/plugin/restart"
      body : "*"
    };
  }

  // StopPlugin stops the plugin process on specified hosts.
  rpc StopPlugin(PluginStopReq) returns (PluginStopResp) {
    option (google.api.http) = {
      post : "/api/v3/plugin/stop"
      body : "*"
    };
  }

  // StartDebugPlugin starts a one-shot plugin debug workflow.
  rpc StartDebugPlugin(PluginStartDebugReq) returns (PluginStartDebugResp) {
    option (google.api.http) = {
      post : "/api/v3/plugin/start_debug"
      body : "*"
    };
  }

  // StopDebugPlugin requests a running plugin debug workflow to stop.
  rpc StopDebugPlugin(PluginStopDebugReq) returns (PluginStopDebugResp) {
    option (google.api.http) = {
      post : "/api/v3/plugin/stop_debug"
      body : "*"
    };
  }

  // MigratePluginFromV2 migrates plugin process from v2 on specified hosts.
  rpc MigratePluginFromV2(PluginMigrateFromV2Req)
      returns (PluginMigrateFromV2Resp) {
    option (google.api.http) = {
      post : "/api/v3/plugin/migrate_from_v2"
      body : "*"
    };
  }
}

syntax = "proto3";
package v3;
option go_package = "github.com/TencentBlueKing/bk-nodemgr/pkg/protocol/backend/api/v3";

import "common.proto";

import "google/api/annotations.proto";

// WorflowOperationInstanceData describes the workflow operation instance data.
message WorflowOperationInstanceData {
  string operation_id = 1;
  string oper_inst_id = 2;
  string oper_inst_status = 3;
  string operation_def_name = 4;
  string parent_operation_id = 5;
  repeated string action_names = 6;
  WorkflowLifeCycle life_cycle = 7;
  WorkflowActionInstBriefData latest_action_inst_brief_data = 8;
}

// WorkflowLifeCycle describes the workflow life cycle.
message WorkflowLifeCycle {
  string state = 1;
  int64 create_time = 2;
  int64 start_time = 3;
  int64 end_time = 4;
  int64 stop_time = 5;
}

// WorkflowActionInstBriefData describes the workflow action instance brief
// data.
message WorkflowActionInstBriefData {
  string name = 1;
  repeated string tags = 2;
}

// WorkflowActionData describes the workflow action data.
message WorkflowActionData {
  WorkflowLifeCycle life_cycle = 1;
  WorkflowActionMessage message = 2;
  string display_name_zh = 3; // Chinese display name
  string display_name_en = 4; // English display name
}

// WorkflowActionMessage describes the workflow action message logs.
message WorkflowActionMessage {
  message Message {
    int64 time = 1;
    string text = 2; // Deprecated: kept for backward compatibility
    string level = 3;
    string text_zh = 4; // Chinese log content
    string text_en = 5; // English log content
  }
  repeated Message logs = 1;
}

// WorkflowOperationInstanceStatus describes the workflow operation instance
// status.
message WorkflowOperationInstanceStatus {
  int64 index = 1;
  string operation_id = 2;
  string status = 3;
  string trigger_id = 4;
  string operation_instance_id = 5;
}
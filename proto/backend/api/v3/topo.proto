  repeated CycleTime cycle_times = 7;
}

// TopoGraphNodeGetResp describes the HTTP response body when get node
message TopoGraphNodeGetResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data { repeated GraphNodeInfo graph_node_info = 1; }
  Data data = 5;
}


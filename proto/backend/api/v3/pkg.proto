// ConfigVariables describes the config variables of plugin release.
message ConfigVariables {
  message Property {
    string title = 1;
    string type = 2;
    bool required = 3;
    google.protobuf.Value default = 4;
    string description = 5;
    string description_en = 6;
    map<string, Property> properties = 7;
  }

  string name = 1;
  string file_path = 2;
  string source_path = 3;
  bool is_main_config = 4;
  string source_content = 5;
  map<string, Property> variables = 6;
}

// PackageReleasePluginGetConfigVariablesResp describes the HTTP response body
// when get config variables of plugin release.

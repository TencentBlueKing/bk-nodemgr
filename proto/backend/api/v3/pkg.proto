  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message ConfigVariablesList { repeated ConfigVariables items = 1; }
  message Data { map<string, ConfigVariablesList> config_variables = 1; }
  Data data = 5;
}


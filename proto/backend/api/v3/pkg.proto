// Package defines the package service.
service Package {
  // ListReleaseAgent lists agent releases.
  rpc ListReleaseAgent(PackageReleaseAgentListReq)
      returns (PackageReleaseAgentListResp) {
    option (google.api.http) = {
      post : "/api/v3/package/release/agent/list"
      body : "*"
    };
  }

  // ListReleaseAgentBrief lists agent release briefs.
  rpc ListReleaseAgentBrief(PackageReleaseAgentListBriefReq)
      returns (PackageReleaseAgentListBriefResp) {
    option (google.api.http) = {
      post : "/api/v3/package/release/agent/list/brief"
      body : "*"
    };
  }

  // DistinctReleaseAgent distincts agent releases.
  rpc DistinctReleaseAgent(PackageReleaseAgentDistinctReq)
      returns (PackageReleaseAgentDistinctResp) {
    option (google.api.http) = {
      post : "/api/v3/package/release/agent/distinct"
      body : "*"
    };
  }

  // SetReleaseAgentLabelsMany sets many agent releases labels.
  rpc SetReleaseAgentLabelsMany(PackageReleaseAgentSetLabelsManyReq)
      returns (PackageReleaseAgentSetLabelsManyResp) {
    option (google.api.http) = {
      post : "/api/v3/package/release/agent/set_labels_many"
      body : "*"
    };
  }

  // EnableReleaseAgent enables agent release.
  rpc EnableReleaseAgent(PackageReleaseAgentEnableReq)
      returns (PackageReleaseAgentEnableResp) {
    option (google.api.http) = {
      post : "/api/v3/package/release/agent/enable"
      body : "*"
    };
  }

  // DisableReleaseAgent disables agent release.
  rpc DisableReleaseAgent(PackageReleaseAgentDisableReq)
      returns (PackageReleaseAgentDisableResp) {
    option (google.api.http) = {
      post : "/api/v3/package/release/agent/disable"
      body : "*"
    };
  }

  // SetAsDefaultReleaseAgent sets agent release as default.
  rpc SetAsDefaultReleaseAgent(PackageReleaseAgentSetAsDefaultReq)
      returns (PackageReleaseAgentSetAsDefaultResp) {
    option (google.api.http) = {
      post : "/api/v3/package/release/agent/set_as_default"
      body : "*"
    };
  }

  // CancelAsDefaultReleaseAgent cancels agent release as default.
  rpc CancelAsDefaultReleaseAgent(PackageReleaseAgentCancelAsDefaultReq)
      returns (PackageReleaseAgentCancelAsDefaultResp) {
    option (google.api.http) = {
      post : "/api/v3/package/release/agent/cancel_as_default"
      body : "*"
    };
  }

  // DeleteReleaseAgent deletes agent release.
  rpc DeleteReleaseAgent(PackageReleaseAgentDeleteReq)
      returns (PackageReleaseAgentDeleteResp) {
    option (google.api.http) = {
      post : "/api/v3/package/release/agent/delete"
      body : "*"
    };
  }

  // ListReleaseProxy lists proxy releases.
  rpc ListReleaseProxy(PackageReleaseProxyListReq)
      returns (PackageReleaseProxyListResp) {
    option (google.api.http) = {
      post : "/api/v3/package/release/proxy/list"
      body : "*"
    };
  }

  // ListReleaseProxyBrief lists proxy release briefs.
  rpc ListReleaseProxyBrief(PackageReleaseProxyListBriefReq)
      returns (PackageReleaseProxyListBriefResp) {
    option (google.api.http) = {
      post : "/api/v3/package/release/proxy/list/brief"
      body : "*"
    };
  }

  // DistinctReleaseProxy distincts proxy releases.
  rpc DistinctReleaseProxy(PackageReleaseProxyDistinctReq)
      returns (PackageReleaseProxyDistinctResp) {
    option (google.api.http) = {
      post : "/api/v3/package/release/proxy/distinct"
      body : "*"
    };
  }

  // SetReleaseProxyLabelsMany sets many proxy releases labels.
  rpc SetReleaseProxyLabelsMany(PackageReleaseProxySetLabelsManyReq)
      returns (PackageReleaseProxySetLabelsManyResp) {
    option (google.api.http) = {
      post : "/api/v3/package/release/proxy/set_labels_many"
      body : "*"
    };
  }

  // EnableReleaseProxy enables proxy release.
  rpc EnableReleaseProxy(PackageReleaseProxyEnableReq)
      returns (PackageReleaseProxyEnableResp) {
    option (google.api.http) = {
      post : "/api/v3/package/release/proxy/enable"
      body : "*"
    };
  }

  // DisableReleaseProxy disables proxy release.
  rpc DisableReleaseProxy(PackageReleaseProxyDisableReq)
      returns (PackageReleaseProxyDisableResp) {
    option (google.api.http) = {
      post : "/api/v3/package/release/proxy/disable"

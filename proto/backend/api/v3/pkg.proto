  // SetAsDefaultReleaseProxy sets proxy release as default.
  rpc SetAsDefaultReleaseProxy(PackageReleaseProxySetAsDefaultReq)
      returns (PackageReleaseProxySetAsDefaultResp) {
    option (google.api.http) = {
      post : "/api/v3/package/release/proxy/set_as_default"
      body : "*"
    };
  }

  // CancelAsDefaultReleaseProxy cancels proxy release as default.
  rpc CancelAsDefaultReleaseProxy(PackageReleaseProxyCancelAsDefaultReq)

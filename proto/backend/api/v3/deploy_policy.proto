syntax = "proto3";
package v3;
option go_package = "github.com/TencentBlueKing/bk-nodemgr/pkg/protocol/backend/api/v3";

import "common.proto";

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";

// DeployPolicyMeta describes the meta of deploy policy.
message DeployPolicyMeta {
  string name = 1;
  string description = 2;
}

// PluginConfigDetail describes the plugin config detail.
// This message defines the structure for plugin config detail, used as
// documentation to help users understand the expected structure of
// config_files_detail in param.
message PluginConfigDetail {
  string name = 1;
  string content = 2;
  bool is_main_config = 3;
}

// SpecifyAgentParam describes the specify agent param structure.
// This message defines the expected structure for param when type is
// "specify_agent". It serves as documentation to help users understand the
// param structure.
message SpecifyAgentParam { string node_version = 1; }

// SpecifyProxyParam describes the specify proxy param structure.
// This message defines the expected structure for param when type is
// "specify_proxy". It serves as documentation to help users understand the
// param structure.
message SpecifyProxyParam { string node_version = 1; }

// SpecifyPluginParam describes the specify plugin param structure.
// This message defines the expected structure for param when type is
// "specify_plugin". It serves as documentation to help users understand the
// param structure.
message SpecifyPluginParam {
  string plugin_name = 1;
  string version = 2;
  google.protobuf.Struct custom_config_context = 3;
}

// SpecifyPluginPkgParam describes the specify plugin pkg param structure.
// This message defines the expected structure for param when type is
// "specify_plugin_pkg". It serves as documentation to help users understand the
// param structure.
message SpecifyPluginPkgParam {
  string plugin_pkg_name = 1;
  string version = 2;
  google.protobuf.Struct custom_config_context = 3;
}

// SpecifyPluginSubConfigParam describes the specify plugin sub config param
// structure. This message defines the expected structure for param when type is
// "specify_plugin_sub_config". It serves as documentation to help users
// understand the param structure.
message SpecifyPluginSubConfigParam {
  string plugin_name = 1;
  repeated PluginConfigDetail config_files_detail = 2;
  google.protobuf.Struct custom_config_context = 3;
}

// DeploySpec describes the spec of deploy policy.
message DeploySpec {
  string type = 1;
  // param is a google.protobuf.Struct that contains the parameters for the
  // deploy spec. The structure of param depends on the type field:
  // - For "specify_agent": see SpecifyAgentParam
  // - For "specify_proxy": see SpecifyProxyParam
  // - For "specify_plugin": see SpecifyPluginParam
  // - For "specify_plugin_pkg": see SpecifyPluginPkgParam
  // - For "specify_plugin_sub_config": see SpecifyPluginSubConfigParam
  google.protobuf.Struct param = 2;
}

// TargetFilter describes the target filter of deploy policy.
message TargetFilter {}

// Scope describes the scope of deploy policy.
message Scope {
  int64 bk_biz_id = 1;
  string type = 2;
  string granularity = 3;
  TargetFilter filter = 4;
  repeated google.protobuf.Struct items = 5;
}

// DeployPolicy describes the deploy policy.
message DeployPolicy {
  int64 deploy_policy_id = 1;
  DeployPolicyMeta meta = 2;
  repeated DeploySpec specs = 3;
  repeated Scope scopes = 4;

  string operator = 5;
  bool enabled = 6;
}

// DeployPolicyExactConditions describes exact conditions of deploy policy.
message DeployPolicyExactConditions {
  repeated int64 deploy_policy_id = 1;
  repeated string deploy_policy_name = 2;
  repeated string operator = 3;
  repeated bool enabled = 4;
}

// DeployPolicyFuzzyConditions describes fuzzy conditions of deploy policy.
message DeployPolicyFuzzyConditions {
  repeated string deploy_policy_name = 1;
  repeated string operator = 2;
}

// DeployPolicyListReq describes HTTP request body when list deploy policy.
message DeployPolicyListReq {
  Page page = 1;
  bool only_count = 2;
  DeployPolicyExactConditions exact_include_conditions = 3;
  DeployPolicyFuzzyConditions fuzzy_include_conditions = 4;
  DeployPolicyExactConditions exact_exclude_conditions = 5;
  DeployPolicyFuzzyConditions fuzzy_exclude_conditions = 6;
  TimeRange executed_time_range = 7;
}

// DeployPolicyListResp describes HTTP response body when list deploy policy.
message DeployPolicyListResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  message Data {
    int64 total = 1;
    repeated DeployPolicy items = 2;
  }
  Data data = 5;
}

// DeployPolicyCreateReq describes HTTP request body when create deploy policy.
message DeployPolicyCreateReq {
  string name = 1;
  string description = 2;
  bool enabled = 3;
  repeated DeploySpec specs = 4;
  repeated Scope scopes = 5;
}

// DeployPolicyCreateResp describes HTTP response body when create deploy
// policy.
message DeployPolicyCreateResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  message Data { optional int64 deploy_policy_id = 1; }
  Data data = 5;
}

// DeployPolicyFields describes the fields of deploy policy.
message DeployPolicyFields {
  bool meta = 1;
  bool scopes = 2;
  bool specs = 3;
  bool enabled = 4;
}

// DeployPolicyUpdateReq describes HTTP request body when update deploy policy.
message DeployPolicyUpdateReq {
  repeated DeployPolicy deploy_policies = 1;
  DeployPolicyFields fields = 2;
}

// DeployPolicyUpdateResp describes HTTP response body when update deploy
// policy.
message DeployPolicyUpdateResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  message Data { optional int64 deploy_policy_id = 1; }
  Data data = 5;
}

// DeployPolicyExecuteReq describes HTTP request body when execute deploy
// policy.
message DeployPolicyExecuteReq { optional int64 deploy_policy_id = 1; }

// DeployPolicyExecuteResp describes HTTP response body when execute deploy
// policy.
message DeployPolicyExecuteResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;

  message Data {}
  Data data = 5;
}

// DeployPolicySvc describes the service of deploy policy.
service DeployPolicySvc {
  // List lists deploy policy.
  rpc List(DeployPolicyListReq) returns (DeployPolicyListResp) {
    option (google.api.http) = {
      post : "/api/v3/deploy_policy/list"
      body : "*"
    };
  }

  // Create creates deploy policy.
  rpc Create(DeployPolicyCreateReq) returns (DeployPolicyCreateResp) {
    option (google.api.http) = {
      post : "/api/v3/deploy_policy/create"
      body : "*"
    };
  }

  // Update updates deploy policy.
  rpc Update(DeployPolicyUpdateReq) returns (DeployPolicyUpdateResp) {
    option (google.api.http) = {
      post : "/api/v3/deploy_policy/update"
      body : "*"
    };
  }

  // Execute executes deploy policy.
  rpc Execute(DeployPolicyExecuteReq) returns (DeployPolicyExecuteResp) {
    option (google.api.http) = {
      post : "/api/v3/deploy_policy/execute"
      body : "*"
    };
  }
}
syntax = "proto3";
package v3;
option go_package = "github.com/TencentBlueKing/bk-nodemgr/pkg/protocol/backend/api/v3";

import "common.proto";

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";

// DeployPolicyMeta describes the meta of deploy policy.
message DeployPolicyMeta {
  string name = 1;
  string description = 2;
}

// PluginConfigDetail describes the plugin config detail.
// This message defines the structure for plugin config detail, used as
// documentation to help users understand the expected structure of
// config_files_detail in param.
message PluginConfigDetail {
  string name = 1;
  string content = 2;
  bool is_main_config = 3;
  string template_name = 4;
}

// SpecifyAgentParam describes the specify agent param structure.
// This message defines the expected structure for param when type is
// "specify_agent". It serves as documentation to help users understand the
// param structure.
message SpecifyAgentParam { string node_version = 1; }

// SpecifyProxyParam describes the specify proxy param structure.
// This message defines the expected structure for param when type is
// "specify_proxy". It serves as documentation to help users understand the
// param structure.
message SpecifyProxyParam { string node_version = 1; }

// SpecifyPluginParam describes the specify plugin param structure.
// This message defines the expected structure for param when type is
// "specify_plugin". It serves as documentation to help users understand the
// param structure.
message SpecifyPluginParam {
  string plugin_name = 1;
  string version = 2;
  google.protobuf.Struct custom_config_context = 3;
}

// SpecifyPluginPkgParam describes the specify plugin pkg param structure.
// This message defines the expected structure for param when type is
// "specify_plugin_pkg". It serves as documentation to help users understand the
// param structure.
message SpecifyPluginPkgParam {
  string plugin_pkg_name = 1;
  string version = 2;
  google.protobuf.Struct custom_config_context = 3;
}

// ProjectPluginPkgToHostsParam describes the project plugin pkg to hosts param
// structure. This message defines the expected structure for param when type is
// "project_plugin_pkg_to_hosts".
message ProjectPluginPkgToHostsParam {
  string plugin_pkg_name = 1;
  string version = 2;
  google.protobuf.Struct custom_config_context = 3;
  repeated int64 placement_host_ids = 4;
}

// ProjectPluginConfigTemplateToHostsParam describes the project plugin config
// template to hosts param structure. This message defines the expected
// structure for param when type is "project_plugin_config_template_to_hosts".
message ProjectPluginConfigTemplateToHostsParam {
  string plugin_name = 1;
  repeated PluginConfigDetail config_files_detail = 2;
  google.protobuf.Struct custom_config_context = 3;
}

// SpecifyPluginSubConfigParam describes the specify plugin sub config param
// structure. This message defines the expected structure for param when type is
// "specify_plugin_sub_config". It serves as documentation to help users
// understand the param structure.
message SpecifyPluginSubConfigParam {
  string plugin_name = 1;
  repeated PluginConfigDetail config_files_detail = 2;
  google.protobuf.Struct custom_config_context = 3;
}

// SpecifyPluginSubConfigTemplateParam describes the specify plugin sub config
// template param structure. This message defines the expected structure for
// param when type is "specify_plugin_sub_config_template". It serves as
// documentation to help users understand the param structure.
message SpecifyPluginSubConfigTemplateParam {
  string plugin_name = 1;
  repeated PluginConfigDetail config_files_detail = 2;
  google.protobuf.Struct custom_config_context = 3;
}

// DeploySpec describes the spec of deploy policy.
message DeploySpec {
  string type = 1;
  // param is a google.protobuf.Struct that contains the parameters for the
  // deploy spec. The structure of param depends on the type field:
  // - For "specify_agent": see SpecifyAgentParam
  // - For "specify_proxy": see SpecifyProxyParam
  // - For "specify_plugin": see SpecifyPluginParam
  // - For "specify_plugin_pkg": see SpecifyPluginPkgParam
  // - For "project_plugin_pkg_to_hosts": see ProjectPluginPkgToHostsParam
  // - For "project_plugin_config_template_to_hosts": see
  // ProjectPluginConfigTemplateToHostsParam
  // - For "specify_plugin_sub_config": see SpecifyPluginSubConfigParam
  // - For "specify_plugin_sub_config_template": see
  // SpecifyPluginSubConfigTemplateParam
  google.protobuf.Struct param = 2;
}

// DeployPolicy describes the deploy policy.
message DeployPolicy {
  int64 deploy_policy_id = 1;
  int64 dsu_id = 2;
  DeployPolicyMeta meta = 3;
  repeated DeploySpec specs = 4;
  repeated Scope scopes = 5;

  string operator = 6;
  bool enabled = 7;
  // Whether all specs should ensure absence. Defaults to false (forward).
  // Currently stored only; execution does not interpret this field yet.
  bool ensure_absent = 8;
}

// DeployPolicyExactConditions describes exact conditions of deploy policy.
message DeployPolicyExactConditions {
  repeated int64 deploy_policy_id = 1;
  repeated int64 dsu_id = 2;
  repeated string deploy_policy_name = 3;
  repeated string operator = 4;
  repeated bool enabled = 5;
}

// DeployPolicyFuzzyConditions describes fuzzy conditions of deploy policy.
message DeployPolicyFuzzyConditions {
  repeated string deploy_policy_name = 1;
  repeated string operator = 2;
}

// DeployPolicyListReq describes HTTP request body when list deploy policy.
message DeployPolicyListReq {
  Page page = 1;
  bool only_count = 2;
  DeployPolicyExactConditions exact_include_conditions = 3;
  DeployPolicyFuzzyConditions fuzzy_include_conditions = 4;
  DeployPolicyExactConditions exact_exclude_conditions = 5;
  DeployPolicyFuzzyConditions fuzzy_exclude_conditions = 6;
  TimeRange executed_time_range = 7;
}

// DeployPolicyListResp describes HTTP response body when list deploy policy.
message DeployPolicyListResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;
  message Data {
    int64 total = 1;
    repeated DeployPolicy items = 2;
  }
  Data data = 5;
}

// DeployPolicyCreateReq describes HTTP request body when create deploy policy.
message DeployPolicyCreateReq {
  string name = 1;
  string description = 2;
  bool enabled = 3;
  repeated DeploySpec specs = 4;
  repeated Scope scopes = 5;
}

// DeployPolicyCreateResp describes HTTP response body when create deploy
// policy.
message DeployPolicyCreateResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;
  message Data { optional int64 deploy_policy_id = 1; }
  Data data = 5;
}

// DeployPolicyFields describes the fields of deploy policy.
message DeployPolicyFields {
  bool meta = 1;
  bool scopes = 2;
  bool specs = 3;
  bool enabled = 4;
  // Update ensure_absent, including an explicit false value.
  bool ensure_absent = 5;
}

// DeployPolicyUpdateReq describes HTTP request body when update deploy policy.
message DeployPolicyUpdateReq {
  repeated DeployPolicy deploy_policies = 1;
  DeployPolicyFields fields = 2;
}

// DeployPolicyUpdateResp describes HTTP response body when update deploy
// policy.
message DeployPolicyUpdateResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;
  message Data { optional int64 deploy_policy_id = 1; }
  Data data = 5;
}

// DeployPolicyExecuteReq describes HTTP request body when execute deploy
// policy.
message DeployPolicyExecuteReq { optional int64 deploy_policy_id = 1; }

// DeployPolicyExecuteResp describes HTTP response body when execute deploy
// policy.
message DeployPolicyExecuteResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {
    reserved 1;
    reserved "trigger_id";
    // Identifies the requested policy's execution, not a child workflow.
    string workflow_id = 2;
  }
  Data data = 5;
}

// DeployPolicyChildWorkflow describes one associated node or plugin workflow.
message DeployPolicyChildWorkflow {
  // node or plugin. The pair (type, workflow_id) is unique within a result.
  string type = 1;
  string workflow_id = 2;
  // running, success, failed, partial_failed, or unknown when unavailable.
  string status = 3;
  // True if a previously created child record is missing; status is unknown.
  bool missing = 4;
}

// DeployPolicyWorkflowResultReq queries one execution in the current tenant.
message DeployPolicyWorkflowResultReq {
  // Required, non-empty deploy policy workflow ID returned by Execute.
  string workflow_id = 1;
}

// DeployPolicyWorkflowResultResp describes a freshly aggregated execution
// result. Unknown takes precedence over running. Finished statuses are success,
// failed, and partial_failed. A child retry can make a later query return
// running again.
message DeployPolicyWorkflowResultResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;
  message Data {
    string workflow_id = 1;
    int64 deploy_policy_id = 2;
    // running, success, failed, partial_failed, or unknown.
    string status = 3;
    // Known actually created children, including missing records. Equals the
    // length of children; excludes unconfirmed creation intents. Not a final
    // total while dispatch is running or evidence is incomplete.
    int64 total_count = 4;
    // Children currently success, failed, or partial_failed. Missing children
    // do not count as finished. Equality with total_count does not imply
    // finish.
    int64 finished_count = 5;
    // running: dispatch/retries open; success: dispatch normally closed;
    // failed: dispatch finally failed and closed; unknown: closure uncertain.
    // Engine timeout alone does not confirm dispatch closure.
    string dispatch_status = 6;
    // Latest dispatch error, or empty when none. May coexist with running
    // during automatic retries; not an API error or a child failure message.
    string dispatch_error = 7;
    // Full associated set, without pagination or permission-filtered subsets.
    // A child may be shared by multiple policy workflows in the same execution.
    repeated DeployPolicyChildWorkflow children = 8;
    // Non-empty explanation for unknown; empty otherwise. Not a machine code.
    string unknown_reason = 9;
  }
  Data data = 5;
}

// DeployPolicySvc describes the service of deploy policy.
service DeployPolicySvc {
  // List lists deploy policy.
  rpc List(DeployPolicyListReq) returns (DeployPolicyListResp) {
    option (google.api.http) = {
      post : "/api/v3/deploy_policy/list"
      body : "*"
    };
  }

  // Create creates deploy policy.
  rpc Create(DeployPolicyCreateReq) returns (DeployPolicyCreateResp) {
    option (google.api.http) = {
      post : "/api/v3/deploy_policy/create"
      body : "*"
    };
  }

  // Update updates deploy policy.
  rpc Update(DeployPolicyUpdateReq) returns (DeployPolicyUpdateResp) {
    option (google.api.http) = {
      post : "/api/v3/deploy_policy/update"
      body : "*"
    };
  }

  // Execute executes deploy policy.
  rpc Execute(DeployPolicyExecuteReq) returns (DeployPolicyExecuteResp) {
    option (google.api.http) = {
      post : "/api/v3/deploy_policy/execute"
      body : "*"
    };
  }

  // WorkflowResult queries one deploy policy execution without blocking.
  rpc WorkflowResult(DeployPolicyWorkflowResultReq)
      returns (DeployPolicyWorkflowResultResp) {
    option (google.api.http) = {
      post : "/api/v3/deploy_policy/workflow/result"
      body : "*"
    };
  }
}

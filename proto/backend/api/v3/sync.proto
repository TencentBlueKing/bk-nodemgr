// sync service.
service Sync {
  // 发起从 CMDB 同步业务与主机信息的任务。
  rpc SyncCmdbHost(SyncCmdbHostReq) returns (SyncCmdbHostResp) {
    option (google.api.http) = {
      post : "/api/v3/sync/cmdb/host"
      body : "*"
    };
  }

  // 发起从 CMDB 同步管控区域的任务。
  rpc SyncCmdbNetworkArea(SyncCmdbNetworkAreaReq)
      returns (SyncCmdbNetworkAreaResp) {
    option (google.api.http) = {
      post : "/api/v3/sync/cmdb/networkarea"
      body : "*"
    };
  }

  // 同步 CMDB 常量。
  rpc SyncCmdbConstants(SyncCmdbConstantsReq) returns (SyncCmdbConstantsResp) {
    option (google.api.http) = {
      post : "/api/v3/sync/cmdb/constants"
      body : "*"
    };
  }

  // 发起从 GSE 同步指定主机 Agent 状态的任务。
  rpc SyncAgentState(SyncAgentStateReq) returns (SyncAgentStateResp) {
    option (google.api.http) = {
      post : "/api/v3/sync/gse/agent/state"
      body : "*"
    };
  }

  // 发起从 GSE 同步全部主机 Agent 状态的任务。
  rpc SyncAllAgentState(SyncAllAgentStateReq) returns (SyncAllAgentStateResp) {
    option (google.api.http) = {
      post : "/api/v3/sync/gse/agent/state/all"
      body : "*"
    };
  }

  // 发起从 GSE 同步指定主机 Agent 信息的任务。
  rpc SyncAgentInfo(SyncAgentInfoReq) returns (SyncAgentInfoResp) {
    option (google.api.http) = {
      post : "/api/v3/sync/gse/agent/info"
      body : "*"
    };
  }

  // 发起校正指定主机 Agent ID 的任务。
  rpc SyncCorrectAgentID(SyncCorrectAgentIDReq)
      returns (SyncCorrectAgentIDResp) {
    option (google.api.http) = {
      post : "/api/v3/sync/gse/agent/correct_agent_id"
      body : "*"
    };
  }

  // 发起从 GSE 同步存活主机 Agent 信息的任务。
  rpc SyncAliveHostAgentInfo(SyncAliveHostAgentInfoReq)
      returns (SyncAliveHostAgentInfoResp) {
    option (google.api.http) = {
      post : "/api/v3/sync/gse/agent/info/alive"
      body : "*"
    };
  }

  // 发起从 GSE 同步指定主机上插件存活进程信息的任务。
  rpc SyncAlivePluginProcessInfo(SyncAlivePluginProcessInfoReq)
      returns (SyncAlivePluginProcessInfoResp) {
    option (google.api.http) = {
      post : "/api/v3/sync/gse/plugin/process/info/alive"
      body : "*"
    };
  }

  // 发起从 GSE 同步全部主机上插件存活进程信息的任务。
  rpc SyncAllAlivePluginProcessInfo(SyncAllAlivePluginProcessInfoReq)
      returns (SyncAllAlivePluginProcessInfoResp) {
    option (google.api.http) = {
      post : "/api/v3/sync/gse/plugin/process/info/alive/all"
      body : "*"
    };
  }

  // 发起从 GSE 同步指定主机上插件已停止进程信息的任务。
  rpc SyncStoppedPluginProcessInfo(SyncStoppedPluginProcessInfoReq)
      returns (SyncStoppedPluginProcessInfoResp) {
    option (google.api.http) = {
      post : "/api/v3/sync/gse/plugin/process/info/stopped"
      body : "*"
    };
  }

  // 发起从 GSE 同步全部主机上插件已停止进程信息的任务。
  rpc SyncAllStoppedPluginProcessInfo(SyncAllStoppedPluginProcessInfoReq)
      returns (SyncAllStoppedPluginProcessInfoResp) {
    option (google.api.http) = {
      post : "/api/v3/sync/gse/plugin/process/info/stopped/all"
      body : "*"
    };
  }

  // 同步指定主机上 V2 兼容插件的存活进程信息。
  rpc SyncAlivePluginProcessV2Info(SyncAlivePluginProcessV2InfoReq)
      returns (SyncAlivePluginProcessV2InfoResp) {
    option (google.api.http) = {
      post : "/api/v3/sync/gse/plugin/process_v2/info/alive"
      body : "*"
    };
  }

  // 同步全部主机上 V2 兼容插件的存活进程信息。
  rpc SyncAllAlivePluginProcessV2Info(SyncAllAlivePluginProcessV2InfoReq)
      returns (SyncAllAlivePluginProcessV2InfoResp) {
    option (google.api.http) = {
      post : "/api/v3/sync/gse/plugin/process_v2/info/alive/all"
      body : "*"
    };
  }

  // 同步指定主机上 V2 兼容插件的已停止进程信息。
  rpc SyncStoppedPluginProcessV2Info(SyncStoppedPluginProcessV2InfoReq)
      returns (SyncStoppedPluginProcessV2InfoResp) {
    option (google.api.http) = {
      post : "/api/v3/sync/gse/plugin/process_v2/info/stopped"
      body : "*"
    };
  }

  // 同步全部主机上 V2 兼容插件的已停止进程信息。
  rpc SyncAllStoppedPluginProcessV2Info(SyncAllStoppedPluginProcessV2InfoReq)
      returns (SyncAllStoppedPluginProcessV2InfoResp) {
    option (google.api.http) = {
      post : "/api/v3/sync/gse/plugin/process_v2/info/stopped/all"
      body : "*"
    };
  }

  // 发起检查指定主机插件进程信息过期情况的任务，将过期状态标记为 unknown。
  rpc CorrectUnknownProcessStatus(CorrectUnknownProcessStatusReq)
      returns (CorrectUnknownProcessStatusResp) {
    option (google.api.http) = {
      post : "/api/v3/sync/gse/plugin/process/correct_unknown_status"
      body : "*"
    };
  }

  // 发起检查全部主机插件进程信息过期情况的任务，将过期状态标记为 unknown。
  rpc CorrectAllUnknownProcessStatus(CorrectAllUnknownProcessStatusReq)
      returns (CorrectAllUnknownProcessStatusResp) {
    option (google.api.http) = {
      post : "/api/v3/sync/gse/plugin/process/correct_unknown_status/all"
      body : "*"
    };
  }

  // 发起补齐默认插件记录的任务。
  rpc EnsureDefaultPlugin(EnsureDefaultPluginReq)
      returns (EnsureDefaultPluginResp) {
    option (google.api.http) = {
      post : "/api/v3/sync/plugin/ensure_default"
      body : "*"
    };
  }

  // 发起同步共享资源包发布版本的任务。
  rpc SyncSharedReleases(SyncSharedReleasesReq)
      returns (SyncSharedReleasesResp) {
    option (google.api.http) = {
      post : "/api/v3/sync/release/shared"
      body : "*"
    };
  }

  // 发起清理已不存在主机的插件进程记录的任务。
  rpc CleanOrphanProcess(CleanOrphanProcessReq)
      returns (CleanOrphanProcessResp) {
    option (google.api.http) = {
      post : "/api/v3/sync/process/clean_orphan"
      body : "*"
    };
  }
}

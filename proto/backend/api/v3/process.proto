syntax = "proto3";
package v3;
option go_package = "github.com/TencentBlueKing/bk-nodemgr/pkg/protocol/backend/api/v3";

import "common.proto";

import "google/api/annotations.proto";

message ProcessExactConditions {
  repeated int64 bk_host_id = 1;
  repeated int64 bk_biz_id = 2;
  repeated string plugin_group = 3;
  repeated int64 generation = 4;
  repeated string platform_os = 5;
  repeated string platform_arch = 6;
  repeated string status = 7;
  repeated string agent_id = 8;
  repeated string version = 9;
  repeated string plugin_name = 10;
  repeated string plugin_pkg_name = 11;
}

message ProcessFuzzyConditions {
  repeated string name = 1;
  repeated string plugin_pkg_name = 2;
}

// ProcessListReq describes the process list request.
message ProcessListReq {
  Page page = 1;
  bool only_count = 2;

  ProcessExactConditions exact_include_conditions = 3;

  ProcessFuzzyConditions fuzzy_include_conditions = 4;
}

// ProcessListResp describes the process list response.
message ProcessListResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Process {
    optional string tenant_id = 1;
    optional int64 bk_host_id = 2;
    optional string plugin_name = 3;
    optional string plugin_pkg_name = 4;
    optional string plugin_group = 5;
    optional Platform platform = 6;
    optional int64 generation = 7;
    optional ProcessInfo process_info = 8;
    optional ProcessIdentity process_identity = 9;
    optional ProcessController process_controller = 10;
    optional ProcessResource process_resource = 11;
    optional ProcessMonitorPolicy process_monitor_policy = 12;
    optional int64 bk_biz_id = 13;
  }

  message Data {
    int64 total = 1;
    repeated Process items = 2;
  }
  Data data = 5;
}

// GetProcessDistributionByHostIDReq describes the process statistics request.
message GetProcessDistributionByHostIDReq {
  ProcessExactConditions exact_include_conditions = 1;
  ProcessFuzzyConditions fuzzy_include_conditions = 2;
}

// GetProcessDistributionByHostIDResp describes the process statistics response.
message GetProcessDistributionByHostIDResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  map<int64, int64> data = 5;
}

// GetProcessDistributionByPluginNameReq describes the process statistics
// request.
message GetProcessDistributionByPluginNameReq {
  ProcessExactConditions exact_include_conditions = 1;
  ProcessFuzzyConditions fuzzy_include_conditions = 2;
}

// GetProcessDistributionByPluginNameResp describes the process statistics
// response.
message GetProcessDistributionByPluginNameResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  map<string, int64> data = 5;
}

// ProcessDistinctSelector describes the process distinct selector.
message ProcessDistinctSelector {
  bool os_type = 1;
  bool cpu_arch = 2;
  bool version = 3;
  bool status = 4;
  bool plugin_name = 5;
  bool plugin_group = 6;
  bool plugin_pkg_name = 7;
}

// ProcessDistinctReq describes the process distinct request.
message ProcessDistinctReq {
  ProcessDistinctSelector selector = 1;
  ProcessExactConditions exact_include_conditions = 2;
  ProcessFuzzyConditions fuzzy_include_conditions = 3;
}

// ProcessDistinctResp describes the process distinct response.
message ProcessDistinctResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {
    repeated string os_type = 1;
    repeated string cpu_arch = 2;
    repeated string version = 3;
    repeated string status = 4;
    repeated string plugin_name = 5;
    repeated string plugin_group = 6;
    repeated string plugin_pkg_name = 7;
  }
  Data data = 5;
}

// ProcessV2CompatibleListReq 查询主机上 process v2 的进程状态。
message ProcessV2CompatibleListReq {
  // 业务 ID，必传。
  repeated int64 bk_biz_id = 1;
  // 主机 ID，不传则返回业务内全部主机。
  repeated int64 bk_host_id = 2;
}

// ProcessV2CompatibleListResp 主机 process v2 进程状态。
message ProcessV2CompatibleListResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  // ProcessV2Status 插件在某台主机上的进程状态。
  message ProcessV2Status {
    // 插件名，当前固定为 bkmonitorbeat。
    string name = 1;
    // 插件版本，进程未注册时为空。
    string version = 2;
    // 进程状态，取值为 running、stopped、unknown，未注册时为 unregister。
    string status = 3;
  }

  // Host 主机及其插件进程状态。
  message Host {
    // 主机 ID。
    int64 bk_host_id = 1;
    // 内网 IPv4，多个以逗号分隔。
    string inner_ip = 2;
    // 内网 IPv6，多个以逗号分隔。
    string inner_ipv6 = 3;
    // 云区域 ID。
    int64 bk_cloud_id = 4;
    // Agent 安装路径，按部署配置与管控区域自定义部署配置计算。
    string setup_path = 5;
    // 插件进程状态，当前仅包含 bkmonitorbeat。
    repeated ProcessV2Status plugin_status = 6;
  }

  // Data 查询结果。
  message Data {
    // 主机总数。
    int64 total = 1;
    // 主机列表。
    repeated Host list = 2;
  }
  Data data = 5;
}

service Process {
  // ListProcesses lists the processes.
  rpc ListProcesses(ProcessListReq) returns (ProcessListResp) {
    option (google.api.http) = {
      post : "/api/v3/process/list"
      body : "*"
    };
  }

  // GetProcessDistributionByHostID describes the process statistics request.
  rpc GetProcessDistributionByHostID(GetProcessDistributionByHostIDReq)
      returns (GetProcessDistributionByHostIDResp) {
    option (google.api.http) = {
      post : "/api/v3/process/get_distribution_by_host_id"
      body : "*"
    };
  }

  // GetProcessDistributionByPluginName describes the process statistics
  // request.
  rpc GetProcessDistributionByPluginName(GetProcessDistributionByPluginNameReq)
      returns (GetProcessDistributionByPluginNameResp) {
    option (google.api.http) = {
      post : "/api/v3/process/get_distribution_by_plugin_name"
      body : "*"
    };
  }

  // ProcessDistinct describes the process distinct request.
  rpc ProcessDistinct(ProcessDistinctReq) returns (ProcessDistinctResp) {
    option (google.api.http) = {
      post : "/api/v3/process/distinct"
      body : "*"
    };
  }

  // 查询主机上的插件进程状态，兼容节点管理 V2 的插件检索返回内容。
  //
  // 仅监控平台使用，不对外开放申请。
  rpc ListV2ProcessesCompatible(ProcessV2CompatibleListReq)
      returns (ProcessV2CompatibleListResp) {
    option (google.api.http) = {
      post : "/api/v3/process/list_v2_compatible"
      body : "*"
    };
  }
}

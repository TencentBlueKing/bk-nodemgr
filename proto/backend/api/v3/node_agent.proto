syntax = "proto3";
package v3;
option go_package = "github.com/TencentBlueKing/bk-nodemgr/pkg/protocol/backend/api/v3";

import "common.proto";

import "google/api/annotations.proto";

// NodeAgentInstallReq describes the node agent install request.
message NodeAgentInstallReq {
  message Host {
    string bk_addressing = 1;
    optional int64 bk_biz_id = 2;
    repeated string bk_host_innerip = 3;
    repeated string bk_host_innerip_v6 = 4;
    string login_ip = 5;
    optional int64 login_port = 6;
    string login_user = 7;
    // support: password_vault, password, keyfile
    string login_mode = 8;
    string login_password = 9;
    string login_key_file = 10;
    optional int64 bk_networkunit_id = 11;
    string os_type = 12;
    optional int64 bk_host_id = 13;
    bool re_register = 14;
    bool install_pre_ordered_plugins = 15;
  }
  repeated Host host = 1;
  message TargetVersion {
    string version = 1;
    string cpu_arch = 2;
    string os_type = 3;
  }
  repeated TargetVersion target_version = 2;
  bool is_manual = 3;
  bool enable_compatibility_mode = 4;
}

// NodeAgentInstallResp describes the node agent install response.
message NodeAgentInstallResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data { string workflow_id = 1; }
  Data data = 5;
}

// NodeAgentInstallCheckReq describes the node agent install check request.
message NodeAgentInstallCheckReq {
  message Host {
    optional int64 bk_biz_id = 1;
    optional int64 bk_host_id = 2;
    repeated string bk_host_innerip_list = 3;
    repeated string bk_host_innerip_v6_list = 4;
    optional int64 bk_networkunit_id = 5;
  }
  repeated Host host = 1;
}

// NodeAgentInstallCheckResp describes the response for node agent installation
// check.
message NodeAgentInstallCheckResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data { repeated NodeAgentInstallCheckResult results = 1; }
  Data data = 5;
}

// NodeAgentInstallCheckMatchedItem describes the matched item for node.
message NodeAgentInstallCheckMatchedItem {
  optional int64 bk_host_id = 1;
  optional int64 bk_biz_id = 2;
  optional int64 bk_networkarea_id = 3;
  optional int64 bk_networkunit_id = 4;
  string os_type = 5;
  string node_role = 6;
  repeated string bk_host_innerip_list = 7;
  repeated string bk_host_innerip_v6_list = 8;
}

// NodeAgentInstallCheckResult describes the check result for node agent
// installation.
message NodeAgentInstallCheckResult {
  string status = 1;
  NodeAgentInstallCheckMatchedItem matched = 2;
  string message_en = 3;
  string message_zh = 4;
  string category = 5;
}

// NodeAgentUpgradeCheckReq describes the node agent upgrade check request.
message NodeAgentUpgradeCheckReq {
  message Host {
    optional int64 bk_host_id = 1;
    optional int64 bk_networkunit_id = 2;
    string cpu_arch = 3;
  }
  repeated Host host = 1;
  repeated TargetVersion target_version = 2;
}

// NodeAgentUpgradeCheckResp describes the response for node agent upgrade
// check.
message NodeAgentUpgradeCheckResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data { repeated NodeAgentUpgradeCheckResult results = 1; }
  Data data = 5;
}

// NodeAgentUpgradeCheckMatchedItem describes the matched item for upgrade
// check.
message NodeAgentUpgradeCheckMatchedItem {
  optional int64 bk_host_id = 1;
  optional int64 bk_biz_id = 2;
  optional int64 bk_networkarea_id = 3;
  optional int64 bk_networkunit_id = 4;
  string os_type = 5;
  string node_role = 6;
  repeated string bk_host_innerip_list = 7;
  repeated string bk_host_innerip_v6_list = 8;
}

// NodeAgentUpgradeCheckResult describes the check result for node agent
// upgrade.
message NodeAgentUpgradeCheckResult {
  string status = 1;
  NodeAgentUpgradeCheckMatchedItem matched = 2;
}

// NodeAgentUpgradeReq describes the node agent upgrade request.
message NodeAgentUpgradeReq {
  message Host {
    int64 bk_host_id = 1;
    string target_version = 2;
    bool force = 3;
    int64 graceful_restart_timeout_sec = 4;
    optional int64 bk_networkunit_id = 5;
    string cpu_arch = 6;
  }
  repeated Host host = 1;
}

// NodeAgentUpgradeResp describes the node agent upgrade response.
message NodeAgentUpgradeResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data { string workflow_id = 1; }
  Data data = 5;
}

// NodeAgentReconfigReq describes the node agent reconfigure request.
message NodeAgentReconfigReq {
  message Host {
    int64 bk_host_id = 1;
    bool force = 2;
    int64 graceful_restart_timeout_sec = 3;
  }
  repeated Host host = 1;
}

// NodeAgentReconfigResp describes the node agent reconfigure response.
message NodeAgentReconfigResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data { string workflow_id = 1; }
  Data data = 5;
}

// NodeAgentRestartReq describes the node agent restart request.
message NodeAgentRestartReq {
  message Host {
    int64 bk_host_id = 1;
    bool force = 2;
    int64 graceful_restart_timeout_sec = 3;
  }
  repeated Host host = 1;
}

// NodeAgentRestartResp describes the node agent restart response.
message NodeAgentRestartResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data { string workflow_id = 1; }
  Data data = 5;
}

// NodeAgentUninstallReq describes the node agent uninstall request.
message NodeAgentUninstallReq {
  message Host { int64 bk_host_id = 1; }
  repeated Host host = 1;
}

// NodeAgentUninstallResp describes the node agent uninstall response.
message NodeAgentUninstallResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data { string workflow_id = 1; }
  Data data = 5;
}

// NodeAgentAssignUnitReq describes the request body for batch-assigning
// a network unit to hosts.
message NodeAgentAssignUnitReq {
  repeated int64 bk_host_id = 1;
  int64 bk_networkunit_id = 2;
}

// NodeAgentAssignUnitResp describes the response for batch-assigning
// a network unit.
message NodeAgentAssignUnitResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {
    int64 success_count = 1;
    int64 failed_count = 2;
    repeated string failed_reasons = 3;
  }
  Data data = 5;
}

// NodeAgent is the service for node agent.
service NodeAgent {
  // NodeAgentInstall installs node agent.
  rpc NodeAgentInstall(NodeAgentInstallReq) returns (NodeAgentInstallResp) {
    option (google.api.http) = {
      post : "/api/v3/node/agent/install"
      body : "*"
    };
  }

  // NodeAgentUpgrade upgrades node agent.
  rpc NodeAgentUpgrade(NodeAgentUpgradeReq) returns (NodeAgentUpgradeResp) {
    option (google.api.http) = {
      post : "/api/v3/node/agent/upgrade"
      body : "*"
    };
  }

  // NodeAgentRestart restarts node agent.
  rpc NodeAgentRestart(NodeAgentRestartReq) returns (NodeAgentRestartResp) {
    option (google.api.http) = {
      post : "/api/v3/node/agent/restart"
      body : "*"
    };
  }

  // NodeAgentReconfig reconfigs node agent.
  rpc NodeAgentReconfig(NodeAgentReconfigReq) returns (NodeAgentReconfigResp) {
    option (google.api.http) = {
      post : "/api/v3/node/agent/reconfig"
      body : "*"
    };
  }

  // NodeAgentUninstall uninstalls node agent.
  rpc NodeAgentUninstall(NodeAgentUninstallReq)
      returns (NodeAgentUninstallResp) {
    option (google.api.http) = {
      post : "/api/v3/node/agent/uninstall"
      body : "*"
    };
  }

  // NodeAgentInstallCheck provides node agent install check.
  rpc NodeAgentInstallCheck(NodeAgentInstallCheckReq)
      returns (NodeAgentInstallCheckResp) {
    option (google.api.http) = {
      post : "/api/v3/node/agent/install_check"
      body : "*"
    };
  }

  // NodeAgentUpgradeCheck provides node agent upgrade check.
  rpc NodeAgentUpgradeCheck(NodeAgentUpgradeCheckReq)
      returns (NodeAgentUpgradeCheckResp) {
    option (google.api.http) = {
      post : "/api/v3/node/agent/upgrade_check"
      body : "*"
    };
  }

  // NodeAgentAssignUnit batch-assigns a network unit to unassigned hosts.
  rpc NodeAgentAssignUnit(NodeAgentAssignUnitReq)
      returns (NodeAgentAssignUnitResp) {
    option (google.api.http) = {
      post : "/api/v3/node/agent/assign_unit"
      body : "*"
    };
  }
}

syntax = "proto3";
package v3;
option go_package = "github.com/TencentBlueKing/bk-nodemgr/pkg/protocol/backend/api/v3";

import "common.proto";

import "google/api/annotations.proto";

// NodeAgentInstallReq describes the node agent install request.
message NodeAgentInstallReq {
  message Host {
    string bk_addressing = 1;
    optional int64 bk_biz_id = 2;
    string bk_host_innerip = 3;
    string bk_host_innerip_v6 = 4;
    string login_ip = 5;
    optional int64 login_port = 6;
    string login_user = 7;
    // support: password_vault, password, keyfile
    string login_mode = 8;
    string login_password = 9;
    string login_key_file = 10;
    optional int64 bk_networkunit_id = 11;
    string os_type = 12;
    optional int64 bk_host_id = 13;
    bool re_register = 14;
  }
  repeated Host host = 1;
  message TargetVersion {
    string version = 1;
    string cpu_arch = 2;
    string os_type = 3;
  }
  repeated TargetVersion target_version = 2;
  bool disable_default_target_version = 3;
}

// NodeAgentInstallResp describes the node agent install response.
message NodeAgentInstallResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;

  message Data { string workflow_id = 1; }
  Data data = 5;
}

// NodeAgentInstallCheckReq describes the node agent install check request.
message NodeAgentInstallCheckReq {
  message Host {
    int64 bk_biz_id = 1;
    string bk_host_innerip = 2;
    string bk_host_innerip_v6 = 3;
    int64 bk_networkunit_id = 4;
  }
  repeated Host host = 1;
}

// NodeAgentInstallCheckResp describes the response for node agent installation
// check.
message NodeAgentInstallCheckResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;

  message Data {
    repeated NodeAgentInstallEligibility eligibilities = 1;
    int64 total_count = 2;
  }
  Data data = 5;
}

// NodeAgentInstallEligibility describes the eligibility for node agent
// installation.
message NodeAgentInstallEligibility {
  string inner_ip = 1;
  string eligibility_status = 2;
  repeated int64 duplicate_host_ids = 3;
}

// NodeAgentUpgradeReq describes the node agent upgrade request.
message NodeAgentUpgradeReq {
  message Host {
    int64 bk_host_id = 1;
    string target_version = 2;
    bool force = 3;
    int64 graceful_restart_timeout_sec = 4;
  }
  repeated Host host = 1;
}

// NodeAgentUpgradeResp describes the node agent upgrade response.
message NodeAgentUpgradeResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;

  message Data { string workflow_id = 1; }
  Data data = 5;
}

// NodeAgentReconfigReq describes the node agent reconfigure request.
message NodeAgentReconfigReq {
  message Host {
    int64 bk_host_id = 1;
    bool force = 2;
    int64 graceful_restart_timeout_sec = 3;
  }
  repeated Host host = 1;
}

// NodeAgentReconfigResp describes the node agent reconfigure response.
message NodeAgentReconfigResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;

  message Data { string workflow_id = 1; }
  Data data = 5;
}

// NodeAgentRestartReq describes the node agent restart request.
message NodeAgentRestartReq {
  message Host {
    int64 bk_host_id = 1;
    bool force = 2;
    int64 graceful_restart_timeout_sec = 3;
  }
  repeated Host host = 1;
}

// NodeAgentRestartResp describes the node agent restart response.
message NodeAgentRestartResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;

  message Data { string workflow_id = 1; }
  Data data = 5;
}

service NodeAgent {
  // NodeAgentInstall installs node agent.
  rpc NodeAgentInstall(NodeAgentInstallReq) returns (NodeAgentInstallResp) {
    option (google.api.http) = {
      post : "/api/v3/node/agent/install"
      body : "*"
    };
  }

  // NodeAgentUpgrade upgrades node agent.
  rpc NodeAgentUpgrade(NodeAgentUpgradeReq) returns (NodeAgentUpgradeResp) {
    option (google.api.http) = {
      post : "/api/v3/node/agent/upgrade"
      body : "*"
    };
  }

  // NodeAgentRestart restarts node agent.
  rpc NodeAgentRestart(NodeAgentRestartReq) returns (NodeAgentRestartResp) {
    option (google.api.http) = {
      post : "/api/v3/node/agent/restart"
      body : "*"
    };
  }

  // NodeAgentReconfig reconfigs node agent.
  rpc NodeAgentReconfig(NodeAgentReconfigReq) returns (NodeAgentReconfigResp) {
    option (google.api.http) = {
      post : "/api/v3/node/agent/reconfig"
      body : "*"
    };
  }

  // NodeAgentInstallCheck provides node agent install check.
  rpc NodeAgentInstallCheck(NodeAgentInstallCheckReq)
      returns (NodeAgentInstallCheckResp) {
    option (google.api.http) = {
      post : "/api/v3/node/agent/install_check"
      body : "*"
    };
  }
}
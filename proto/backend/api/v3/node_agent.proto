syntax = "proto3";
package v3;
option go_package = "github.com/TencentBlueKing/bk-nodemgr/pkg/protocol/backend/api/v3";

import "common.proto";

import "google/api/annotations.proto";

// 待安装节点 Agent 的主机、登录方式及目标版本。
message NodeAgentInstallReq {
  message Host {
    string bk_addressing = 1;
    optional int64 bk_biz_id = 2;
    repeated string bk_host_innerip = 3;
    repeated string bk_host_innerip_v6 = 4;
    string login_ip = 5;
    optional int64 login_port = 6;
    string login_user = 7;
    // 凭证类型：password_vault=密码库，password=密码，keyfile=密钥文件。
    string login_mode = 8;
    string login_password = 9;
    string login_key_file = 10;
    optional int64 bk_networkunit_id = 11;
    string os_type = 12;
    optional int64 bk_host_id = 13;
    bool re_register = 14;
    bool install_pre_ordered_plugins = 15;
    bool renew_gse_task = 16;
    bool renew_gse_proc = 17;
    string install_method = 18;
  }
  repeated Host host = 1;
  message TargetVersion {
    string version = 1;
    string cpu_arch = 2;
    string os_type = 3;
  }
  repeated TargetVersion target_version = 2;
  bool is_manual = 3;
}

// 节点 Agent 安装工作流的标识。
message NodeAgentInstallResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {
    // 用于跟踪本次操作的工作流 ID，不代表操作已完成。
    string workflow_id = 1;
  }
  Data data = 5;
}

// 待检查节点 Agent 安装条件的目标主机。
message NodeAgentInstallCheckReq {
  message Host {
    optional int64 bk_biz_id = 1;
    optional int64 bk_host_id = 2;
    repeated string bk_host_innerip_list = 3;
    repeated string bk_host_innerip_v6_list = 4;
    optional int64 bk_networkunit_id = 5;
  }
  repeated Host host = 1;
}

// 各目标主机的节点 Agent 安装检查结论。
message NodeAgentInstallCheckResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {
    // 与请求 host 顺序一致，每台主机对应一条安装检查结论。
    repeated NodeAgentInstallCheckResult results = 1;
  }
  Data data = 5;
}

// 安装检查中匹配到的已存在主机信息。
message NodeAgentInstallCheckMatchedItem {
  optional int64 bk_host_id = 1;
  optional int64 bk_biz_id = 2;
  optional int64 bk_networkarea_id = 3;
  optional int64 bk_networkunit_id = 4;
  string os_type = 5;
  string node_role = 6;
  repeated string bk_host_innerip_list = 7;
  repeated string bk_host_innerip_v6_list = 8;
}

// 单台主机的节点 Agent 安装检查结论及提示信息。
message NodeAgentInstallCheckResult {
  string status = 1;
  NodeAgentInstallCheckMatchedItem matched = 2;
  string message_en = 3;
  string message_zh = 4;
  string category = 5;
}

// 待检查升级条件的目标主机及候选目标版本。
message NodeAgentUpgradeCheckReq {
  message Host {
    optional int64 bk_host_id = 1;
    optional int64 bk_networkunit_id = 2;
    string cpu_arch = 3;
  }
  repeated Host host = 1;
  repeated TargetVersion target_version = 2;
}

// 各目标主机的节点 Agent 升级检查结论。
message NodeAgentUpgradeCheckResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {
    // 与请求 host 顺序一致，每台主机对应一条升级检查结论。
    repeated NodeAgentUpgradeCheckResult results = 1;
  }
  Data data = 5;
}

// 升级检查中匹配到的主机及网络信息。
message NodeAgentUpgradeCheckMatchedItem {
  optional int64 bk_host_id = 1;
  optional int64 bk_biz_id = 2;
  optional int64 bk_networkarea_id = 3;
  optional int64 bk_networkunit_id = 4;
  string os_type = 5;
  string node_role = 6;
  repeated string bk_host_innerip_list = 7;
  repeated string bk_host_innerip_v6_list = 8;
}

// 单台主机的节点 Agent 升级检查结论。
message NodeAgentUpgradeCheckResult {
  string status = 1;
  NodeAgentUpgradeCheckMatchedItem matched = 2;
}

// 待升级的主机及各自的目标版本和重启选项。
message NodeAgentUpgradeReq {
  message Host {
    int64 bk_host_id = 1;
    string target_version = 2;
    bool force = 3;
    int64 graceful_restart_timeout_sec = 4;
    optional int64 bk_networkunit_id = 5;
    string cpu_arch = 6;
  }
  repeated Host host = 1;
}

// 节点 Agent 升级工作流的标识。
message NodeAgentUpgradeResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {
    // 用于跟踪本次操作的工作流 ID，不代表操作已完成。
    string workflow_id = 1;
  }
  Data data = 5;
}

// 待重新下发配置的主机及重启选项。
message NodeAgentReconfigReq {
  message Host {
    int64 bk_host_id = 1;
    bool force = 2;
    int64 graceful_restart_timeout_sec = 3;
  }
  repeated Host host = 1;
}

// 节点 Agent 配置下发工作流的标识。
message NodeAgentReconfigResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {
    // 用于跟踪本次操作的工作流 ID，不代表操作已完成。
    string workflow_id = 1;
  }
  Data data = 5;
}

// 待重启的主机及重启选项。
message NodeAgentRestartReq {
  message Host {
    int64 bk_host_id = 1;
    bool force = 2;
    int64 graceful_restart_timeout_sec = 3;
  }
  repeated Host host = 1;
}

// 节点 Agent 重启工作流的标识。
message NodeAgentRestartResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {
    // 用于跟踪本次操作的工作流 ID，不代表操作已完成。
    string workflow_id = 1;
  }
  Data data = 5;
}

// 待卸载节点 Agent 的主机及 Agent ID 解绑选项。
message NodeAgentUninstallReq {
  message Host { int64 bk_host_id = 1; }
  repeated Host host = 1;
  bool unbind_agent_id = 2;
}

// 节点 Agent 卸载工作流的标识。
message NodeAgentUninstallResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {
    // 用于跟踪本次操作的工作流 ID，不代表操作已完成。
    string workflow_id = 1;
  }
  Data data = 5;
}

// 待分配管控单元的主机列表及共同的目标管控单元。
message NodeAgentAssignUnitReq {
  repeated int64 bk_host_id = 1;
  int64 bk_networkunit_id = 2;
}

// 管控单元分配成功、失败的主机数量及失败原因。
message NodeAgentAssignUnitResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {
    // 成功写入管控单元的主机数。
    int64 success_count = 1;
    // 未成功写入管控单元的主机数。
    int64 failed_count = 2;
    // 失败原因列表；批量更新失败时按批次记录。
    repeated string failed_reasons = 3;
  }
  Data data = 5;
}

// 按目标管控单元分组的待分配主机。
message NodeAgentAssignUnitMultiReq {
  message Item {
    repeated int64 bk_host_id = 1;
    int64 bk_networkunit_id = 2;
  }
  repeated Item items = 1;
}

// 节点 Agent 安装、升级、重启、配置及管控单元分配接口。
service NodeAgent {
  // 批量安装节点 Agent。
  rpc NodeAgentInstall(NodeAgentInstallReq) returns (NodeAgentInstallResp) {
    option (google.api.http) = {
      post : "/api/v3/node/agent/install"
      body : "*"
    };
  }

  // 批量升级节点 Agent。
  rpc NodeAgentUpgrade(NodeAgentUpgradeReq) returns (NodeAgentUpgradeResp) {
    option (google.api.http) = {
      post : "/api/v3/node/agent/upgrade"
      body : "*"
    };
  }

  // 批量重启节点 Agent。
  rpc NodeAgentRestart(NodeAgentRestartReq) returns (NodeAgentRestartResp) {
    option (google.api.http) = {
      post : "/api/v3/node/agent/restart"
      body : "*"
    };
  }

  // 批量重新下发节点 Agent 配置并重启 Agent。
  rpc NodeAgentReconfig(NodeAgentReconfigReq) returns (NodeAgentReconfigResp) {
    option (google.api.http) = {
      post : "/api/v3/node/agent/reconfig"
      body : "*"
    };
  }

  // 批量卸载节点 Agent。
  rpc NodeAgentUninstall(NodeAgentUninstallReq)
      returns (NodeAgentUninstallResp) {
    option (google.api.http) = {
      post : "/api/v3/node/agent/uninstall"
      body : "*"
    };
  }

  // 检查目标主机是否满足节点 Agent 安装条件。
  rpc NodeAgentInstallCheck(NodeAgentInstallCheckReq)
      returns (NodeAgentInstallCheckResp) {
    option (google.api.http) = {
      post : "/api/v3/node/agent/install_check"
      body : "*"
    };
  }

  // 检查目标主机是否满足节点 Agent 升级条件。
  rpc NodeAgentUpgradeCheck(NodeAgentUpgradeCheckReq)
      returns (NodeAgentUpgradeCheckResp) {
    option (google.api.http) = {
      post : "/api/v3/node/agent/upgrade_check"
      body : "*"
    };
  }

  // 为尚未分配管控单元的主机批量分配同一管控单元，仅更新节点元数据。
  rpc NodeAgentAssignUnit(NodeAgentAssignUnitReq)
      returns (NodeAgentAssignUnitResp) {
    option (google.api.http) = {
      post : "/api/v3/node/agent/assign_unit"
      body : "*"
    };
  }

  // 按主机分组批量分配对应的管控单元，仅更新节点元数据。
  rpc NodeAgentAssignUnitMulti(NodeAgentAssignUnitMultiReq)
      returns (NodeAgentAssignUnitResp) {
    option (google.api.http) = {
      post : "/api/v3/node/agent/assign_unit_multi"
      body : "*"
    };
  }
}

// 开放入口的节点 Agent 安装、升级、重启、配置及管控单元分配接口。
service OpenNodeAgent {
  // 批量安装节点 Agent。
  rpc OpenNodeAgentInstall(NodeAgentInstallReq) returns (NodeAgentInstallResp) {
    option (google.api.http) = {
      post : "/api/v3/open/node/agent/install"
      body : "*"
    };
  }

  // 批量升级节点 Agent。
  rpc OpenNodeAgentUpgrade(NodeAgentUpgradeReq) returns (NodeAgentUpgradeResp) {
    option (google.api.http) = {
      post : "/api/v3/open/node/agent/upgrade"
      body : "*"
    };
  }

  // 批量重启节点 Agent。
  rpc OpenNodeAgentRestart(NodeAgentRestartReq) returns (NodeAgentRestartResp) {
    option (google.api.http) = {
      post : "/api/v3/open/node/agent/restart"
      body : "*"
    };
  }

  // 批量重新下发节点 Agent 配置并重启 Agent。
  rpc OpenNodeAgentReconfig(NodeAgentReconfigReq)
      returns (NodeAgentReconfigResp) {
    option (google.api.http) = {
      post : "/api/v3/open/node/agent/reconfig"
      body : "*"
    };
  }

  // 批量卸载节点 Agent。
  rpc OpenNodeAgentUninstall(NodeAgentUninstallReq)
      returns (NodeAgentUninstallResp) {
    option (google.api.http) = {
      post : "/api/v3/open/node/agent/uninstall"
      body : "*"
    };
  }

  // 检查目标主机是否满足节点 Agent 安装条件。
  rpc OpenNodeAgentInstallCheck(NodeAgentInstallCheckReq)
      returns (NodeAgentInstallCheckResp) {
    option (google.api.http) = {
      post : "/api/v3/open/node/agent/install_check"
      body : "*"
    };
  }

  // 检查目标主机是否满足节点 Agent 升级条件。
  rpc OpenNodeAgentUpgradeCheck(NodeAgentUpgradeCheckReq)
      returns (NodeAgentUpgradeCheckResp) {
    option (google.api.http) = {
      post : "/api/v3/open/node/agent/upgrade_check"
      body : "*"
    };
  }

  // 为尚未分配管控单元的主机批量分配同一管控单元，仅更新节点元数据。
  rpc OpenNodeAgentAssignUnit(NodeAgentAssignUnitReq)
      returns (NodeAgentAssignUnitResp) {
    option (google.api.http) = {
      post : "/api/v3/open/node/agent/assign_unit"
      body : "*"
    };
  }

  // 按主机分组批量分配对应的管控单元，仅更新节点元数据。
  rpc OpenNodeAgentAssignUnitMulti(NodeAgentAssignUnitMultiReq)
      returns (NodeAgentAssignUnitResp) {
    option (google.api.http) = {
      post : "/api/v3/open/node/agent/assign_unit_multi"
      body : "*"
    };
  }
}

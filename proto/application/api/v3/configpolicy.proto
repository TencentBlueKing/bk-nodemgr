syntax = "proto3";
package v3;
option go_package = "github.com/TencentBlueKing/bk-nodemgr/pkg/protocol/application/api/v3";

import "common.proto";

import "google/api/annotations.proto";

// ConfigPolicyExactConditions describes config policy exact conditions.
message ConfigPolicyExactConditions {
  repeated int64 configpolicy_id = 1;
  repeated int64 biz_id = 2;
  repeated string configpolicy_type = 3;
  repeated bool enabled = 4;
}

// ConfigPolicyFuzzyConditions describes config policy fuzzy conditions.
message ConfigPolicyFuzzyConditions {
  repeated string configpolicy_name = 1;
  repeated string operator = 2;
}

// ConfigPolicyListReq describes HTTP request body when list config policy.
message ConfigPolicyListReq {
  Page page = 1;
  bool only_count = 2;

  ConfigPolicyExactConditions exact_include_conditions = 3;
  ConfigPolicyFuzzyConditions fuzzy_include_conditions = 4;
}

// ConfigPolicyListResp describes HTTP response body when list config policy.
message ConfigPolicyListResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {
    int64 total = 1;
    repeated ConfigPolicy items = 2;
  }
  Data data = 5;
}

// ConfigPolicyGetTemplateReq describes HTTP request body when get config policy
// template.
message ConfigPolicyGetTemplateReq { string configpolicy_type = 1; }

// ConfigPolicyGetTemplateResp describes HTTP response body when get config
// policy template.
message ConfigPolicyGetTemplateResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data { repeated ConfigPolicyConfigBlock templates = 1; }
  Data data = 5;
}

// ConfigPolicyListPlatformReq describes HTTP request body when list config
// policy platform.
message ConfigPolicyListPlatformReq {
  string configpolicy_type = 1;
  int64 generation = 2;
}

// ConfigPolicyListPlatformResp describes HTTP response body when list config
// policy platform.
message ConfigPolicyListPlatformResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {
    repeated string os_type = 1;
    repeated string cpu_arch = 2;
  }
  Data data = 5;
}

// ConfigPolicyGetReq describes HTTP request body when get config policy.
message ConfigPolicyGetReq { int64 configpolicy_id = 1; }

// ConfigPolicyGetResp describes HTTP response body when get config policy.
message ConfigPolicyGetResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  ConfigPolicy data = 4;
}

// ConfigPolicyCreateReq describes HTTP request body when create config policy.
message ConfigPolicyCreateReq {
  string configpolicy_name = 1;
  string configpolicy_type = 2;
  int64 biz_id = 3;
  string remark = 4;
  repeated ConfigPolicyScope scopes = 5;
  repeated ConfigPolicyConfigBlock configs = 6;
  string operator = 7;
  repeated int64 target_host_ids = 8;
}

// ConfigPolicyCreateResp describes HTTP response body when create config
// policy.
message ConfigPolicyCreateResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data { optional int64 configpolicy_id = 1; }
  Data data = 5;
}

// ConfigPolicyUpdateReq describes HTTP request body when update config policy.
message ConfigPolicyUpdateReq {
  int64 configpolicy_id = 1;
  string configpolicy_name = 2;
  string configpolicy_type = 3;
  int64 biz_id = 4;
  string remark = 5;
  repeated ConfigPolicyScope scopes = 6;
  repeated ConfigPolicyConfigBlock configs = 7;
  bool enabled = 8;
  string operator = 9;
  int64 priority = 10;
  repeated int64 target_host_ids = 11;
}

// ConfigPolicyUpdateResp describes HTTP response body when update config
// policy.
message ConfigPolicyUpdateResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data { optional int64 configpolicy_id = 1; }
  Data data = 5;
}

// ConfigPolicyEnableReq describes HTTP request body when enable config policy.
message ConfigPolicyEnableReq { repeated int64 configpolicy_id = 1; }

// ConfigPolicyEnableResp describes HTTP response body when enable config
// policy.
message ConfigPolicyEnableResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {}
  Data data = 5;
}

// ConfigPolicyDisableReq describes HTTP request body when disable config
// policy.
message ConfigPolicyDisableReq { repeated int64 configpolicy_id = 1; }

// ConfigPolicyDisableResp describes HTTP response body when disable config
// policy.
message ConfigPolicyDisableResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {}
  Data data = 5;
}

// ConfigPolicyDeleteReq describes HTTP request body when delete config policy.
message ConfigPolicyDeleteReq { repeated int64 configpolicy_id = 1; }

// ConfigPolicyDeleteResp describes HTTP response body when delete config
// policy.
message ConfigPolicyDeleteResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {}
  Data data = 5;
}

// ConfigPolicyEventExactConditions describes the conditions when list event
message ConfigPolicyEventExactConditions {
  repeated int64 configpolicy_id = 1;
  repeated string configpolicy_type = 2;
  repeated int64 version = 3;
  repeated string type = 4;
}

// ConfigPolicyEventFuzzyConditions describes the conditions when list event
message ConfigPolicyEventFuzzyConditions {
  repeated string configpolicy_name = 1;
  repeated string operator = 2;
}

// ConfigPolicyEventListReq describes the HTTP request body when list event in
// policy service.
message ConfigPolicyEventListReq {
  Page page = 1;
  bool only_count = 2;

  ConfigPolicyEventExactConditions exact_include_conditions = 3;
  ConfigPolicyEventFuzzyConditions fuzzy_include_conditions = 4;
  TimeRange operate_time_range = 5;
}

// ConfigPolicyEventListResp describes the HTTP response body when list event in
// policy service.
message ConfigPolicyEventListResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {
    int64 total = 1;
    repeated ConfigPolicyEvent items = 2;
  }
  Data data = 5;
}

// ConfigPolicyEventDistinctReq describes the HTTP request body when distinct
// policyevent in policy service.
message ConfigPolicyEventDistinctReq {
  ConfigPolicyEventExactConditions exact_include_conditions = 1;
  ConfigPolicyEventFuzzyConditions fuzzy_include_conditions = 2;
  TimeRange operate_time_range = 3;
}

// ConfigPolicyEventDistinctResp describes the HTTP response body when distinct
// policyevent in policy service.
message ConfigPolicyEventDistinctResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {
    repeated int64 configpolicy_id = 1;
    repeated string configpolicy_name = 2;
    repeated string configpolicy_type = 3;
    repeated string type = 4;
    repeated int64 version = 5;
    repeated string operator = 6;
  }
  Data data = 5;
}

service ConfigPolicyAPI {
  // ListConfigPolicy lists config policy.
  rpc ConfigPolicyList(ConfigPolicyListReq) returns (ConfigPolicyListResp) {
    option (google.api.http) = {
      post : "/api/v3/policy/config/list"
      body : "*"
    };
  }

  // GetConfigPolicy gets config policy.
  rpc ConfigPolicyGet(ConfigPolicyGetReq) returns (ConfigPolicyGetResp) {
    option (google.api.http) = {
      post : "/api/v3/policy/config/get"
      body : "*"
    };
  }

  // ListConfigPolicyPlatform lists config policy platform.
  rpc ConfigPolicyListPlatform(ConfigPolicyListPlatformReq)
      returns (ConfigPolicyListPlatformResp) {
    option (google.api.http) = {
      post : "/api/v3/policy/config/list_platform"
      body : "*"
    };
  }

  // TemplateConfigPolicy gets config policy template.
  rpc ConfigPolicyTemplate(ConfigPolicyGetTemplateReq)
      returns (ConfigPolicyGetTemplateResp) {
    option (google.api.http) = {
      post : "/api/v3/policy/config/get_template"
      body : "*"
    };
  }

  // CreateConfigPolicy creates config policy.
  rpc ConfigPolicyCreate(ConfigPolicyCreateReq)
      returns (ConfigPolicyCreateResp) {
    option (google.api.http) = {
      post : "/api/v3/policy/config/create"
      body : "*"
    };
  }

  // UpdateConfigPolicy updates config policy.
  rpc ConfigPolicyUpdate(ConfigPolicyUpdateReq)
      returns (ConfigPolicyUpdateResp) {
    option (google.api.http) = {
      post : "/api/v3/policy/config/update"
      body : "*"
    };
  }

  // EnableConfigPolicy enables config policy.
  rpc ConfigPolicyEnable(ConfigPolicyEnableReq)
      returns (ConfigPolicyEnableResp) {
    option (google.api.http) = {
      post : "/api/v3/policy/config/enable"
      body : "*"
    };
  }

  // DisableConfigPolicy disables config policy.
  rpc ConfigPolicyDisable(ConfigPolicyDisableReq)
      returns (ConfigPolicyDisableResp) {
    option (google.api.http) = {
      post : "/api/v3/policy/config/disable"
      body : "*"
    };
  }

  // DeleteConfigPolicy deletes config policy.
  rpc ConfigPolicyDelete(ConfigPolicyDeleteReq)
      returns (ConfigPolicyDeleteResp) {
    option (google.api.http) = {
      post : "/api/v3/policy/config/delete"
      body : "*"
    };
  }

  // ConfigPolicyEventList provides policy event listing.
  rpc ConfigPolicyEventList(ConfigPolicyEventListReq)
      returns (ConfigPolicyEventListResp) {
    option (google.api.http) = {
      post : "/api/v3/policy/config/event/list"
      body : "*"
    };
  }

  // ConfigPolicyEventDistinct provides policy event distincting.
  rpc ConfigPolicyEventDistinct(ConfigPolicyEventDistinctReq)
      returns (ConfigPolicyEventDistinctResp) {
    option (google.api.http) = {
      post : "/api/v3/policy/config/event/distinct"
      body : "*"
    };
  }
}
message TopoGraphNodeGetReq { repeated int64 bk_networkunit_id = 1; }

// CycleTime describes the cycle time of a node in graph.
message CycleTime {
  optional int64 bk_host_id = 1;
  repeated string bk_host_innerip_list = 2;
  repeated string bk_host_innerip_v6_list = 3;
  optional string bk_agent_id = 4;

  repeated int64 node_generation = 10;
  repeated string proxy_tags = 11;
  repeated int64 bk_set_id = 12;
  repeated int64 bk_module_id = 13;
  repeated string bk_host_innerip = 14;
  repeated string bk_host_innerip_v6 = 15;
}


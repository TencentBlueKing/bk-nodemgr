  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {
    repeated string node_role = 1;
    repeated string node_status = 2;
    repeated string node_version = 3;
    repeated string dept_name = 4;
    repeated string os_type = 5;
    repeated string arch = 6;
    repeated string addressing = 7;
    repeated int64 bk_networkarea_id = 8;
    repeated int64 bk_networkunit_id = 9;
    repeated int64 bk_biz_id = 10;
  }
  Data data = 5;
}


syntax = "proto3";
package v3;
option go_package = "github.com/TencentBlueKing/bk-nodemgr/pkg/protocol/application/api/v3";

import "common.proto";

import "google/api/annotations.proto";

// TopoBusinessListReq describes the HTTP request body when list business in
// topo service.
message TopoBusinessListReq {
  Page page = 1;
  bool only_count = 2;

  message ExactConditions { repeated int64 bk_biz_id = 1; }
  ExactConditions exact_include_conditions = 3;

  message FuzzyConditions { repeated string bk_biz_name = 1; }
  FuzzyConditions fuzzy_include_conditions = 4;
}

// TopoBusinessListResp describes the HTTP response body when list business in
// topo service.
message TopoBusinessListResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {
    int64 total = 1;
    repeated Business items = 2;
  }
  Data data = 5;
}

// TopoBusinessHostCountGetReq describes the HTTP request body when get host
// count of business in topo service.
message TopoBusinessHostCountGetReq { repeated int64 bk_biz_id = 1; }

// BusinessHostCount describes the host count of a single business.
message BusinessHostCount {
  int64 bk_biz_id = 1;
  int64 host_count = 2;
}

// TopoBusinessHostCountGetResp describes the HTTP response body when get host
// count of business in topo service.
message TopoBusinessHostCountGetResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data { repeated BusinessHostCount items = 1; }
  Data data = 5;
}

// TopoNodeInfo describes a business instance topology node.
message TopoNodeInfo {
  int64 topo_inst_id = 1;
  string topo_inst_name = 2;
  string topo_obj_id = 3;
  int64 host_count = 4;
  repeated TopoNodeInfo children = 5;
}

// TopoBusinessInstTopoGetReq describes the HTTP request body when get business

syntax = "proto3";
package v3;
option go_package = "github.com/TencentBlueKing/bk-nodemgr/pkg/protocol/application/api/v3";

import "common.proto";

import "google/api/annotations.proto";

// NodeAgentInstallReq describes the HTTP request body when install node agent.
message NodeAgentInstallReq {
  message Host {
    string bk_addressing = 1;
    optional int64 bk_biz_id = 2;
    string bk_host_innerip = 3;
    string bk_host_innerip_v6 = 4;
    string login_ip = 5;
    optional int64 login_port = 6;
    string login_user = 7;
    // support: auto, password, keyfile, none
    string login_mode = 8;
    string login_password = 9;
    bytes login_key_file = 10;
    optional int64 bk_networkunit_id = 11;
    string os_type = 12;
    string target_version = 13;
    optional int64 bk_host_id = 14;
    bool re_register = 15;
  }
  repeated Host host = 1;
}

// NodeAgentInstallResp describes the node agent install response.
message NodeAgentInstallResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;

  message Data { string workflow_id = 1; }
  Data data = 4;
}

service NodeAgent {
  // NodeAgentInstall installs node agent.
  rpc NodeAgentInstall(NodeAgentInstallReq) returns (NodeAgentInstallResp) {
    option (google.api.http) = {
      post : "/api/v3/node_agent/install"
      body : "*"
    };
  }
}
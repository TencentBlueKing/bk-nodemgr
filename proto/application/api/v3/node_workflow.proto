syntax = "proto3";
package v3;
option go_package = "github.com/TencentBlueKing/bk-nodemgr/pkg/protocol/application/api/v3";

import "common.proto";
import "pkg.proto";
import "workflow.proto";

import "google/api/annotations.proto";

// NodeWorkflowInfo describes the node workflow information.
message NodeWorkflowInfo {
  optional string workflow_id = 1;
  optional string trigger_id = 2;
  optional string type = 3;
  repeated int64 bk_biz_id = 4;
  repeated int64 bk_networkarea_id = 5;
  repeated int64 bk_networkunit_id = 6;
  optional string operator = 7;
  optional int64 operate_time = 8;
  optional int64 finish_time = 9;
  optional string status = 10;
  repeated string bk_biz_name = 11;
  repeated string node_role = 12;
  repeated int64 deploy_policy_ids = 13;
}

// NodeWorkflowExactConditions describes the exact conditions of node workflow
// list request.
message NodeWorkflowExactConditions {
  repeated string workflow_id = 1;
  repeated string type = 2;
  repeated int64 bk_biz_id = 3;
  repeated string status = 4;
  repeated string operator = 5;
  repeated string bk_host_innerip = 6;
  repeated string bk_host_innerip_v6 = 7;
  repeated string node_role = 8;
  repeated int64 deploy_policy_id = 9;
}

// NodeWorkflowFuzzyConditions describes the fuzzy conditions of node workflow
// list request.
message NodeWorkflowFuzzyConditions {}

// NodeWorkflowListReq describes the node workflow list request.
message NodeWorkflowListReq {
  Page page = 1;
  bool only_count = 2;

  NodeWorkflowExactConditions exact_include_conditions = 3;
  NodeWorkflowFuzzyConditions fuzzy_include_conditions = 4;
  TimeRange operate_time_range = 5;
}

// NodeWorkflowListResp describes the node workflow list response.
message NodeWorkflowListResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {
    int64 total = 1;
    repeated NodeWorkflowInfo items = 2;
  }
  Data data = 5;
}

// NodeWorkflowStatisticReq describes the node workflow statistic request.
message NodeWorkflowStatisticsReq { repeated string workflow_id = 1; }

// NodeWorkflowStatisticResp describes the node workflow statistic response.
message NodeWorkflowStatisticsResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data { repeated WorkflowStatisticsInfo items = 1; }
  Data data = 5;
}

// NodeWorkflowDistinctReq describes the node workflow distinct request.
message NodeWorkflowDistinctReq {
  NodeWorkflowExactConditions exact_include_conditions = 1;
  NodeWorkflowFuzzyConditions fuzzy_include_conditions = 2;
}

// NodeWorkflowDistinctResp describes the node workflow distinct response.
message NodeWorkflowDistinctResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {
    repeated string type = 1;
    repeated int64 bk_biz_id = 2;
    repeated string operator = 3;
    repeated string status = 4;
  }
  Data data = 5;
}

// NodeDeploymentInfo describes the node workflow operation information.
message NodeDeploymentInfo {
  int64 bk_host_id = 1;
  int64 bk_biz_id = 2;
  repeated string bk_host_innerip_list = 3;
  repeated string bk_host_innerip_v6_list = 4;
  int64 bk_networkarea_id = 5;
  int64 bk_networkunit_id = 6;
  string node_version = 7;
}

// NodeWorkflowOperation describes the node workflow operation.
message NodeWorkflowOperation {
  string operation_id = 1;
  repeated string instance_ids = 2;
  string operator = 3;
  int64 create_time = 4;
  NodeDeploymentInfo node_deployment_info = 5;
  WorkflowOperInstBriefData latest_oper_inst_brief_data = 6;
}

// NodeWorkflowOperationExactConditions describes the exact conditions of node
// workflow operation list request.
message NodeWorkflowOperationExactConditions {
  repeated string node_version = 1;
  repeated string bk_host_innerip = 2;
  repeated string bk_host_innerip_v6 = 3;
  repeated int64 bk_biz_id = 4;
  repeated int64 bk_networkarea_id = 5;
  repeated int64 bk_networkunit_id = 6;
  repeated string state = 7;
}

// NodeWorkflowOperationFuzzyConditions describes the fuzzy conditions of node
// workflow list request.
message NodeWorkflowOperationFuzzyConditions {}

// NodeWorkflowOperationListReq describes the node operation list
// request.
message NodeWorkflowOperationListReq {
  bool only_count = 1;
  Page page = 2;
  string workflow_id = 3;
  NodeWorkflowOperationExactConditions exact_include_conditions = 4;
  NodeWorkflowOperationFuzzyConditions fuzzy_include_conditions = 5;
}

// NodeWorkflowOperationListResp describes the node operation list by
message NodeWorkflowOperationListResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {
    repeated NodeWorkflowOperation operations = 1;
    int64 total = 2;
  }
  Data data = 5;
}

// NodeWorkflowOperationDistinctReq describes the node workflow operation
// distinct request.
message NodeWorkflowOperationDistinctReq { string workflow_id = 1; }

// NodeWorkflowOperationDistinctResp describes the node workflow operation
// distinct response.
message NodeWorkflowOperationDistinctResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data { repeated string state = 1; }
  Data data = 5;
}

// NodeWorkflowOperationInstanceListReq describes the node operation instance
// list by operation-id request.
message NodeWorkflowOperationInstanceListReq {
  bool only_count = 1;
  string operation_id = 2;
}

// NodeWorkflowOperationInstanceListResp describes the node operation instance
// list by operation-id response.
message NodeWorkflowOperationInstanceListResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {
    int64 total = 1;
    repeated WorflowOperationInstanceData oper_inst_data = 2;
  }
  Data data = 5;
}

// NodeWorkflowOperationInstanceLogGetReq describes the node operation instance

message NodeWorkflowOperationInstanceLogGetReq { string oper_inst_id = 1; }

// NodeWorkflowOperationInstanceLogGetResp describes the node operation action
// instance log
message NodeWorkflowOperationInstanceLogGetResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {
    map<string, WorkflowActionData> oper_inst_logs = 1;
    WorkflowActionMessage extra_execution_logs = 2;
  }
  Data data = 5;
}

// NodeWorkflowOperationRetryReq
message NodeWorkflowOperationRetryReq {
  string workflow_id = 1;
  string retry_mod = 2;
  repeated string operation_ids = 3;
}

// NodeWorkflowOperationRetryResp
message NodeWorkflowOperationRetryResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {}
  Data data = 5;
}

// NodeWorkflowOperationTerminateReq
message NodeWorkflowOperationTerminateReq {
  string workflow_id = 1;
  repeated string operation_ids = 2;
}

// NodeWorkflowOperationTerminateResp
message NodeWorkflowOperationTerminateResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {}
  Data data = 5;
}

// ManualSolutionStep describes the step of manual solution.
message ManualSolutionStep {
  string type = 1;
  string name_en = 2;
  string name_zh = 3;
  string content_en = 4;
  string content_zh = 5;
}

// ManualSolution describes the manual solution.
message ManualSolution {
  string type = 1;
  string description_en = 2;
  string description_zh = 3;
  repeated ManualSolutionStep steps = 4;
}

// NodeWorkflowOperationManualSolutionGetReq describes the node workflow
// operation get manual solution request.
message NodeWorkflowOperationManualSolutionGetReq {
  string workflow_id = 1;
  string operation_id = 2;
}

// NodeWorkflowOperationManualSolutionGetResp describes the node workflow
// operation get manual solution response.
message NodeWorkflowOperationManualSolutionGetResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  repeated ManualSolution data = 5;
}

// NodeWorkflowOperationOfflinePackageDownloadReq describes the offline package
// download request.
message NodeWorkflowOperationOfflinePackageDownloadReq {
  string operation_id = 1;
}

// NodeWorkflowOperationOfflineInstallResultSubmitReq describes the offline
// install result submit request.
message NodeWorkflowOperationOfflineInstallResultSubmitReq {
  string operation_id = 1;
  string result_data = 2;
}

// NodeWorkflowOperationOfflineInstallResultSubmitResp describes the offline
// install result submit response.
message NodeWorkflowOperationOfflineInstallResultSubmitResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;
}

// NodeWorkflow provides node workflow service.
service NodeWorkflow {
  // NodeWorkflowList provides node workflow list.
  rpc NodeWorkflowList(NodeWorkflowListReq) returns (NodeWorkflowListResp) {
    option (google.api.http) = {
      post : "/api/v3/node/workflow/list"
      body : "*"
    };
  }

  // NodeWorkflowStatistics provides node workflow statistics.
  rpc NodeWorkflowStatistics(NodeWorkflowStatisticsReq)
      returns (NodeWorkflowStatisticsResp) {
    option (google.api.http) = {
      post : "/api/v3/node/workflow/statistics"
      body : "*"
    };
  }

  // NodeWorkflowDistinct provides node workflow distinct.
  rpc NodeWorkflowDistinct(NodeWorkflowDistinctReq)
      returns (NodeWorkflowDistinctResp) {
    option (google.api.http) = {
      post : "/api/v3/node/workflow/distinct"
      body : "*"
    };
  }

  // NodeWorkflowOperationList provides node workflow operation list.
  rpc NodeWorkflowOperationList(NodeWorkflowOperationListReq)
      returns (NodeWorkflowOperationListResp) {
    option (google.api.http) = {
      post : "/api/v3/node/workflow/operation/list"
      body : "*"
    };
  }

  // NodeWorkflowOperationDistinct provides node workflow operation distinct.
  rpc NodeWorkflowOperationDistinct(NodeWorkflowOperationDistinctReq)
      returns (NodeWorkflowOperationDistinctResp) {
    option (google.api.http) = {
      post : "/api/v3/node/workflow/operation/distinct"
      body : "*"
    };
  }

  // NodeWorkflowOperationInstanceList provides node workflow operation instance
  // list.
  rpc NodeWorkflowOperationInstanceList(NodeWorkflowOperationInstanceListReq)
      returns (NodeWorkflowOperationInstanceListResp) {
    option (google.api.http) = {
      post : "/api/v3/node/workflow/operation/instance/list"
      body : "*"
    };
  }

  // NodeWorkflowOperationInstanceLogGet provides node operation instance log
  // get.
  rpc NodeWorkflowOperationInstanceLogGet(
      NodeWorkflowOperationInstanceLogGetReq)
      returns (NodeWorkflowOperationInstanceLogGetResp) {
    option (google.api.http) = {
      post : "/api/v3/node/workflow/operation/instance/log/get"
      body : "*"
    };
  }

  // NodeWorkflowOperationRetry retry node operation.
  rpc NodeWorkflowOperationRetry(NodeWorkflowOperationRetryReq)
      returns (NodeWorkflowOperationRetryResp) {
    option (google.api.http) = {
      post : "/api/v3/node/workflow/operation/retry"
      body : "*"
    };
  }

  // NodeWorkflowOperationTerminate provides node operation terminate.
  rpc NodeWorkflowOperationTerminate(NodeWorkflowOperationTerminateReq)
      returns (NodeWorkflowOperationTerminateResp) {
    option (google.api.http) = {
      post : "/api/v3/node/workflow/operation/terminate"
      body : "*"
    };
  }

  // NodeWorkflowOperationManualSolutionGet provides node operation manual
  // solution get.
  rpc NodeWorkflowOperationManualSolutionGet(
      NodeWorkflowOperationManualSolutionGetReq)
      returns (NodeWorkflowOperationManualSolutionGetResp) {
    option (google.api.http) = {
      post : "/api/v3/node/workflow/operation/manual/solution/get"
      body : "*"
    };
  }

  // NodeWorkflowOperationOfflinePackageDownload streams the tar.gz offline
  // install bundle for an operation (POST
  // /api/v3/node/workflow/operation/offline/download, body: operation_id).
  rpc NodeWorkflowOperationOfflinePackageDownload(
      NodeWorkflowOperationOfflinePackageDownloadReq) returns (FileChunk) {
    option (google.api.http) = {
      post : "/api/v3/node/workflow/operation/offline/download"
      body : "*"
    };
  }

  // NodeWorkflowOperationOfflineInstallResultSubmit forwards offline install
  // result JSON to the backend (POST
  // /api/v3/node/workflow/operation/offline/result).
  rpc NodeWorkflowOperationOfflineInstallResultSubmit(
      NodeWorkflowOperationOfflineInstallResultSubmitReq)
      returns (NodeWorkflowOperationOfflineInstallResultSubmitResp) {
    option (google.api.http) = {
      post : "/api/v3/node/workflow/operation/offline/result"
      body : "*"
    };
  }
}

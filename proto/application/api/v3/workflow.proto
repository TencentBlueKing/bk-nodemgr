syntax = "proto3";
package v3;
option go_package = "github.com/TencentBlueKing/bk-nodemgr/pkg/protocol/application/api/v3";

import "common.proto";

import "google/api/annotations.proto";

// WorkflowHostParameter describes the host action parameters in workflows
// service. Such as installing, upgrading.
message WorkflowHostParameter {
  int32 bk_host_id = 1;

  message Topo {
    int32 bk_biz_id = 1;
    int32 bk_network_area_id = 2;
    int32 bk_network_unit_id = 3;
  }
  Topo topo = 2;

  message Attributes {
    string bk_host_innerip = 1;
    string bk_host_innerip_v6 = 2;
    string bk_host_outerip = 3;
    string bk_host_outerip_v6 = 4;
    string login_ip = 5;
    uint32 login_port = 6;
    string login_password = 7;
  }
  Attributes attributes = 3;

  message Config { string version = 1; }
  Config config = 4;
}

// WorkflowAgentInstallReq describes the HTTP request body when install agent in
// workflow service.
message WorkflowAgentInstallReq {
  repeated WorkflowHostParameter hosts = 1;
  uint32 timeout_sec = 2;
}

// WorkflowAgentInstallResp describes the HTTP response body when install agent
// in workflow service.
message WorkflowAgentInstallResp {
  bool result = 1;
  int32 code = 2;
  string message = 3;
  string request_id = 4;

  message Data { string workflow_id = 1; }
  Data data = 5;
}

// WorkflowAgentUpgradeReq describes the HTTP request body when upgrade agent in
// workflow service.
message WorkflowAgentUpgradeReq {
  repeated WorkflowHostParameter hosts = 1;
  uint32 timeout_sec = 2;
  bool force = 3;
}

// WorkflowAgentUpgradeResp describes the HTTP response body when upgrade agent
// in workflow service.
message WorkflowAgentUpgradeResp {

// OperationInstance describes the operation instance informations. One
// operation may contains multi instances.
message OperationInstance {
  string instance_id = 1;
  uint64 create_at = 2;
  uint64 started_at = 3;
  uint64 ended_at = 4;
  uint64 stopped_at = 5;

  message Message {
    uint64 timestamp = 1;
    string text = 2;
  }

  message Action {
    uint64 create_at = 1;
    uint64 started_at = 2;
    uint64 ended_at = 3;
    uint64 stopped_at = 4;
    string status = 5;
    repeated Message message = 6;
  }
  repeated Action action = 6;
}

// OperationBrief describes the operation informations in brief.
message OperationBrief {
  string operation_id = 1;
  uint64 create_at = 2;
  uint64 started_at = 3;
  uint64 ended_at = 4;
  uint64 stopped_at = 5;
  int32 bk_host_id = 6;
  int32 bk_host_innerip = 7;
  int32 instance_count = 8;
}

// OperationDetail describes the operation informations in detail.
message OperationDetail {
  string operation_id = 1;
  uint64 create_at = 2;
  uint64 started_at = 3;
  uint64 ended_at = 4;
  uint64 stopped_at = 5;
  int32 bk_host_id = 6;
  int32 bk_host_innerip = 7;
  int32 instance_count = 8;
  repeated OperationInstance instances = 9;
}

// WorkflowBrief describes the workflow informations in brief.
message WorkflowBrief {
  string workflow_id = 1;
  string status = 2;
  string operator = 3;
  int32 type = 4;
  uint64 create_at = 5;
  uint64 started_at = 6;
  uint64 ended_at = 7;
  uint64 stopped_at = 8;
  int32 operation_count = 9;
}

// WorkflowDetail describes the workflow informations in detail.
message WorkflowDetail {
  string workflow_id = 1;
  string status = 2;
  string operator = 3;
  int32 type = 4;
  uint64 create_at = 5;
  uint64 started_at = 6;
  uint64 ended_at = 7;
  uint64 stopped_at = 8;
  int32 operation_count = 9;
  repeated OperationBrief operations = 10;
}

// WorkflowListReq describes the HTTP request body when list workflows in
// workflow service.
message WorkflowListReq {
  Page page = 1;
  bool only_count = 2;

  message Conditions {}
  Conditions include_conditions = 3;
}

// WorkflowListResp describes the HTTP response body when list workflows in
// workflow service.
message WorkflowListResp {
  bool result = 1;
  int32 code = 2;
  string message = 3;
  string request_id = 4;

  message Data {
    uint32 total = 1;
    repeated WorkflowBrief items = 2;
  }
  Data data = 5;
}

// WorkflowGetReq describes the HTTP request body when get workflow in workflow
// service.
message WorkflowGetReq {}

// WorkflowGetResp describes the HTTP response body when get workflow in
// workflow service.
message WorkflowGetResp {
  bool result = 1;
  int32 code = 2;
  string message = 3;
  string request_id = 4;
  WorkflowDetail data = 5;
}

// WorkflowOperationGetReq describes the HTTP request body when get operation in
// workflow service.
message WorkflowOperationGetReq {}

// WorkflowOperationGetResp describes the HTTP response body when get operation
// in workflow service.
message WorkflowOperationGetResp {
  bool result = 1;
  int32 code = 2;
  string message = 3;
  string request_id = 4;
  OperationDetail Data = 5;
}

// workflow service.
service Workflow {
  // AgentInstall provides multi agent installing.
  rpc AgentInstall(WorkflowAgentInstallReq) returns (WorkflowAgentInstallResp) {
    option (google.api.http) = {
      post : "/api/v3/workflow/agent/install"
      body : "*"
    };
  }

  // AgentUpgrade provides multi agent upgrading.
  rpc AgentUpgrade(WorkflowAgentUpgradeReq) returns (WorkflowAgentUpgradeResp) {
    option (google.api.http) = {
      post : "/api/v3/workflow/agent/upgrade"
      body : "*"
    };
  }

  // AgentReconfig provides multi agent reconfiging.
  rpc AgentReconfig(WorkflowAgentReconfigReq)
      returns (WorkflowAgentReconfigResp) {
    option (google.api.http) = {
      post : "/api/v3/workflow/agent/reconfig"
      body : "*"
    };
  }

  // AgentRestart provides multi agent restarting.
  rpc AgentRestart(WorkflowAgentRestartReq) returns (WorkflowAgentRestartResp) {
    option (google.api.http) = {
      post : "/api/v3/workflow/agent/restart"
      body : "*"
    };
  }

  // AgentUninstall provides multi agent uninstalling.
  rpc AgentUninstall(WorkflowAgentUninstallReq)
      returns (WorkflowAgentUninstallResp) {
    option (google.api.http) = {
      post : "/api/v3/workflow/agent/uninstall"
      body : "*"
    };
  }

  // ProxyInstall provides multi  proxy installing.
  rpc ProxyInstall(WorkflowProxyInstallReq) returns (WorkflowProxyInstallResp) {
    option (google.api.http) = {
      post : "/api/v3/workflow/proxy/install"
      body : "*"
    };
  }

  // ProxyUpgrade provides multi proxy upgrading.
  rpc ProxyUpgrade(WorkflowProxyUpgradeReq) returns (WorkflowProxyUpgradeResp) {
    option (google.api.http) = {
      post : "/api/v3/workflow/proxy/upgrade"
      body : "*"
    };
  }

  // ProxyReconfig provides multi proxy reconfiging.
  rpc ProxyReconfig(WorkflowProxyReconfigReq)
      returns (WorkflowProxyReconfigResp) {
    option (google.api.http) = {
      post : "/api/v3/workflow/proxy/reconfig"
      body : "*"
    };
  }

  // ProxyRestart provides multi proxy restarting.
  rpc ProxyRestart(WorkflowProxyRestartReq) returns (WorkflowProxyRestartResp) {
    option (google.api.http) = {
      post : "/api/v3/workflow/proxy/restart"
      body : "*"
    };
  }

  // ProxyUninstall provides multi proxy uninstalling.
  rpc ProxyUninstall(WorkflowProxyUninstallReq)
      returns (WorkflowProxyUninstallResp) {
    option (google.api.http) = {
      post : "/api/v3/workflow/proxy/uninstall"
      body : "*"
    };
  }

  // WorkflowList provides workflow listing.
  rpc WorkflowList(WorkflowListReq) returns (WorkflowListResp) {
    option (google.api.http) = {
      get : "/api/v3/workflow"
      body : "*"
    };
  }

  // WorkflowGet provides getting an existing workflow by id.
  rpc WorkflowGet(WorkflowGetReq) returns (WorkflowGetResp) {
    option (google.api.http) = {
      get : "/api/v3/workflow/{workflow_id}"
      body : "*"
    };
  }

  // OperationGet provides getting an existing operation by id.
  rpc OperationGet(WorkflowOperationGetReq) returns (WorkflowOperationGetResp) {
    option (google.api.http) = {
      get : "/api/v3/workflow/{workflow_id}/operation/{operation_id}"
      body : "*"
    };
  }
}
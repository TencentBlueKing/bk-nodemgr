syntax = "proto3";

package v3;

option go_package = "github.com/TencentBlueKing/bk-nodemgr/pkg/protocol/application/api/v3";

import "common.proto";
import "google/api/annotations.proto";

// VersionLogEntry represents a single version's changelog entry.
message VersionLogEntry {
  // version is the version identifier (e.g. "v3.0.1-alpha.17").
  string version = 1;
  // date is the release date in YYYY-MM-DD format.
  string date = 2;
  // is_current indicates whether this is the currently running version.
  bool is_current = 3;
}

// VersionLogsListReq describes the HTTP request body for listing versions.
message VersionLogsListReq {}

// VersionLogsListResp describes the HTTP response body for version list.
message VersionLogsListResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {
    // version_logs lists all available versions sorted by recency (newest
    // first).
    repeated VersionLogEntry version_logs = 1;
  }
  Data data = 5;
}

// VersionLogDetailReq describes the HTTP request body for fetching a specific
// version's changelog.
message VersionLogDetailReq {
  // version is the version identifier to fetch (e.g. "v3.0.1-alpha.17").
  string version = 1;
}

// VersionLogDetailResp describes the HTTP response body for version detail.
message VersionLogDetailResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {
    // version is the requested version identifier.
    string version = 1;
    // date is the release date in YYYY-MM-DD format.
    string date = 2;
    // content is the markdown-formatted changelog content.
    string content = 3;
  }
  Data data = 5;
}

// 独立维护的大版本概览，不按发布日期区分。
message VersionOverviewEntry {
  // 三段基础版本号，例如 v3.0.1。
  string version = 1;
  // 是否为当前运行版本所属的大版本。
  bool is_current = 2;
}

// 按当前语言查询独立维护的大版本概览。
message VersionOverviewListReq {}

// 大版本概览列表及当前运行版本所属的大版本。
message VersionOverviewListResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {
    // 当前语言下已有概览文档的大版本，按版本号降序排列。
    repeated VersionOverviewEntry version_logs = 1;
    // 当前运行版本所属的大版本，例如 v3.0.1；可能尚无对应概览文档。
    // 运行版本不符合项目版本格式时为空。
    string current_version = 2;
  }
  Data data = 5;
}

// 查询指定大版本的独立概览文档。
message VersionOverviewDetailReq {
  // 三段基础版本号，例如 v3.0.1，不包含 alpha、beta 或 release 后缀。
  string version = 1;
}

// 当前语言下的大版本概览内容。
message VersionOverviewDetailResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {
    // 请求的大版本号，例如 v3.0.1。
    string version = 1;
    reserved 2;
    reserved "date";
    // 独立维护、可持续更新的 Markdown 展示文档，不由迭代日志自动拼接。
    string content = 3;
  }
  Data data = 5;
}

// VersionLog service provides version and changelog information.
service VersionLog {
  // 查询所有可用版本的更新日志列表。
  rpc List(VersionLogsListReq) returns (VersionLogsListResp) {
    option (google.api.http) = {
      get : "/api/v3/version_log/version_logs_list"
    };
  }

  // 查询当前语言下已有的大版本概览列表及当前所属大版本。
  rpc OverviewList(VersionOverviewListReq) returns (VersionOverviewListResp) {
    option (google.api.http) = {
      get : "/api/v3/version_log/overview_list"
    };
  }

  // 查询指定大版本的概览文档；当前语言没有对应文档时返回记录不存在。
  rpc OverviewDetail(VersionOverviewDetailReq)
      returns (VersionOverviewDetailResp) {
    option (google.api.http) = {
      get : "/api/v3/version_log/overview/{version}"
    };
  }

  // 获取指定版本的更新日志。
  rpc Detail(VersionLogDetailReq) returns (VersionLogDetailResp) {
    option (google.api.http) = {
      get : "/api/v3/version_log/changelog/{version}"
    };
  }
}

syntax = "proto3";
package v3;
option go_package = "github.com/TencentBlueKing/bk-nodemgr/pkg/protocol/application/api/v3";

// Page describes the generaic conditions when paging query.
message Page {
  int32 offset = 1;
  int32 limit = 2;
}

// Business describes the business informations.
message Business {
  string tenant_id = 1;
  int64 bk_biz_id = 2;
  string bk_biz_name = 3;
}

// NetworkArea describes the network area informations.
message NetworkArea {
  string tenant_id = 1;
  int32 bk_networkarea_id = 2;
  string bk_networkarea_name = 3;
  int32 bk_cloud_vendor = 4;
}

// Link describes the network unit link points target.
message Link {
  string tenant_id = 1;
  int64 ap_id = 2;
}

// AccessPoint describes the access point informations.
message AccessPoint {
  string tenant_id = 1;
  int64 ap_id = 2;
  string ap_name = 3;

  message Endpoints {
    repeated string cluster = 1;
    repeated string file = 2;
    repeated string data = 3;
  }
  Endpoints endpoints = 4;
}

// NetworkUnit describes the network unit informations.
message NetworkUnit {
  int64 bk_networkunit_id = 1;
  string bk_networkunit_name = 2;
  repeated AccessPoint access_points = 3;

  message Links {
    Link cluster = 1;
    Link file = 2;
    Link data = 3;
  }
  Links links = 4;
}

// HostState describes the host state informations. Usually contains
// agent-related things.
message HostState {
  string status = 1;
  string version = 2;
  string bk_agent_id = 3;
}

// HostInfo describes the host info informations. Usually contains static
// configs.
message HostInfo {
  int64 bk_host_id = 1;
  string bk_host_name = 2;
  int64 bk_biz_id = 3;
  string bk_biz_name = 4;
  int64 bk_networkarea_id = 5;
  string bk_networkarea_name = 6;
  int64 bk_networkunit_id = 7;
  string bk_networkunit_name = 8;
  int64 bk_operate_dept_id = 9;
  string bk_operate_dept_name = 10;
  string bk_host_innerip = 11;
  string bk_host_innerip_v6 = 12;
  string bk_host_outerip = 13;
  string bk_host_outerip_v6 = 14;
  string login_ip = 15;
  uint32 login_port = 16;
  string bk_os_type = 17;
}

// Host describes the host informations.
message Host {
  HostState state = 1;
  HostInfo info = 2;
  uint64 create_at = 3;
  uint64 updated_at = 4;
}
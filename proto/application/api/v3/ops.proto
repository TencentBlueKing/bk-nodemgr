syntax = "proto3";
package v3;
option go_package = "github.com/TencentBlueKing/bk-nodemgr/pkg/protocol/application/api/v3";

import "common.proto";

import "google/api/annotations.proto";

// NodeOpsHistoryInfo describes one batch of out-of-band settings.
message NodeOpsHistoryInfo {
  optional string operate_id = 1;
  optional string operator = 2;
  optional int64 operate_time = 3;
  optional string node_role = 4;
  repeated int64 bk_biz_id = 5;
}

// NodeOpsHistoryExactConditions describes the exact conditions of the history
// list request.
// Values within a field are ORed; different fields are ANDed.
// Empty fields do not restrict the query.
message NodeOpsHistoryExactConditions {
  repeated string operate_id = 1;
  repeated string operator = 2;
  repeated string node_role = 3;
  repeated int64 bk_biz_id = 4;
}

// NodeOpsHistoryFuzzyConditions describes the fuzzy conditions of the history
// list request.
message NodeOpsHistoryFuzzyConditions {}

// NodeOpsHistoryListReq describes the history list request for all node roles.
message NodeOpsHistoryListReq {
  Page page = 1;
  bool only_count = 2;

  NodeOpsHistoryExactConditions exact_include_conditions = 3;
  NodeOpsHistoryFuzzyConditions fuzzy_include_conditions = 4;
  TimeRange operate_time_range = 5;
}

// NodeOpsHistoryListResp describes the operation history list response.
message NodeOpsHistoryListResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {
    // Number of matching operations, not hosts.
    int64 total = 1;
    repeated NodeOpsHistoryInfo items = 2;
  }
  Data data = 5;
}

// NodeOpsHistoryHostSnapshot preserves host information and submitted settings.
message NodeOpsHistoryHostSnapshot {
  optional int64 bk_host_id = 1;
  optional int64 ops_console_host_id = 2;
  repeated string ops_console_host_innerip_list = 3;
  repeated string ops_console_host_innerip_v6_list = 4;
  optional string ops_out_band_ip = 5;
  optional int64 ops_out_band_port = 6;
  optional string ops_out_band_protocol = 7;
  optional string ops_out_band_type = 8;
}

// NodeOpsHistoryDetailReq describes the snapshot retrieval request for all node
// roles.
message NodeOpsHistoryDetailReq {
  // Required operation ID. Returns all host snapshots without pagination.
  string operate_id = 1;
}

// NodeOpsHistoryDetailResp describes the read-only snapshot retrieval response.
message NodeOpsHistoryDetailResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {
    // Number of accessible host snapshots for this operation.
    int64 total = 1;
    repeated NodeOpsHistoryHostSnapshot items = 2;
  }
  Data data = 5;
}

// NodeOpsInfo describes the out-of-band (ops) information for a node.
message NodeOpsInfo {
  int64 bk_host_id = 1;
  int64 ops_console_host_id = 2;
  string ops_out_band_type = 3;
  string ops_out_band_protocol = 4;
  string ops_out_band_ip = 5;
  int64 ops_out_band_port = 6;
}

// NodeOpsUpdateFieldsAgentReq describes the batch update of agent ops fields.
message NodeOpsUpdateFieldsAgentReq { repeated NodeOpsInfo hosts = 1; }

// NodeOpsUpdateFieldsAgentResp describes the agent ops fields update response.
message NodeOpsUpdateFieldsAgentResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;
  message Data {}
  Data data = 5;
}

// NodeOpsUpdateFieldsProxyReq describes the batch update of proxy ops fields.
message NodeOpsUpdateFieldsProxyReq { repeated NodeOpsInfo hosts = 1; }

// NodeOpsUpdateFieldsProxyResp describes the proxy ops fields update response.
message NodeOpsUpdateFieldsProxyResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;
  message Data {}
  Data data = 5;
}

// Ops provides out-of-band settings and operation history.
service Ops {
  // NodeOpsHistoryList lists operations across agent and proxy roles within
  // the caller's permission scope.
  rpc NodeOpsHistoryList(NodeOpsHistoryListReq)
      returns (NodeOpsHistoryListResp) {
    option (google.api.http) = {
      post : "/api/v3/node/ops/history/list"
      body : "*"
    };
  }

  // NodeOpsHistoryDetail retrieves all archived snapshots for an operation
  // within the caller's permission scope.
  rpc NodeOpsHistoryDetail(NodeOpsHistoryDetailReq)
      returns (NodeOpsHistoryDetailResp) {
    option (google.api.http) = {
      post : "/api/v3/node/ops/history/detail"
      body : "*"
    };
  }

  // NodeOpsUpdateFieldsAgent batch-updates out-of-band fields for agent hosts.
  rpc NodeOpsUpdateFieldsAgent(NodeOpsUpdateFieldsAgentReq)
      returns (NodeOpsUpdateFieldsAgentResp) {
    option (google.api.http) = {
      post : "/api/v3/node/ops/update_fields/agent"
      body : "*"
    };
  }

  // NodeOpsUpdateFieldsProxy batch-updates out-of-band fields for proxy hosts.
  rpc NodeOpsUpdateFieldsProxy(NodeOpsUpdateFieldsProxyReq)
      returns (NodeOpsUpdateFieldsProxyResp) {
    option (google.api.http) = {
      post : "/api/v3/node/ops/update_fields/proxy"
      body : "*"
    };
  }
}

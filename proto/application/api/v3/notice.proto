syntax = "proto3";
package v3;
option go_package = "github.com/TencentBlueKing/bk-nodemgr/pkg/protocol/application/api/v3";

import "common.proto";

import "google/api/annotations.proto";

// GetCurrentAnnouncementsReq describes the request to get current
// announcements. All parameters (platform and username) are automatically
// obtained from config and context.
message GetCurrentAnnouncementsReq {
  // Empty request - all parameters are obtained from context automatically
}

// AnnouncementContent describes announcement content in a specific language.
message AnnouncementContent {
  string content = 1 [ json_name = "content" ];
  string language = 2 [ json_name = "language" ];
}

// Announcement describes a platform announcement.
message Announcement {
  int64 id = 1 [ json_name = "id" ];
  string title = 2 [ json_name = "title" ];
  repeated AnnouncementContent content_list = 3 [ json_name = "content_list" ];
  string content = 4 [ json_name = "content" ];
  string announce_type = 5 [ json_name = "announce_type" ];
  string start_time = 6 [ json_name = "start_time" ]; // RFC3339 format string
  string end_time = 7 [ json_name = "end_time" ];     // RFC3339 format string
}

// GetCurrentAnnouncementsResp describes the response for getting current
// announcements.
message GetCurrentAnnouncementsResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;

  message Data { repeated Announcement items = 1; }
  Data data = 5;
}

// NoticeAPI provides announcement-related APIs.
service NoticeAPI {
  // GetCurrentAnnouncements retrieves current active announcements.
  // Platform and username are automatically obtained from config and context.
  rpc GetCurrentAnnouncements(GetCurrentAnnouncementsReq)
      returns (GetCurrentAnnouncementsResp) {
    option (google.api.http) = {
      get : "/api/v3/notice/announcements/current"
    };
  }
}

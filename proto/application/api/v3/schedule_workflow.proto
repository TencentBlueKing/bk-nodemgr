syntax = "proto3";
package v3;
option go_package = "github.com/TencentBlueKing/bk-nodemgr/pkg/protocol/application/api/v3";

import "common.proto";
import "workflow.proto";
import "google/api/annotations.proto";

// 周期工作流 ID、名称及操作人的精确筛选条件。
message ScheduleWorkflowExactConditions {
  repeated string workflow_id = 1;
  repeated string workflow_name = 2;
  repeated string operator = 3;
}

// 预留的模糊筛选条件，当前不支持模糊筛选。
message ScheduleWorkflowFuzzyConditions {}

// 查询当前租户的周期工作流配置。
message ScheduleWorkflowListReq {
  // 分页条件。
  Page page = 1;
  // 是否仅返回总数。
  bool only_count = 2;
  ScheduleWorkflowExactConditions exact_include_conditions = 3;
  ScheduleWorkflowFuzzyConditions fuzzy_include_conditions = 4;
  // 配置操作时间范围，不代表执行实例的起止时间。
  TimeRange operate_time_range = 5;
}

// 周期工作流的长期调度配置；启用状态不代表某轮执行已经完成。
message ScheduleWorkflowListResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  // 一项周期工作流调度配置。
  message ScheduleWorkflow {
    optional string workflow_id = 1;
    optional string workflow_name = 2;
    optional string trigger_id = 3;
    optional string operator = 4;
    // 配置操作时间，Unix 毫秒时间戳。
    optional int64 operate_time = 5;
    // 是否启用周期调度。
    bool enabled = 6;
    // 周期调度间隔。
    string interval = 7;
  }

  message Data {
    int64 total = 1;
    repeated ScheduleWorkflow items = 2;
  }
  Data data = 5;
}

// 查询周期工作流根操作，或下钻某轮父实例的直接子操作。
message ScheduleWorkflowOperationListReq {
  bool only_count = 1;
  Page page = 2;
  // 周期工作流 ID，必填。
  string workflow_id = 3;
  // 父操作实例 ID；为空时查询工作流根操作。
  string parent_oper_inst_id = 4;
}

// 周期工作流的操作记录及最近一次执行状态。
message ScheduleWorkflowOperationListResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  // 一条周期工作流操作记录。
  message ScheduleWorkflowOperation {
    string operation_id = 1;
    repeated string instance_ids = 2;
    // 操作初始化时记录的操作人；未记录时为空。
    string operator = 3;
    // 操作创建时间，Unix 毫秒时间戳。
    int64 create_time = 4;
    WorkflowOperInstBriefData latest_oper_inst_brief_data = 5;
    string parent_operation_id = 6;
    string parent_oper_inst_id = 7;
  }

  message Data {
    repeated ScheduleWorkflowOperation operations = 1;
    int64 total = 2;
  }
  Data data = 5;
}

// 按操作 ID 或实例 ID 查询周期工作流执行实例；两类 ID 至少提供一类。
message ScheduleWorkflowOperationInstanceListReq {
  bool only_count = 1;
  // 操作 ID 列表，每项均不能为空。
  repeated string operation_id = 2;
  // 操作实例 ID 列表，每项均不能为空。
  repeated string oper_inst_id = 3;
}

// 保留范围内的执行实例及生命周期；每个实例对应一轮执行。
message ScheduleWorkflowOperationInstanceListResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {
    int64 total = 1;
    repeated WorflowOperationInstanceData oper_inst_data = 2;
  }
  Data data = 5;
}

// 查询一个周期工作流操作实例的步骤日志。
message ScheduleWorkflowOperationInstanceLogGetReq {
  // 操作实例 ID，必填。
  string oper_inst_id = 1;
}

// 执行实例的步骤日志及额外执行日志，受历史清理策略保留范围限制。
message ScheduleWorkflowOperationInstanceLogGetResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {
    map<string, WorkflowActionData> oper_inst_logs = 1;
    WorkflowActionMessage extra_execution_logs = 2;
  }
  Data data = 5;
}

// 修改当前租户内一个定时工作流的调度周期。
message ScheduleWorkflowUpdateIntervalReq {
  // 定时工作流 ID，必填。
  string workflow_id = 1;
  // 周期表达式，必填；支持含秒的六段 Cron 及 @every 10m 等描述符。
  string interval = 2;
}

// 周期配置已保存，不代表调度器已完成同步。
message ScheduleWorkflowUpdateIntervalResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;
  Permission permission = 6;

  message Data {}
  Data data = 5;
}

// 周期工作流配置管理及执行记录、实例和日志查询接口。
service ScheduleWorkflow {
  // 修改定时工作流的周期配置，由现有调度同步机制异步生效；不重置上次触发时间或中止正在执行的实例。
  rpc ScheduleWorkflowUpdateInterval(ScheduleWorkflowUpdateIntervalReq)
      returns (ScheduleWorkflowUpdateIntervalResp) {
    option (google.api.http) = {
      post : "/api/v3/schedule/workflow/interval/update"
      body : "*"
    };
  }

  // 查询当前租户的周期工作流调度配置。
  rpc ScheduleWorkflowList(ScheduleWorkflowListReq)
      returns (ScheduleWorkflowListResp) {
    option (google.api.http) = {
      post : "/api/v3/schedule/workflow/list"
      body : "*"
    };
  }

  // 查询周期工作流根操作，或按父实例下钻直接子操作。
  rpc ScheduleWorkflowOperationList(ScheduleWorkflowOperationListReq)
      returns (ScheduleWorkflowOperationListResp) {
    option (google.api.http) = {
      post : "/api/v3/schedule/workflow/operation/list"
      body : "*"
    };
  }

  // 按操作 ID 或实例 ID 查询周期工作流执行实例及历史状态。
  rpc ScheduleWorkflowOperationInstanceList(
      ScheduleWorkflowOperationInstanceListReq)
      returns (ScheduleWorkflowOperationInstanceListResp) {
    option (google.api.http) = {
      post : "/api/v3/schedule/workflow/operation/instance/list"
      body : "*"
    };
  }

  // 按实例 ID 查询周期工作流步骤状态、双语日志及子工作流引用。
  rpc ScheduleWorkflowOperationInstanceLogGet(
      ScheduleWorkflowOperationInstanceLogGetReq)
      returns (ScheduleWorkflowOperationInstanceLogGetResp) {
    option (google.api.http) = {
      post : "/api/v3/schedule/workflow/operation/instance/log/get"
      body : "*"
    };
  }
}

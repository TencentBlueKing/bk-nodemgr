syntax = "proto3";
package v3;
option go_package = "github.com/TencentBlueKing/bk-nodemgr/pkg/protocol/application/api/v3";

import "common.proto";

import "google/api/annotations.proto";

// PackageUploadOriginAgentReq is the request for upload origin agent pkg.
message PackageUploadOriginAgentReq {
  int64 generation = 1;
  bool overwrite = 2;
}

// PackageUploadOriginAgentResp is the response for upload origin agent pkg.
message PackageUploadOriginAgentResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;

  message Data {
    optional string upload_id = 1;
    optional bool existed = 2;
    optional bool generated = 3;
    optional string name = 4;
    optional int64 size = 5;
    optional string md5 = 6;
    optional string version = 7;
    optional string change_log_en = 8;
    optional string change_log_zh = 9;
    repeated Platform platforms = 10;
  }
  Data data = 5;
}

// PackageUploadOriginServerReq is the request for upload origin server pkg.
message PackageUploadOriginServerReq {
  int64 generation = 1;
  bool overwrite = 2;
}

// PackageUploadOriginServerResp is the response for upload origin server pkg.
message PackageUploadOriginServerResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;

  message Data {
    optional string upload_id = 1;
    optional bool existed = 2;
    optional bool generated = 3;
    optional string name = 4;
    optional int64 size = 5;
    optional string md5 = 6;
    optional string version = 7;
    repeated Platform platforms = 8;
    optional string change_log_en = 9;
    optional string change_log_zh = 10;
  }
  Data data = 5;
}

// PackageUploadOriginCertResp is the response for upload origin cert pkg.
message PackageUploadOriginCertReq { bool overwrite = 1; }

// PackageUploadOriginCertResp is the response for upload origin cert pkg.
message PackageUploadOriginCertResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;

  message Data {
    optional string upload_id = 1;
    optional bool existed = 2;
    optional bool generated = 3;
    optional string name = 4;
    optional int64 size = 5;
    optional string md5 = 6;
    repeated string cert_files = 7;
  }
  Data data = 5;
}

// PackageUploadOriginBinToolReq is the request for upload origin bin tool pkg.
message PackageUploadOriginBinToolReq {
  int64 generation = 1;
  bool overwrite = 2;
}

// PackageUploadOriginBinToolResp is the response for upload origin bin tool
// pkg.
message PackageUploadOriginBinToolResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;

  message Data {
    optional string upload_id = 1;
    optional bool existed = 2;
    optional bool generated = 3;
    optional string name = 4;
    optional int64 size = 5;
    optional string md5 = 6;
    repeated Platform agent_platforms = 7;
    repeated Platform proxy_platforms = 8;
  }
  Data data = 5;
}

// PackagePublishReleaseAgentReq is the request for upload release agent pkg.
message PackagePublishReleaseAgentReq { string upload_id = 1; }

// PackagePublishReleaseAgentResp is the response for upload release agent pkg.
message PackagePublishReleaseAgentResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;

  message Data {}
  Data data = 5;
}

// PackagePublishReleaseProxyReq is the request for upload release proxy pkg.
message PackagePublishReleaseProxyReq { string upload_id = 1; }

// PackagePublishReleaseProxyResp is the response for upload release proxy pkg.
message PackagePublishReleaseProxyResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;

  message Data {}
  Data data = 5;
}

// PackagePublishReleaseCertReq is the request for upload release cert pkg.
message PackagePublishReleaseCertReq { string upload_id = 1; }

// PackagePublishReleaseCertResp is the response for upload release cert pkg.
message PackagePublishReleaseCertResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;

  message Data {}
  Data data = 5;
}

// PackagePublishReleaseBinToolReq is the request for upload release bintool
// pkg.
message PackagePublishReleaseBinToolReq { string upload_id = 1; }

// PackagePublishReleaseBinToolResp is the response for upload release bintool
// pkg.
message PackagePublishReleaseBinToolResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;

  message Data {}
  Data data = 5;
}

// PackageReleaseExactConditions describes release exact conditions.
message PackageReleaseExactConditions {
  repeated int64 generation = 1;
  repeated string release_type = 2;
  repeated Platform platform = 3;
  repeated string version = 4;
  repeated bool as_default = 5;
  repeated bool enabled = 6;
}

// PackageReleaseListReq describes the HTTP request body when list package
// release.
message PackageReleaseListReq {
  Page page = 1;
  string release_type = 2;
  int64 generation = 3;
  bool only_count = 4;

  PackageReleaseExactConditions exact_include_conditions = 5;
}

// PackageReleaseListResp describes the HTTP response body when list package
// release.
message PackageReleaseListResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;

  message Data {
    int64 total = 1;
    repeated Release items = 2;
  }
  Data data = 5;
}

// PackageReleaseSetLabelsReq describes the HTTP request body when set labels.
message PackageReleaseSetLabelsReq {
  int64 generation = 1;
  string release_type = 2;
  Platform platform = 3;
  string version = 4;
  repeated string labels = 5;
}

// PackageReleaseSetLabelsResp describes the HTTP response body when set
// labels.
message PackageReleaseSetLabelsResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;

  message Data {}
  Data data = 5;
}

// PackageReleaseSetLabelsManyIdentity describes the HTTP request body.
message PackageReleaseSetLabelsManyIdentity {
  int64 generation = 1;
  Platform platform = 2;
  string version = 3;
}
// PackageReleaseSetLabelsManyReq describes the HTTP request body when set many
// labels.
message PackageReleaseSetLabelsManyReq {
  string release_type = 1;
  repeated PackageReleaseSetLabelsManyIdentity identify = 2;
  repeated string labels = 3;
}

// PackageReleaseSetLabelsManyResp describes the HTTP response body when set
// many labels.
message PackageReleaseSetLabelsManyResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;

  message Data {}
  Data data = 5;
}

// PackageReleaseEnableReq describes the HTTP request body when enable package
// release.
message PackageReleaseEnableReq {
  int64 generation = 1;
  string release_type = 2;
  Platform platform = 3;
  string version = 4;
}

// PackageReleaseEnableResp describes the HTTP response body when enable package
// release.
message PackageReleaseEnableResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;

  message Data {}
  Data data = 5;
}

// PackageReleaseDisableReq describes the HTTP request body when disable package
// release.
message PackageReleaseDisableReq {
  int64 generation = 1;
  string release_type = 2;
  Platform platform = 3;
  string version = 4;
}

// PackageReleaseDisableResp describes the HTTP response body when disable
// package release.
message PackageReleaseDisableResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;

  message Data {}
  Data data = 5;
}

// PackageReleaseSetAsDefaultReq describes the HTTP request body when set
// default package release.
message PackageReleaseSetAsDefaultReq {
  int64 generation = 1;
  string release_type = 2;
  Platform platform = 3;
  string version = 4;
}

// PackageReleaseSetAsDefaultResp describes the HTTP response body when set
// default package release.
message PackageReleaseSetAsDefaultResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;

  message Data {}
  Data data = 5;

// PackageUploadOriginAgentReq is the request for upload origin agent pkg.
message PackageUploadOriginAgentReq {
  int64 generation = 1;
  bool overwrite = 2;
}

// PackageUploadOriginAgentResp is the response for upload origin agent pkg.
message PackageUploadOriginAgentResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;

  message Data {
    optional string upload_id = 1;
    optional bool existed = 2;
    optional bool generated = 3;
    optional string name = 4;
    optional int64 size = 5;
    optional string md5 = 6;
    optional string version = 7;
    optional string change_log_en = 8;
    optional string change_log_zh = 9;
    repeated Platform platforms = 10;
  }
  Data data = 5;
}


// PackageReleaseCancelAsDefaultReq describes the HTTP request body when cancel
// default package release.
message PackageReleaseCancelAsDefaultReq {
  int64 generation = 1;
  string release_type = 2;
  Platform platform = 3;
  string version = 4;
}

// PackageReleaseCancelAsDefaultResp describes the HTTP response body when
// cancel default package release.
message PackageReleaseCancelAsDefaultResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;

  message Data {}
  Data data = 5;
}

// PackageReleaseDeleteReq describes the HTTP request body when delete release.
message PackageReleaseDeleteReq {
  int64 generation = 1;
  string release_type = 2;
  Platform platform = 3;
  string version = 4;
}

// PackageReleaseDeleteResp describes the HTTP response body when delete
// release.
message PackageReleaseDeleteResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;

  message Data {}
  Data data = 5;
}

// CountRequestItem describes  the HTTP request body when count release
// deployed_host.
message CountRequestItem {
  int64 generation = 1;
  string release_type = 2;
  Platform platform = 3;
  string version = 4;
}

// PackageReleaseDeployedHostCountReq describes the HTTP request body when count
// deployed host.
message PackageReleaseDeployedHostCountReq {
  repeated CountRequestItem request_items = 1;
}

// PackageReleaseDeployedHostCountResp describes the HTTP response body when
// count deployed host.
message PackageReleaseDeployedHostCountResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;

  message Data {
    int64 total = 1;
    repeated int64 items = 2;
  }
  Data data = 5;
}

// PackageReleaseAgentDownloadReq is the request for download agent pkg.
message PackageReleaseAgentDownloadReq {
  int64 generation = 1;
  Platform platform = 2;
  string version = 3;
}

// PackageReleaseProxyDownloadReq is the request for download proxy pkg.
message PackageReleaseProxyDownloadReq {
  int64 generation = 1;
  Platform platform = 2;
  string version = 3;
}

// FileChunk describes the file chunk data.
message FileChunk { bytes content = 1; }

// PackageEventExactConditions describes the conditions when list event.
message PackageEventExactConditions {
  repeated int64 generation = 1;
  repeated string os_type = 2;
  repeated string cpu_arch = 3;
  repeated string release_type = 4;
  repeated string operator = 5;
  repeated string event_type = 6;
  repeated string version = 7;
}

// PackageEventFuzzyConditions describes the conditions when list event
message PackageEventFuzzyConditions {}

// PackageEventListReq describes the HTTP request body when list event in
// Package service.
message PackageEventListReq {
  Page page = 1;
  bool only_count = 2;

  PackageEventExactConditions exact_include_conditions = 3;
  PackageEventFuzzyConditions fuzzy_include_conditions = 4;
  TimeRange operate_time_range = 5;
}

// PackageEventListResp describes the HTTP response body when list event in
// Package service.
message PackageEventListResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;

  message Data {
    int64 total = 1;
    repeated PackageEvent items = 2;
  }
  Data data = 5;
}

// PackageEventDistinctReq describes the HTTP request body when distinct
// packageevent in package service.
message PackageEventDistinctReq {
  PackageEventExactConditions exact_include_conditions = 1;
  PackageEventFuzzyConditions fuzzy_include_conditions = 2;
  TimeRange operate_time_range = 3;
}

// PackageEventDistinctResp describes the HTTP response body when distinct
// packageevent in package service.
message PackageEventDistinctResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  Error error = 4;

  message Data {
    repeated string release_type = 1;
    repeated string event_type = 2;
    repeated string os_type = 3;
    repeated string cpu_arch = 4;
    repeated string version = 5;
    repeated string operator = 6;
  }
  Data data = 5;
}

service Package {
  // UploadOriginAgent provides origin agent upload.
  rpc UploadOriginAgent(PackageUploadOriginAgentReq)
      returns (PackageUploadOriginAgentResp) {
    option (google.api.http) = {
      post : "/api/v3/package/upload/origin/agent"
      body : "*"
    };
  }

  // UploadOriginServer provides origin server upload.
  rpc UploadOriginServer(PackageUploadOriginServerReq)
      returns (PackageUploadOriginServerResp) {
    option (google.api.http) = {
      post : "/api/v3/package/upload/origin/server"
      body : "*"
    };
  }

  // UploadOriginCert provides origin cert upload.
  rpc UploadOriginCert(PackageUploadOriginCertReq)
      returns (PackageUploadOriginCertResp) {
    option (google.api.http) = {
      post : "/api/v3/package/upload/origin/cert"
      body : "*"
    };
  }

  // UploadOriginBinTool provides origin bintool upload.
  rpc UploadOriginBinTool(PackageUploadOriginBinToolReq)
      returns (PackageUploadOriginBinToolResp) {
    option (google.api.http) = {
      post : "/api/v3/package/upload/origin/bintool"
      body : "*"
    };
  }

  // PublishReleaseAgent provides release agent publish.
  rpc PublishReleaseAgent(PackagePublishReleaseAgentReq)
      returns (PackagePublishReleaseAgentResp) {
    option (google.api.http) = {
      post : "/api/v3/package/publish/release/agent"
      body : "*"
    };
  }

  // PublishReleaseServer provides release server publish.
  rpc PublishReleaseProxy(PackagePublishReleaseProxyReq)
      returns (PackagePublishReleaseProxyResp) {
    option (google.api.http) = {
      post : "/api/v3/package/publish/release/proxy"
      body : "*"
    };
  }

  // PublishReleaseCert provides release cert publish.
  rpc PublishReleaseCert(PackagePublishReleaseCertReq)
      returns (PackagePublishReleaseCertResp) {
    option (google.api.http) = {
      post : "/api/v3/package/publish/release/cert"
      body : "*"
    };
  }

  // PublishReleaseBinTool provides release bintool publish.
  rpc PublishReleaseBinTool(PackagePublishReleaseBinToolReq)
      returns (PackagePublishReleaseBinToolResp) {
    option (google.api.http) = {
      post : "/api/v3/package/publish/release/bintool"
      body : "*"
    };
  }

  // ListRelease lists releases.
  rpc ListRelease(PackageReleaseListReq) returns (PackageReleaseListResp) {
    option (google.api.http) = {
      post : "/api/v3/package/release/list"
      body : "*"
    };
  }

  // SetReleaseLabels sets release labels.
  rpc SetReleaseLabels(PackageReleaseSetLabelsReq)
      returns (PackageReleaseSetLabelsResp) {
    option (google.api.http) = {
      post : "/api/v3/package/release/set_labels"
      body : "*"
    };
  }

  // SetReleaseLabeslMany sets many release labels.
  rpc SetReleaseLabelsMany(PackageReleaseSetLabelsManyReq)
      returns (PackageReleaseSetLabelsManyResp) {
    option (google.api.http) = {
      post : "/api/v3/package/release/set_labels_many"
      body : "*"
    };
  }

  // EnableRelease enables release.
  rpc EnableRelease(PackageReleaseEnableReq)
      returns (PackageReleaseEnableResp) {
    option (google.api.http) = {
      post : "/api/v3/package/release/enable"
      body : "*"
    };
  }

  // DisableRelease disables release.
  rpc DisableRelease(PackageReleaseDisableReq)
      returns (PackageReleaseDisableResp) {
    option (google.api.http) = {
      post : "/api/v3/package/release/disable"
      body : "*"
    };
  }

  // SetAsDefaultRelease sets release as default.
  rpc SetAsDefaultRelease(PackageReleaseSetAsDefaultReq)
      returns (PackageReleaseSetAsDefaultResp) {
    option (google.api.http) = {
      post : "/api/v3/package/release/set_as_default"
      body : "*"
    };
  }

  // CancelAsDefaultRelease cancels release as default.
  rpc CancelAsDefaultRelease(PackageReleaseCancelAsDefaultReq)
      returns (PackageReleaseCancelAsDefaultResp) {
    option (google.api.http) = {
      post : "/api/v3/package/release/cancel_as_default"
      body : "*"
    };
  }

  // DeleteRelease deletes release.
  rpc DeleteRelease(PackageReleaseDeleteReq)
      returns (PackageReleaseDeleteResp) {
    option (google.api.http) = {
      post : "/api/v3/package/release/delete"
      body : "*"
    };
  }

  // DeployedHostCount count deployed host.
  rpc DeployedHostCount(PackageReleaseDeployedHostCountReq)
      returns (PackageReleaseDeployedHostCountResp) {
    option (google.api.http) = {
      post : "/api/v3/package/release/deployed_host/count"
      body : "*"
    };
  }

  // DownloadAgent download release agent package.
  rpc DownloadAgent(PackageReleaseAgentDownloadReq) returns (FileChunk) {
    option (google.api.http) = {
      post : "/api/v3/package/release/agent/download"
      body : "*"
    };
  }

  // DownloadProxy download release proxy package.
  rpc DownloadProxy(PackageReleaseProxyDownloadReq) returns (FileChunk) {
    option (google.api.http) = {
      post : "/api/v3/package/release/proxy/download"
      body : "*"
    };
  }

  // PackageEventList provides package event listing.
  rpc PackageEventList(PackageEventListReq) returns (PackageEventListResp) {
    option (google.api.http) = {
      post : "/api/v3/package/event/list"
      body : "*"
    };
  }

  // PackageEventDistinct provides package event distincting.
  rpc PackageEventDistinct(PackageEventDistinctReq)
      returns (PackageEventDistinctResp) {
    option (google.api.http) = {
      post : "/api/v3/package/event/distinct"
      body : "*"
    };
  }
}
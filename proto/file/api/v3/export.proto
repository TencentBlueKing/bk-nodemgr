syntax = "proto3";
package v3;
option go_package = "github.com/TencentBlueKing/bk-nodemgr/pkg/protocol/file/api/v3";

import "google/api/annotations.proto";
import "download.proto";

// ExportPrepareOriginPluginPackageReq describes the request for preparing an
// origin plugin package.
message ExportPrepareOriginPluginPackageReq {
  string plugin_pkg_name = 1;
  string plugin_pkg_version = 2;
}

// ExportPrepareOriginPluginPackageResp describes the response for preparing an
// plugin package.
message ExportPrepareOriginPluginPackageResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;

  message Data { string export_id = 1; }

  Data data = 4;
}

// ExportGetOriginPluginPackageDownloadAddress describes the request for getting
// the origin plugin package download address.
message ExportGetOriginPluginPackageDownloadAddressReq { string export_id = 1; }

// ExportGetOriginPluginPackageDownloadAddressResp describes the response for
// getting the origin plugin package download address.
message ExportGetOriginPluginPackageDownloadAddressResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;

  message Data {
    string download_url = 1;
    int64 download_url_expired_at = 2;
  }

  Data data = 4;
}

// ExportOriginPluginPackageReq describes the request for export origin plugin
// package.
message ExportOriginPluginPackageReq { string token = 1; }

// Export service provides package export operations.
service Export {
  // ExportPrepareOriginPluginPackage prepares an origin plugin package for
  // exporting.
  rpc ExportPrepareOriginPluginPackage(ExportPrepareOriginPluginPackageReq)
      returns (ExportPrepareOriginPluginPackageResp) {
    option (google.api.http) = {
      post : "/api/v3/export/prepare/origin_plugin_package"
      body : "*"
    };
  }

  // ExportGetOriginPluginPackageDownloadAddress gets the download address of
  // the origin plugin package.
  rpc ExportGetOriginPluginPackageDownloadAddress(
      ExportGetOriginPluginPackageDownloadAddressReq)
      returns (ExportGetOriginPluginPackageDownloadAddressResp) {
    option (google.api.http) = {
      post : "/api/v3/export/get_address/origin_plugin_package"
      body : "*"
    };
  }

  // ExportOriginPluginPackage exported origin plugin package using a temporary
  // export token.
  rpc ExportOriginPluginPackage(ExportOriginPluginPackageReq)
      returns (stream FileChunk) {
    option (google.api.http) = {
      get : "/api/v3/export/download/origin_plugin_package"
    };
  }
}

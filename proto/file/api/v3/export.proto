syntax = "proto3";
package v3;
option go_package = "github.com/TencentBlueKing/bk-nodemgr/pkg/protocol/file/api/v3";

import "google/api/annotations.proto";
import "download.proto";

// ExportPrepareOriginPluginPackageReq describes the request for preparing an
// origin plugin package.
message ExportPrepareOriginPluginPackageReq {
  string plugin_pkg_name = 1;
  string plugin_pkg_version = 2;
  string upload_origin_pkg_type = 3;
  repeated string upload_ids = 4;
  string workflow_id = 5;
}

// ExportPrepareOriginPluginPackageResp describes the response for preparing an
// plugin package.
message ExportPrepareOriginPluginPackageResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;

  message Data {
    string filename = 1;
    int64 size = 2;
    string md5 = 3;
  }

  Data data = 4;
}

// ExportOriginPluginPackageReq describes the request for export origin plugin
// package.
message ExportOriginPluginPackageReq { string token = 1; }

// Export service provides package export operations.
service Export {
  // ExportPrepareOriginPluginPackage prepares an origin plugin package for
  // exporting.
  rpc ExportPrepareOriginPluginPackage(ExportPrepareOriginPluginPackageReq)
      returns (ExportPrepareOriginPluginPackageResp) {
    option (google.api.http) = {
      post : "/api/v3/export/prepare/origin_plugin_packge"
      body : "*"
    };
  }

  // ExportOriginPluginPackage exported origin plugin package using a temporary
  // export token.
  rpc ExportOriginPluginPackage(ExportOriginPluginPackageReq)
      returns (stream FileChunk) {
    option (google.api.http) = {
      get : "/api/v3/export/download/origin_plugin_packge"
    };
  }
}

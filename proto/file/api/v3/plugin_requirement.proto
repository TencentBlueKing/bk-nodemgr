syntax = "proto3";
package v3;
option go_package = "github.com/TencentBlueKing/bk-nodemgr/pkg/protocol/file/api/v3";

import "google/api/annotations.proto";

// 当前租户的插件依赖文件记录，不代表已绑定到插件或应用到进程。
message PluginRequirementFileRecord {
  // 文件记录的 UUID。
  string id = 1;
  // 原始文件名，不含目录。
  string name = 2;
  // 文件在存储中的名称。
  string saved_name = 3;
  // 文件内容的 MD5。
  string md5 = 4;
  // 文件大小，单位为字节。
  int64 size = 5;
  // 最近更新时间，Unix 时间戳，单位为秒。
  int64 updated_at = 6;
  // 最近操作人。
  string operator = 7;
}

// 创建插件依赖文件的参数。
message PluginRequirementCreateReq {
  // 原始文件名，必须是安全的单个文件名。
  string name = 1;
  // 文件正文的 Base64 编码。
  string content_base64 = 2;
}

// 创建插件依赖文件后返回的记录。
message PluginRequirementCreateResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  message Data { PluginRequirementFileRecord file = 1; }
  Data data = 4;
}

// 替换插件依赖文件名称及正文的参数。
message PluginRequirementUpdateReq {
  // 文件记录的 UUID。
  string id = 1;
  // 原始文件名，必须是安全的单个文件名。
  string name = 2;
  // 替换后的文件正文的 Base64 编码。
  string content_base64 = 3;
}

// 更新插件依赖文件后返回的记录。
message PluginRequirementUpdateResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  message Data { PluginRequirementFileRecord file = 1; }
  Data data = 4;
}

// 按 UUID 查询插件依赖文件记录的参数。
message PluginRequirementGetReq {
  // 文件记录的 UUID。
  string id = 1;
}

// 插件依赖文件记录的查询结果，不包含文件正文。
message PluginRequirementGetResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  message Data { PluginRequirementFileRecord file = 1; }
  Data data = 4;
}

// 下载插件依赖文件正文的参数。
message PluginRequirementDownloadReq {
  // 文件记录的 UUID，通过查询参数传递。
  string id = 1;
}

// 插件依赖文件的二进制内容；HTTP 下载直接返回文件正文。
message PluginRequirementDownloadResp { bytes content = 1; }

// 将插件依赖文件传输到目标主机的参数。
message PluginRequirementTransferReq {
  // 文件记录的 UUID。
  string id = 1;
  // 目标文件名，必须是安全的单个文件名。
  string target_name = 2;
  // 目标主机上的文件目录，不得为空。
  string target_dir = 3;
  // 目标主机 ID。
  int64 target_host_id = 4;
}

// 已启动的插件依赖文件传输任务，不代表传输完成。
message PluginRequirementTransferResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  message Data {
    // 可用于查询传输状态的任务 ID。
    optional string task_id = 1;
    // 传输的文件名。
    optional string file_name = 2;
    // 文件内容的 MD5。
    optional string file_md5 = 3;
    // 文件大小，单位为字节。
    optional int64 file_size = 4;
  }
  Data data = 4;
}

// 管理当前租户的插件依赖文件及其传输。
service PluginRequirement {
  // 创建插件依赖文件及独立文件记录，不修改插件依赖绑定。
  rpc PluginRequirementCreate(PluginRequirementCreateReq)
      returns (PluginRequirementCreateResp) {
    option (google.api.http) = {
      post : "/api/v3/plugin/requirement/create"
      body : "*"
    };
  }

  // 替换当前租户指定依赖文件的名称及正文，保留文件记录 ID。
  rpc PluginRequirementUpdate(PluginRequirementUpdateReq)
      returns (PluginRequirementUpdateResp) {
    option (google.api.http) = {
      post : "/api/v3/plugin/requirement/update"
      body : "*"
    };
  }

  // 按 UUID 查询当前租户的插件依赖文件记录。
  rpc PluginRequirementGet(PluginRequirementGetReq)
      returns (PluginRequirementGetResp) {
    option (google.api.http) = {
      post : "/api/v3/plugin/requirement/get"
      body : "*"
    };
  }

  // 按 UUID 下载当前租户的插件依赖文件正文。
  rpc PluginRequirementDownload(PluginRequirementDownloadReq)
      returns (stream PluginRequirementDownloadResp) {
    option (google.api.http) = {
      get : "/api/v3/plugin/requirement/download"
    };
  }

  // 启动插件依赖文件到目标主机的异步传输，返回任务 ID 及文件信息。
  rpc PluginRequirementTransfer(PluginRequirementTransferReq)
      returns (PluginRequirementTransferResp) {
    option (google.api.http) = {
      post : "/api/v3/plugin/requirement/transfer"
      body : "*"
    };
  }
}

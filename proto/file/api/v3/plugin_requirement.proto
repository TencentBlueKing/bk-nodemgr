syntax = "proto3";
package v3;
option go_package = "github.com/TencentBlueKing/bk-nodemgr/pkg/protocol/file/api/v3";

import "common.proto";
import "google/api/annotations.proto";

// 当前租户的插件依赖文件记录，不代表已绑定到插件或应用到进程。
message PluginRequirementFileRecord {
  // 文件记录的 UUID。
  string id = 1;
  // 原始文件名，不含目录。
  string name = 2;
  // 文件在存储中的名称。
  string saved_name = 3;
  // 文件内容的 MD5。
  string md5 = 4;
  // 文件大小，单位为字节。
  int64 size = 5;
  // 最近更新时间，Unix 时间戳，单位为秒。
  int64 updated_at = 6;
  // 最近操作人。
  string operator = 7;
  // 适用操作系统，all 表示不限制，否则为具体 OS 枚举值。
  string os = 8;
  // 适用 CPU 架构，all 表示不限制，否则为具体架构枚举值。
  string arch = 9;
  // 适用插件包版本，all 表示不限制；不是依赖文件自身的版本。
  string version = 10;
}

// 创建插件依赖文件的参数。
message PluginRequirementCreateReq {
  // 原始文件名，必须是安全的单个文件名。
  string name = 1;
  // 文件正文的 Base64 编码。
  string content_base64 = 2;
  // 适用操作系统，省略时为 all。
  string os = 3;
  // 适用 CPU 架构，省略时为 all。
  string arch = 4;
  // 适用插件包版本，省略时为 all。
  string version = 5;
}

// 创建插件依赖文件后返回的记录。
message PluginRequirementCreateResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  message Data { PluginRequirementFileRecord file = 1; }
  Data data = 4;
}

// 替换插件依赖文件名称及正文的参数。
message PluginRequirementUpdateReq {
  // 文件记录的 UUID。
  string id = 1;
  // 原始文件名，必须是安全的单个文件名。
  string name = 2;
  // 替换后的文件正文的 Base64 编码。
  string content_base64 = 3;
}

// 更新插件依赖文件后返回的记录。
message PluginRequirementUpdateResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  message Data { PluginRequirementFileRecord file = 1; }
  Data data = 4;
}

// 按 UUID 查询插件依赖文件记录的参数。
message PluginRequirementGetReq {
  // 文件记录的 UUID。
  string id = 1;
}

// 插件依赖文件记录的查询结果，不包含文件正文。
message PluginRequirementGetResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  message Data { PluginRequirementFileRecord file = 1; }
  Data data = 4;
}

// 更新适用范围，不替换正文或修改文件在文件源中的位置。
message PluginRequirementUpdateScopeReq {
  // 文件记录的 UUID。
  string id = 1;
  // 适用操作系统，必填；all 表示不限制。
  string os = 2;
  // 适用 CPU 架构，必填；all 表示不限制。
  string arch = 3;
  // 适用插件包版本，必填；all 表示不限制。
  string version = 4;
}

// 更新适用范围后的文件记录。
message PluginRequirementUpdateScopeResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  message Data { PluginRequirementFileRecord file = 1; }
  Data data = 4;
}

// 文件记录的精确筛选条件，同字段内为或，不同字段之间为且。
message PluginRequirementFileExactConditions {
  repeated string id = 1;
  repeated string name = 2;
  // 筛选保存的适用条件；all 仅匹配不限制 OS 的记录，不是查询通配符。
  repeated string os = 3;
  // 筛选保存的适用条件；all 仅匹配不限制架构的记录。
  repeated string arch = 4;
  // 筛选保存的插件包版本条件；all 仅匹配不限制版本的记录。
  repeated string version = 5;
}

// 当前租户的插件依赖文件查询条件。
message PluginRequirementFileConditions {
  PluginRequirementFileExactConditions exact_include = 1;
}

// 分页列举当前租户的插件依赖文件，不执行依赖匹配或覆盖选择。
message PluginRequirementListReq {
  Page page = 1;
  PluginRequirementFileConditions conditions = 2;
}

// 插件依赖文件的分页查询结果，不包含文件正文。
message PluginRequirementListResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  message Data {
    int64 total = 1;
    repeated PluginRequirementFileRecord items = 2;
  }
  Data data = 4;
}

// 下载插件依赖文件正文的参数。
message PluginRequirementDownloadReq {
  // 文件记录的 UUID，通过查询参数传递。
  string id = 1;
}

// 插件依赖文件的二进制内容；HTTP 下载直接返回文件正文。
message PluginRequirementDownloadResp { bytes content = 1; }

// 将插件依赖文件传输到目标主机的参数。
message PluginRequirementTransferReq {
  // 文件记录的 UUID。
  string id = 1;
  // 目标文件名，必须是安全的单个文件名。
  string target_name = 2;
  // 目标主机上的文件目录，不得为空。
  string target_dir = 3;
  // 目标主机 ID。
  int64 target_host_id = 4;
}

// 已启动的插件依赖文件传输任务，不代表传输完成。
message PluginRequirementTransferResp {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
  message Data {
    // 可用于查询传输状态的任务 ID。
    optional string task_id = 1;
    // 传输的文件名。
    optional string file_name = 2;
    // 文件内容的 MD5。
    optional string file_md5 = 3;
    // 文件大小，单位为字节。
    optional int64 file_size = 4;
  }
  Data data = 4;
}

// 管理当前租户的插件依赖文件及其传输。
service PluginRequirement {
  // 创建插件依赖文件及独立文件记录，不修改插件依赖绑定。
  rpc PluginRequirementCreate(PluginRequirementCreateReq)
      returns (PluginRequirementCreateResp) {
    option (google.api.http) = {
      post : "/api/v3/plugin/requirement/create"
      body : "*"
    };
  }

  // 替换当前租户指定依赖文件的名称及正文，保留文件记录 ID。
  rpc PluginRequirementUpdate(PluginRequirementUpdateReq)
      returns (PluginRequirementUpdateResp) {
    option (google.api.http) = {
      post : "/api/v3/plugin/requirement/update"
      body : "*"
    };
  }

  // 按 UUID 查询当前租户的插件依赖文件记录。
  rpc PluginRequirementGet(PluginRequirementGetReq)
      returns (PluginRequirementGetResp) {
    option (google.api.http) = {
      post : "/api/v3/plugin/requirement/get"
      body : "*"
    };
  }

  // 更新当前租户依赖文件的适用范围，保留文件记录 ID 和正文位置。
  rpc PluginRequirementUpdateScope(PluginRequirementUpdateScopeReq)
      returns (PluginRequirementUpdateScopeResp) {
    option (google.api.http) = {
      post : "/api/v3/plugin/requirement/update_scope"
      body : "*"
    };
  }

  // 按适用条件等元信息分页查询当前租户的依赖文件，不执行匹配优先级选择。
  rpc PluginRequirementList(PluginRequirementListReq)
      returns (PluginRequirementListResp) {
    option (google.api.http) = {
      post : "/api/v3/plugin/requirement/list"
      body : "*"
    };
  }

  // 按 UUID 下载当前租户的插件依赖文件正文。
  rpc PluginRequirementDownload(PluginRequirementDownloadReq)
      returns (stream PluginRequirementDownloadResp) {
    option (google.api.http) = {
      get : "/api/v3/plugin/requirement/download"
    };
  }

  // 启动插件依赖文件到目标主机的异步传输，返回任务 ID 及文件信息。
  rpc PluginRequirementTransfer(PluginRequirementTransferReq)
      returns (PluginRequirementTransferResp) {
    option (google.api.http) = {
      post : "/api/v3/plugin/requirement/transfer"
      body : "*"
    };
  }
}

syntax = "proto3";
package v3;
option go_package = "github.com/TencentBlueKing/bk-nodemgr/pkg/protocol/file/api/v3";

// Page describes the generaic conditions when paging query.
message Page {
  uint32 offset = 1;
  uint32 limit = 2;
}

// Platform describes the platform informations.
message Platform {
  string os_type = 1;
  string cpu_arch = 2;
}
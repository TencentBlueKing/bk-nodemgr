syntax = "proto3";
package v3;
option go_package = "github.com/TencentBlueKing/bk-nodemgr/pkg/protocol/file/api/v3";

// Page describes paging query settings.
message Page {
  int64 offset = 1;
  int64 limit = 2;
  string sort = 3;
}

// Platform describes the platform informations.
message Platform {
  string os_type = 1;
  string cpu_arch = 2;
}

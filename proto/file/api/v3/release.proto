service Release {
  // ReleaseAgent methods.

  // EnableReleaseAgent enables an agent release.
  rpc EnableReleaseAgent(ReleaseAgentEnableReq)
      returns (ReleaseAgentEnableResp) {
    option (google.api.http) = {
      post : "/api/v3/release/agent/enable"
      body : "*"
    };
  }

  // DisableReleaseAgent disables an agent release.
  rpc DisableReleaseAgent(ReleaseAgentDisableReq)
      returns (ReleaseAgentDisableResp) {
    option (google.api.http) = {
      post : "/api/v3/release/agent/disable"
      body : "*"
    };
  }

  // SetAsDefaultReleaseAgent sets an agent release as default.
  rpc SetAsDefaultReleaseAgent(ReleaseAgentSetAsDefaultReq)
      returns (ReleaseAgentSetAsDefaultResp) {
    option (google.api.http) = {
      post : "/api/v3/release/agent/set_as_default"
      body : "*"
    };
  }

  // CancelAsDefaultReleaseAgent cancels an agent release default.
  rpc CancelAsDefaultReleaseAgent(ReleaseAgentCancelAsDefaultReq)
      returns (ReleaseAgentCancelAsDefaultResp) {
    option (google.api.http) = {
      post : "/api/v3/release/agent/cancel_as_default"
      body : "*"
    };
  }

  // DeleteReleaseAgent updates release metadata.
  rpc DeleteReleaseAgent(ReleaseAgentDeleteReq)
      returns (ReleaseAgentDeleteResp) {
    option (google.api.http) = {
      post : "/api/v3/release/agent/delete"
      body : "*"
    };
  }

  // SetReleaseAgentLabelsMany updates release metadata.
  rpc SetReleaseAgentLabelsMany(ReleaseAgentSetLabelsManyReq)
      returns (ReleaseAgentSetLabelsManyResp) {
    option (google.api.http) = {
      post : "/api/v3/release/agent/set_labels_many"
      body : "*"
    };
  }

  rpc ListReleaseAgent(ReleaseAgentListReq) returns (ReleaseAgentListResp) {
    option (google.api.http) = {
      post : "/api/v3/release/agent/list"
      body : "*"
    };
  }

  rpc CountReleaseAgent(ReleaseAgentCountReq) returns (ReleaseAgentCountResp) {
    option (google.api.http) = {
      post : "/api/v3/release/agent/count"
      body : "*"
    };
  }

  rpc GetReleaseAgent(ReleaseAgentGetReq) returns (ReleaseAgentGetResp) {
    option (google.api.http) = {
      post : "/api/v3/release/agent/get"
      body : "*"
    };
  }

  rpc DistinctReleaseAgent(ReleaseAgentDistinctReq)
      returns (ReleaseAgentDistinctResp) {
    option (google.api.http) = {
      post : "/api/v3/release/agent/distinct"
      body : "*"
    };
  }

  // ReleaseProxy methods.

  // EnableReleaseProxy enables a proxy release.
  rpc EnableReleaseProxy(ReleaseProxyEnableReq)
      returns (ReleaseProxyEnableResp) {
    option (google.api.http) = {
      post : "/api/v3/release/proxy/enable"
      body : "*"
    };
  }

  // DisableReleaseProxy disables a proxy release.
  rpc DisableReleaseProxy(ReleaseProxyDisableReq)
      returns (ReleaseProxyDisableResp) {
    option (google.api.http) = {
      post : "/api/v3/release/proxy/disable"
      body : "*"
    };
  }

  // SetAsDefaultReleaseProxy sets a proxy release as default.
  rpc SetAsDefaultReleaseProxy(ReleaseProxySetAsDefaultReq)
      returns (ReleaseProxySetAsDefaultResp) {
    option (google.api.http) = {
      post : "/api/v3/release/proxy/set_as_default"
      body : "*"
    };
  }

  // CancelAsDefaultReleaseProxy cancels a proxy release default.
  rpc CancelAsDefaultReleaseProxy(ReleaseProxyCancelAsDefaultReq)
      returns (ReleaseProxyCancelAsDefaultResp) {
    option (google.api.http) = {
      post : "/api/v3/release/proxy/cancel_as_default"
      body : "*"
    };
  }

  // DeleteReleaseProxy updates release metadata.
  rpc DeleteReleaseProxy(ReleaseProxyDeleteReq)
      returns (ReleaseProxyDeleteResp) {
    option (google.api.http) = {
      post : "/api/v3/release/proxy/delete"
      body : "*"
    };
  }

  // SetReleaseProxyLabelsMany updates release metadata.
  rpc SetReleaseProxyLabelsMany(ReleaseProxySetLabelsManyReq)
      returns (ReleaseProxySetLabelsManyResp) {
    option (google.api.http) = {
      post : "/api/v3/release/proxy/set_labels_many"
      body : "*"
    };

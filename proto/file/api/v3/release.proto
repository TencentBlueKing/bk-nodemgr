syntax = "proto3";
package v3;
option go_package = "github.com/TencentBlueKing/bk-nodemgr/pkg/protocol/file/api/v3";

import "common.proto";
import "google/api/annotations.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// ReleaseExactConditions describes exact filters for release operations.
message ReleaseExactConditions {
  repeated string name = 1;
  repeated string file_name = 2;
  repeated int64 generation = 3;
  repeated Platform platform = 4;
  repeated string version = 5;
  repeated bool as_default = 6;
  repeated bool enabled = 7;
  repeated bool is_hidden = 8;
  repeated bool is_shared = 9;
  repeated bool is_synced = 10;
}

// ReleaseConditions describes one group of release operation conditions.
message ReleaseConditions { ReleaseExactConditions exact_include = 1; }

// ReleaseDistinctFields selects the release fields to query for distinct
// values.
message ReleaseDistinctFields {
  bool os_type = 1;
  bool cpu_arch = 2;
  bool name = 3;
  bool version = 4;
}

// ReleaseDistinctResult contains distinct values of the selected release
// fields.
message ReleaseDistinctResult {
  repeated string os_type = 1;
  repeated string cpu_arch = 2;
  repeated string name = 3;
  repeated string version = 4;
}

// ReleaseInfo contains common release metadata.
message ReleaseInfo {
  string name = 1;
  int64 generation = 2;
  string release_type = 3;
  Platform platform = 4;
  string version = 5;
  repeated string labels = 6;
  string file_name = 7;
  string md5 = 8;
  bool enabled = 9;
  bool is_hidden = 10;
  bool is_shared = 11;
  bool is_synced = 12;
  bool as_default = 13;
  google.protobuf.Timestamp updated_at = 14;
  string operator = 15;
  google.protobuf.Struct addition_info = 16;
}


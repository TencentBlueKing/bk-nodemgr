name: Sign Release

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag_name:
        description: Tag of the release to sign
        required: true
        type: string

permissions:
  contents: write

jobs:
  sign-source:
    name: Sign source archive
    runs-on: self-hosted
    environment: GPG
    env:
      TAG_NAME: ${{ inputs.tag_name || github.event.release.tag_name }}
    steps:
      - name: Download source archive
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -o "bk-nodemgr-${TAG_NAME}.tar.gz" \
            "https://github.com/${REPOSITORY}/archive/refs/tags/${TAG_NAME}.tar.gz"

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Sign source archive
        run: |
          set -euo pipefail
          gpg --detach-sign --armor "bk-nodemgr-${TAG_NAME}.tar.gz"

      - name: Upload signature
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: bk-nodemgr-${{ env.TAG_NAME }}.tar.gz.asc

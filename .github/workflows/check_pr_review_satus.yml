name: Check PR Review Status

on:
  pull_request_target:
    types: [opened, edited, synchronize, ready_for_review]

jobs:
  check-reviews:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Setup Node.js (for running the script)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      # Step 3: Install dependencies for the script
      - name: Install dependencies
        run: npm install @octokit/rest

      # Step 4: Check PR Review Status
      - name: Check PR Review Status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          # Create a JavaScript file to check review statuses
          echo "const { Octokit } = require('@octokit/rest');
          (async () => {
            const octokit = new Octokit({ auth: process.env.GITHUB_TOKEN });
            const owner = process.env.REPO_OWNER;
            const repo = process.env.REPO_NAME;
            const pull_number = process.env.PR_NUMBER;

            // Fetch all reviews for the PR
            const { data: reviews } = await octokit.pulls.listReviews({
              owner,
              repo,
              pull_number,
            });

            // Keep track of the latest review status for each reviewer
            const reviewStatus = {};
            reviews.forEach(review => {
              reviewStatus[review.user.login] = review.state;
            });

            // Check if all reviews are approved
            const unapprovedReviews = Object.entries(reviewStatus).filter(([user, state]) => state !== 'APPROVED');
            
            if (unapprovedReviews.length > 0) {
              console.error('Some reviews are not approved:');
              unapprovedReviews.forEach(([user, state]) => {
                console.log(`- Reviewer: ${user}, Status: ${state}`);
              });
              process.exit(1); // Fail the workflow
            } else {
              console.log('All reviews are approved. Good to go!');
            }
          })();" > check-reviews.js

          # Run the script
          node check-reviews.js

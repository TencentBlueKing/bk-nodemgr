# .github/workflows/sync.yml
name: Sync Fork

on:
  schedule:
    - cron: '*/10 * * * *' # 每10分钟触发
jobs:
  repo-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: TG908/fork-sync@v1.6.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          owner: TencentBlueKing # fork 的上游仓库 user
          head: master # fork 的上游仓库 branch
          base: master # 本地仓库 branch

name: Path-Specific Coverage Check

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  path-coverage-check:
    runs-on: self-hosted
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout base config
        uses: actions/checkout@v3

      - name: Get PR changed files
        id: changed-files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # 使用GitHub API获取PR变更文件
          : > changed_files.txt
          page=1
          while true; do
            response=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100&page=${page}")

            if ! jq -e 'type == "array"' >/dev/null <<<"${response}"; then
              echo "PR files API response is not an array" >&2
              exit 1
            fi

            count=$(jq 'length' <<<"${response}")
            jq -r '.[].filename' <<<"${response}" >> changed_files.txt
            if [ "${count}" -lt 100 ]; then
              break
            fi
            if [ "${page}" -ge 30 ]; then
              echo "PR files list exceeds the 3000-file API limit" >&2
              exit 1
            fi
            page=$((page + 1))
          done

          # 调试输出
          echo "PR编号: ${PR_NUMBER}"
          echo "变更文件列表:"
          cat changed_files.txt

      - name: Check config file exists
        id: check-config
        run: |
          if [ -f ".github/coverage-config.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::warning::Coverage config file not found at .github/coverage-config.json"
          fi

      - name: Find existing comments
        id: find-comment
        if: steps.check-config.outputs.exists == 'true'
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          COMMENTS_URL="https://api.github.com/repos/${{ github.repository }}/issues/$PR_NUMBER/comments"

          # 读取配置以获取评论标题
          CONFIG=$(cat .github/coverage-config.json)
          HEADER=$(echo "$CONFIG" | jq -r '.comment_template.header')

          # 查找包含特定标题的评论
          BOT_COMMENTS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$COMMENTS_URL" | jq -r --arg header "$HEADER" '.[] | select(.body | startswith($header)) | .id')

          if [ -n "$BOT_COMMENTS" ]; then
            echo "EXISTING_COMMENTS<<EOF" >> $GITHUB_ENV
            echo "$BOT_COMMENTS" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
            echo "HAS_EXISTING_COMMENTS=true" >> $GITHUB_ENV
          else
            echo "HAS_EXISTING_COMMENTS=false" >> $GITHUB_ENV
          fi

      - name: Path-specific coverage check
        if: steps.check-config.outputs.exists == 'true'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');

            try {
              // 读取配置文件
              const configContent = fs.readFileSync('.github/coverage-config.json', 'utf8');
              const config = JSON.parse(configContent);

              // 读取变更文件列表
              const changedFilesContent = fs.readFileSync('changed_files.txt', 'utf8');
              const changedFiles = changedFilesContent.trim().split('\n').filter(file => file.trim() !== '');

              console.log('配置加载完成, 检测到变更文件数量:', changedFiles.length);

              // 检查每个文件是否匹配目标路径
              const matchedPaths = [];

              if (changedFiles.length > 0) {
                changedFiles.forEach(file => {
                  config.paths.forEach(item => {
                    if (file.startsWith(item.path) && !matchedPaths.some(p => p.path === item.path)) {
                      console.log(`文件 ${file} 匹配路径配置 ${item.path}`);
                      matchedPaths.push(item);
                    }
                  });
                });
              }

              console.log('匹配的路径数量:', matchedPaths.length);

              // 设置环境变量表示是否有匹配路径
              core.exportVariable('HAS_MATCHED_PATHS', matchedPaths.length > 0 ? 'true' : 'false');

              if (matchedPaths.length > 0) {
                // 生成评论内容
                let commentBody = `${config.comment_template.header}\n\n`;

                // 添加表格标题
                commentBody += `| 路径 | 描述 | 最低覆盖率要求 | 重要程度 |\n`;
                commentBody += `| --- | --- | ---: | --- |\n`;

                // 添加每个路径的详细要求
                matchedPaths.forEach(item => {
                  const importanceTag = item.critical
                    ? '🔴 必须满足'
                    : '🟡 建议满足';

                  commentBody += `| \`${item.path}\` | ${item.description} | ${item.coverage}% | ${importanceTag} |\n`;
                });

                commentBody += `\n${config.comment_template.footer}`;

                // 检查是否有现有评论
                const hasExistingComments = process.env.HAS_EXISTING_COMMENTS === 'true';

                if (hasExistingComments) {
                  // 更新第一个现有评论
                  const existingComments = process.env.EXISTING_COMMENTS.trim().split('\n');
                  const firstCommentId = existingComments[0];

                  if (firstCommentId) {
                    await github.rest.issues.updateComment({
                      comment_id: parseInt(firstCommentId),
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      body: commentBody
                    });

                    console.log(`已更新现有评论 ID: ${firstCommentId}`);

                    // 删除其他多余的评论(如果有)
                    if (existingComments.length > 1) {
                      for (let i = 1; i < existingComments.length; i++) {
                        const commentId = existingComments[i];
                        if (commentId) {
                          await github.rest.issues.deleteComment({
                            comment_id: parseInt(commentId),
                            owner: context.repo.owner,
                            repo: context.repo.repo
                          });
                          console.log(`已删除多余评论 ID: ${commentId}`);
                        }
                      }
                    }
                  }
                } else {
                  // 创建新评论
                  await github.rest.issues.createComment({
                    issue_number: context.issue.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    body: commentBody
                  });
                  console.log('成功创建PR评论');
                }
              } else {
                console.log('没有匹配的路径，跳过评论创建');
              }
            } catch (error) {
              console.error('执行过程中发生错误:', error);
              core.setFailed(`执行失败: ${error.message}`);
            }
      - name: Close outdated comments
        if: env.HAS_EXISTING_COMMENTS == 'true' && env.HAS_MATCHED_PATHS == 'false'
        run: |
          # 读取配置以获取评论标题
          CONFIG=$(cat .github/coverage-config.json)
          HEADER=$(echo "$CONFIG" | jq -r '.comment_template.header')

          echo "${{ env.EXISTING_COMMENTS }}" | while read comment_id; do
            if [ -n "$comment_id" ]; then
              COMMENT_URL="https://api.github.com/repos/${{ github.repository }}/issues/comments/$comment_id"
              curl -s -X PATCH -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github.v3+json" \
                -d "{\"body\":\"~~ ${HEADER} ~~\\n\\n✅ **变更文件不再匹配覆盖率检查路径，关闭通知。**\"}" \
                "$COMMENT_URL"
            fi
          done

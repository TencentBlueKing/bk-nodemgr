name: "Issue Product Label Management"
on:
  issues:
    types: [opened, closed]

jobs:
  manage-issue:
    runs-on: self-hosted
    permissions:
      issues: write
    steps:
      # 移除 todo 标签
      - uses: actions-ecosystem/action-remove-labels@v1
        if: |
          (github.event.action == 'opened') &&
          contains(github.event.issue.title, '[FEATURE]')
        with:
          labels: product/todo

      # 新建或重开 issue 时设置负责人
      - uses: actions-ecosystem/action-add-assignees@v1
        if: |
          (github.event.action == 'opened' || github.event.action == 'reopened') &&
          (github.event.issue.assignees == null || github.event.issue.assignees[0] == null)
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          assignees: ${{ github.event.issue.user.login }}

      # 关闭 issue 时移除活跃标签
      - uses: actions-ecosystem/action-remove-labels@v1
        if: |
          github.event.action == 'closed' &&
          contains(github.event.issue.title, '[FEATURE]')
        with:
          labels: |
            product/todo
            product/doing

      # 关闭 issue 时添加 for test 标签
      - uses: actions-ecosystem/action-add-labels@v1
        if: |
          github.event.action == 'closed' &&
          contains(github.event.issue.title, '[FEATURE]')
        with:
          labels: product/for test

      # 等待 1 分钟（在移除 for test 标签前）
      - name: "Wait 1 minute before removing for test label"
        if: |
          github.event.action == 'closed' &&
          contains(github.event.issue.title, '[FEATURE]')
        run: sleep 10

      # 关闭 issue 时移除 for test 标签
      - uses: actions-ecosystem/action-remove-labels@v1
        if: |
          github.event.action == 'closed' &&
          contains(github.event.issue.title, '[FEATURE]')
        with:
          labels: product/for test

      # 关闭 issue 时添加 done 标签
      - uses: actions-ecosystem/action-add-labels@v1
        if: |
          github.event.action == 'closed' &&
          contains(github.event.issue.title, '[FEATURE]')
        with:
          labels: product/done
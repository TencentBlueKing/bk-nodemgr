name: PR Title Lint

on:
  pull_request_target:
    # 触发事件类型
    types: [ opened, edited, reopened, synchronize ]
    branches:
      - 'master'

permissions:
  contents: write
  pull-requests: write
  discussions: write

jobs:
  check-pr-title:
    runs-on: self-hosted
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: morrisoncole/pr-lint-action@v1.7.1
        with:
          # 正则表达式解析:
          # ^                             - 从开头匹配
          # (feat|fix|chore|docs|...)     - 标准git标签
          # :\s                           - 冒号+空格
          # [a-zA-Z0-9\s,.\-\_]+            - 中间内容支持字母、数字、空格、逗号、点号、中划线、下划线
          # (--issue=#\d+(\s?,\s?#\d+)*)  - 支持一个或多个 issue 的格式 (--issue=#数字, #数字)
          # $                             - 匹配结尾
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          title-regex: "^(feat|fix|chore|docs|style|refactor|perf|test|build|ci|revert):\\s[a-zA-Z0-9\\s,\\.\\-\\_]+\\s--issue=#\\d+(\\s?,\\s?#\\d+)*\\s*$"
          on-failed-regex-fail-action: true
          on-failed-regex-create-review: true
          on-failed-regex-request-changes: true
          on-failed-regex-comment: |
            PR 标题不符合规范,请按以下格式修改:
            1. 以 feat/fix/chore 等标准 git 标签开头
            2. 标签后跟冒号和空格
            3. 描述文字可以包含大小写字母、数字、基本标点符号(逗号、点号、中划线、下划线)
            4. 结尾必须包含 --issue=#数字，支持多个 issue，用逗号分隔
            
            正确示例: 
            - fix: fix some varname error --issue=#4
            - feat: add a new feature, fix some bugs --issue=#3, #7
          on-succeeded-regex-dismiss-review-comment: "PR 标题规范检查通过! ✅"
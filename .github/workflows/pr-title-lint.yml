name: PR Title Lint

on:
  pull_request_target:
    # 触发事件类型
    types: [ opened, edited, reopened, synchronize ]
    branches:
      - 'master'

permissions:
  pull-requests: write

jobs:
  check-pr-title:
    runs-on: self-hosted
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: morrisoncole/pr-lint-action@v1.7.1
        with:
          # 正则表达式解析:
          # ^                                    - 从开头匹配
          # (feat|fix|chore|docs|...)            - 标准 type 类型
          # :\s                                  - 冒号+空格
          # [a-zA-Z0-9\s,.\-_()]+                - 英文描述（字母、数字、空格、标点）
          # \s--issue=#\d+(,\s?#\d+)*           - --issue=#数字，支持多个 issue
          # $                                    - 匹配结尾
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          title-regex: "^(feat|fix|docs|style|refactor|perf|test|chore):\\s[a-zA-Z0-9\\s,\\.\\-_()]+\\s--issue=#\\d+(,\\s?#\\d+)*\\s*$"
          on-failed-regex-fail-action: true
          on-failed-regex-create-review: true
          on-failed-regex-request-changes: true
          on-failed-regex-comment: |
            ## ❌ PR 标题不符合规范

            请按照以下格式修改（注意：描述内容必须使用英文）：

            **格式：** `<type>: <subject> --issue=#数字`

            ### 📋 Type 类型说明
            - `feat`: 新功能 (A new feature)
            - `fix`: Bug 修复 (A bug fix)
            - `docs`: 文档变更 (Documentation only changes)
            - `style`: 代码格式调整 (Formatting, missing semi-colons, etc)
            - `refactor`: 重构 (A code change that neither fixes a bug nor adds a feature)
            - `perf`: 性能优化 (A code change that improves performance)
            - `test`: 测试相关 (Adding missing or correcting existing tests)
            - `chore`: 构建/工具变更 (Changes to the build process or auxiliary tools)

            ### ✅ 正确示例
            ```
            feat: add user authentication module --issue=#6510
            fix: resolve login timeout issue --issue=#1234
            docs: update API documentation --issue=#5678
            refactor: unify storage WrapFn closure pattern --issue=#9012
            perf: optimize database query performance --issue=#3456
            fix: fix multiple bugs --issue=#100, #101, #102
            ```

            ### ❌ 错误示例
            ```
            Add new feature                         # 缺少 type
            feat add feature --issue=#123           # 缺少冒号
            feat:add feature --issue=#123           # 冒号后缺少空格
            feat: add feature                       # 缺少 --issue=#数字
            FEAT: add feature --issue=#123          # type 必须小写
            feat: 添加新功能 --issue=#123            # 描述必须使用英文
            feat: add feature #123                  # issue 格式错误（应为 --issue=#123）
            ```

            参考：https://github.com/Tencent/bk-ci/issues
          on-succeeded-regex-dismiss-review-comment: "✅ PR 标题规范检查通过！"

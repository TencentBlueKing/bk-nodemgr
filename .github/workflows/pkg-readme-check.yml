name: Package README Check

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'pkg/**'

jobs:
  check-pkg-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # 完整克隆，确保能访问所有提交历史

      - name: Fetch all history and tags
        run: |
          git fetch --prune --unshallow || true
          git fetch origin +refs/heads/*:refs/remotes/origin/*

      - name: Check for packages without README
        id: check-readmes
        run: |
          echo "检查PR: ${{ github.event.pull_request.number }}"
          
          # 检查所有已变更的文件
          git_files=$(git diff --name-only origin/${{ github.base_ref }} HEAD || git diff --name-only HEAD~1 HEAD)
          echo "变更文件列表: $git_files"
          
          # 提取pkg目录
          pkg_dirs=$(echo "$git_files" | grep "^pkg/" | awk -F/ '{print $1"/"$2}' | sort | uniq || echo "")
          echo "发现pkg目录: $pkg_dirs"
          
          MISSING_README=""
          
          # 检查每个pkg目录是否有README.md
          for dir in $pkg_dirs; do
            if [ -d "$dir" ] && [ ! -f "$dir/README.md" ]; then
              # 确认是包含.go文件的目录
              if ls $dir/*.go 1> /dev/null 2>&1; then
                MISSING_README="$MISSING_README $dir"
              fi
            fi
          done
          
          # 设置环境变量
          MISSING_README=$(echo $MISSING_README | xargs)
          echo "缺少README的目录: $MISSING_README"
          
          if [ -n "$MISSING_README" ]; then
            echo "HAS_MISSING=true" >> $GITHUB_ENV
            echo "MISSING_DIRS=$MISSING_README" >> $GITHUB_ENV
            echo "has_missing=true" >> $GITHUB_OUTPUT
          else
            echo "HAS_MISSING=false" >> $GITHUB_ENV
            echo "has_missing=false" >> $GITHUB_OUTPUT
          fi

      - name: Debug info
        run: |
          echo "HAS_MISSING: ${{ env.HAS_MISSING }}"
          echo "MISSING_DIRS: ${{ env.MISSING_DIRS }}"

      - name: Comment on PR
        if: env.HAS_MISSING == 'true'
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## 📝 包文档缺失提醒
            
            ### 检测到以下包缺少README.md文件：
            
            ${{ join(split(env.MISSING_DIRS, ' '), '\n- `') }}
            
            ### 📋 操作指南
            
            1. 请参考模板文件 `docs/design/pkg_readme_template.md` 创建README.md
            2. 文档应包含：
               - 包的功能概述
               - 设计原理
               - 使用示例
               - 接口说明
            3. 完成后将README.md添加到相应的包目录中
            
            > 💡 **为什么需要README？**
            > 良好的文档能够提高代码可维护性和促进团队协作。
          token: ${{ secrets.GITHUB_TOKEN }}
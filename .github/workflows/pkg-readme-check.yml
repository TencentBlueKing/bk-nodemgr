name: Package AGENTS Check

on:
  pull_request_target:
    types: [ opened, synchronize, reopened ]

jobs:
  check-pkg-agents:
    runs-on: self-hosted
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout base config
        uses: actions/checkout@v3

      - name: Get PR changed files
        id: changed-files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          : > changed_files.txt
          page=1
          while true; do
            response=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100&page=${page}")

            if ! jq -e 'type == "array"' >/dev/null <<<"${response}"; then
              echo "PR files API response is not an array" >&2
              exit 1
            fi

            count=$(jq 'length' <<<"${response}")
            jq -r '.[].filename' <<<"${response}" >> changed_files.txt
            if [ "${count}" -lt 100 ]; then
              break
            fi
            if [ "${page}" -ge 30 ]; then
              echo "PR files list exceeds the 3000-file API limit" >&2
              exit 1
            fi
            page=$((page + 1))
          done

          # 调试输出
          echo "PR编号: ${PR_NUMBER}"
          echo "变更文件列表:"
          cat changed_files.txt

      - name: Check for missing AGENTS
        id: check-agents
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # 检查pkg目录下的变更
          PKG_FILES=$(grep "^pkg/" changed_files.txt || echo "")
          if [ -z "$PKG_FILES" ]; then
            echo "没有pkg目录的变更"
            echo "HAS_MISSING=false" >> $GITHUB_ENV
            exit 0
          fi

          echo "pkg目录下的变更文件:"
          echo "$PKG_FILES"

          # 创建临时文件存储结果
          touch missing_agents_dirs.txt
          mkdir -p contents-cache

          api_encode_path() {
            jq -nr --arg value "$1" '$value | split("/") | map(@uri) | join("/")'
          }

          api_encode_value() {
            jq -nr --arg value "$1" '$value | @uri'
          }

          check_pkg_dir() {
            local dir="$1"
            local cache_key cache_file status_file encoded_dir encoded_ref status

            cache_key=$(printf '%s' "$dir" | sha256sum | awk '{print $1}')
            cache_file="contents-cache/${cache_key}.json"
            status_file="contents-cache/${cache_key}.status"

            if [ ! -f "$cache_file" ]; then
              encoded_dir=$(api_encode_path "$dir")
              encoded_ref=$(api_encode_value "$HEAD_SHA")
              status=$(curl --silent --show-error \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -o "$cache_file" \
                -w "%{http_code}" \
                "https://api.github.com/repos/${REPOSITORY}/contents/${encoded_dir}?ref=${encoded_ref}")
              echo "$status" > "$status_file"
            fi

            status=$(cat "$status_file")
            if [ "$status" = "404" ]; then
              echo "✗ $dir 在 PR head 中不存在"
              return 0
            fi
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "查询 $dir 内容失败，HTTP 状态码: $status" >&2
              cat "$cache_file" >&2
              return 1
            fi
            if ! jq -e 'type == "array"' >/dev/null < "$cache_file"; then
              echo "$dir 的 Contents API 响应不是目录数组" >&2
              cat "$cache_file" >&2
              return 1
            fi
            if [ "$(jq 'length' "$cache_file")" -ge 1000 ]; then
              echo "$dir 目录条目达到 Contents API 1000 项限制，无法安全判断" >&2
              return 1
            fi

            if jq -e 'any(.[]; .type == "file" and .name == "AGENTS.md")' >/dev/null < "$cache_file"; then
              echo "✅ 在 $dir 目录找到AGENTS.md"
              return 0
            fi

            echo "❌ $dir 目录缺少AGENTS.md"
            if jq -e 'any(.[]; .type == "file" and (.name | endswith(".go")))' >/dev/null < "$cache_file"; then
              echo "✓ $dir 是Go包目录"
              if ! grep -q "^$dir$" missing_agents_dirs.txt; then
                echo "$dir" >> missing_agents_dirs.txt
                echo "已添加 $dir 到缺失AGENTS列表"
              fi
            else
              echo "✗ $dir 不是Go包目录"
            fi
          }

          # 提取Go包目录并检查 AGENTS
          (grep "\.go$" changed_files.txt | grep "^pkg/" || true) | while read -r file; do
            # 获取文件目录
            dir=$(dirname "$file")
            echo "检查Go文件: $file"
            echo "所在目录: $dir"

            check_pkg_dir "$dir"
          done

          # 读取结果
          MISSING_DIRS=$(cat missing_agents_dirs.txt | sort | uniq || echo "")
          echo "缺少AGENTS的目录:"
          echo "$MISSING_DIRS"

          # 设置环境变量
          if [ -n "$MISSING_DIRS" ]; then
            echo "HAS_MISSING=true" >> $GITHUB_ENV
            echo "MISSING_DIRS<<EOF" >> $GITHUB_ENV
            echo "$MISSING_DIRS" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "HAS_MISSING=false" >> $GITHUB_ENV
          fi

      - name: Find existing comments
        id: find-comment
        if: always()
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          COMMENTS_URL="https://api.github.com/repos/${{ github.repository }}/issues/$PR_NUMBER/comments"

          # 使用更明确的搜索条件，包含完整的标题
          BOT_COMMENTS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$COMMENTS_URL" | jq -r '.[] | select(.body | startswith("## 📝 包规范文件缺失提醒")) | .id')

          echo "找到的评论 ID:"
          echo "$BOT_COMMENTS"

          if [ -n "$BOT_COMMENTS" ]; then
            # 获取第一个评论ID
            FIRST_COMMENT_ID=$(echo "$BOT_COMMENTS" | head -n 1)
            echo "COMMENT_ID=$FIRST_COMMENT_ID" >> $GITHUB_ENV
            echo "HAS_COMMENT=true" >> $GITHUB_ENV
          else
            echo "HAS_COMMENT=false" >> $GITHUB_ENV
          fi

      - name: Generate comment
        id: generate-comment
        run: |
          # 只在存在缺失时生成评论内容
          if [ "${{ env.HAS_MISSING }}" == "true" ]; then
            # 创建缺失目录的评论
            COMMENT="## 📝 包规范文件缺失提醒\n\n"
            COMMENT="${COMMENT}### 检测到以下Go包缺少AGENTS.md文件：\n\n"

            # 添加缺失目录列表
            while IFS= read -r dir; do
              if [ -n "$dir" ]; then
                COMMENT="${COMMENT}- \`$dir\`\n"
              fi
            done <<< "${{ env.MISSING_DIRS }}"

            # 添加操作指南
            COMMENT="${COMMENT}\n### 📋 操作指南\n\n"
            COMMENT="${COMMENT}1. 请在对应包目录创建 \`AGENTS.md\`，说明职责边界与维护约定\n"
            COMMENT="${COMMENT}2. 文档应包含：\n"
            COMMENT="${COMMENT}   - OVERVIEW（功能与边界）\n"
            COMMENT="${COMMENT}   - WHERE TO LOOK（关键文件位置）\n"
            COMMENT="${COMMENT}   - CONVENTIONS（实现约束）\n"
            COMMENT="${COMMENT}   - ANTI-PATTERNS（禁止做法）\n"
            COMMENT="${COMMENT}3. 完成后将 \`AGENTS.md\` 添加到相应包目录\n\n"
            COMMENT="${COMMENT}> 💡 **为什么需要 AGENTS？**\n"
            COMMENT="${COMMENT}> 统一的维护约定可以降低协作成本并减少回归风险。"

            # 设置标志表示需要发评论
            echo "SHOULD_COMMENT=true" >> $GITHUB_ENV

            # 将评论内容保存到环境变量
            echo "COMMENT<<EOF" >> $GITHUB_ENV
            echo -e "$COMMENT" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            # 如果没有缺失，设置标志表示不需要发评论
            echo "SHOULD_COMMENT=false" >> $GITHUB_ENV
          fi

      - name: Delete existing AGENTS check comments
        if: env.HAS_COMMENT == 'true'
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          COMMENTS_URL="https://api.github.com/repos/${{ github.repository }}/issues/$PR_NUMBER/comments"

          # 获取所有相关评论
          BOT_COMMENTS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$COMMENTS_URL" | jq -r '.[] | select(.body | startswith("## 📝 包规范文件缺失提醒")) | .id')

          # 删除所有相关评论
          echo "$BOT_COMMENTS" | while read comment_id; do
            if [ -n "$comment_id" ]; then
              COMMENT_URL="https://api.github.com/repos/${{ github.repository }}/issues/comments/$comment_id"
              curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$COMMENT_URL"
              echo "删除了评论 ID: $comment_id"
            fi
          done

      - name: Comment on PR
        if: env.SHOULD_COMMENT == 'true'
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ env.COMMENT }}
          token: ${{ secrets.GITHUB_TOKEN }}

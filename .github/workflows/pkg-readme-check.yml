name: Package README Check

on:
  pull_request_target:
    types: [ opened, synchronize, reopened ]

jobs:
  check-pkg-readme:
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout PR
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Get PR changed files
        id: changed-files
        run: |
          # 获取PR编号和变更文件
          PR_NUMBER=${{ github.event.pull_request.number }}
          FILES_URL="https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER/files?per_page=100"
          CHANGED_FILES=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$FILES_URL" | jq -r '.[].filename')
          echo "$CHANGED_FILES" > changed_files.txt
          
          # 调试输出
          echo "PR编号: $PR_NUMBER"
          echo "变更文件列表:"
          cat changed_files.txt

      - name: Check for missing README
        id: check-readme
        run: |
          # 检查pkg目录下的变更
          PKG_FILES=$(grep "^pkg/" changed_files.txt || echo "")
          if [ -z "$PKG_FILES" ]; then
            echo "没有pkg目录的变更"
            echo "HAS_MISSING=false" >> $GITHUB_ENV
            exit 0
          fi
          
          echo "pkg目录下的变更文件:"
          echo "$PKG_FILES"
          
          # 创建临时文件存储结果
          touch missing_readme_dirs.txt
          
          # 提取Go包目录并检查README
          grep "\.go$" changed_files.txt | grep "^pkg/" | while read -r file; do
            # 获取文件目录
            dir=$(dirname "$file")
            echo "检查Go文件: $file"
            echo "所在目录: $dir"
          
            # 检查当前目录是否有README
            if [ -f "$dir/README.md" ]; then
              echo "✅ 在 $dir 目录找到README.md"
            else
              echo "❌ $dir 目录缺少README.md"
          
              # 确认是Go包目录
              if [ -n "$(find "$dir" -maxdepth 1 -name "*.go" 2>/dev/null)" ]; then
                echo "✓ $dir 是Go包目录"
                # 检查是否已添加
                if ! grep -q "^$dir$" missing_readme_dirs.txt; then
                  echo "$dir" >> missing_readme_dirs.txt
                  echo "已添加 $dir 到缺失README列表"
                fi
              else
                echo "✗ $dir 不是Go包目录"
              fi
            fi
          done
          
          # 读取结果
          MISSING_DIRS=$(cat missing_readme_dirs.txt | sort | uniq || echo "")
          echo "缺少README的目录:"
          echo "$MISSING_DIRS"
          
          # 设置环境变量
          if [ -n "$MISSING_DIRS" ]; then
            echo "HAS_MISSING=true" >> $GITHUB_ENV
            echo "MISSING_DIRS<<EOF" >> $GITHUB_ENV
            echo "$MISSING_DIRS" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "HAS_MISSING=false" >> $GITHUB_ENV
          fi

      - name: Find existing comments
        id: find-comment
        if: always()
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          COMMENTS_URL="https://api.github.com/repos/${{ github.repository }}/issues/$PR_NUMBER/comments"
          BOT_COMMENTS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$COMMENTS_URL" | jq -r '.[] | select(.body | contains("📝 包文档缺失提醒")) | .id')
          
          if [ -n "$BOT_COMMENTS" ]; then
            echo "EXISTING_COMMENTS<<EOF" >> $GITHUB_ENV
            echo "$BOT_COMMENTS" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
            echo "HAS_EXISTING_COMMENTS=true" >> $GITHUB_ENV
          else
            echo "HAS_EXISTING_COMMENTS=false" >> $GITHUB_ENV
          fi

      - name: Generate comment
        if: env.HAS_MISSING == 'true'
        run: |
          # 生成评论标题和说明
          echo "COMMENT<<EOF" >> $GITHUB_ENV
          echo "## 📝 包文档缺失提醒" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "### 检测到以下Go包缺少README.md文件：" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          
          # 生成缺失目录列表
          echo "${{ env.MISSING_DIRS }}" | while read dir; do
            if [ -n "$dir" ]; then
              echo "- \`$dir\`" >> $GITHUB_ENV
            fi
          done
          
          # 添加操作指南
          echo "" >> $GITHUB_ENV
          echo "### 📋 操作指南" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "1. 请参考模板文件 \`docs/design/pkg_readme_template.md\` 创建README.md" >> $GITHUB_ENV
          echo "2. 文档应包含：" >> $GITHUB_ENV
          echo "   - 包的功能概述" >> $GITHUB_ENV
          echo "   - 设计原理" >> $GITHUB_ENV
          echo "   - 使用示例" >> $GITHUB_ENV
          echo "   - 接口说明" >> $GITHUB_ENV
          echo "3. 完成后将README.md添加到相应的包目录中" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "> 💡 **为什么需要README？**" >> $GITHUB_ENV
          echo "> 良好的文档能够提高代码可维护性和促进团队协作。" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Close outdated comments
        if: env.HAS_EXISTING_COMMENTS == 'true' && env.HAS_MISSING == 'false'
        run: |
          echo "${{ env.EXISTING_COMMENTS }}" | while read comment_id; do
            if [ -n "$comment_id" ]; then
              COMMENT_URL="https://api.github.com/repos/${{ github.repository }}/issues/comments/$comment_id"
              curl -s -X PATCH -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github.v3+json" \
                -d '{"body":"~~ 📝 包文档缺失提醒 ~~\n\n✅ **所有包文档问题已解决，感谢您的贡献！**"}' \
                "$COMMENT_URL"
            fi
          done

      - name: Comment on PR
        if: env.HAS_MISSING == 'true'
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ env.COMMENT }}
          token: ${{ secrets.GITHUB_TOKEN }}
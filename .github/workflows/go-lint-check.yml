name: Go Lint Check

on:
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'

permissions:
  contents: read

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: self-hosted
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
      - name: Check out PR source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch for comparison
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # 获取目标分支 (通常是 main/master)
          git fetch origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          # 打印诊断信息
          echo "PR head: $(git rev-parse HEAD)"
          echo "Base branch: $(git rev-parse "origin/${BASE_REF}")"
          echo "Merge base: $(git merge-base "origin/${BASE_REF}" HEAD)"

      - name: Run golangci-lint with config
        id: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.4.0
          args: >
            --config=${{ github.workspace }}/.golangci.yml
            --timeout=5m
            --new-from-rev=origin/${{ github.base_ref }}

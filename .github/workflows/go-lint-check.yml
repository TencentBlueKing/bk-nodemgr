name: Go Lint Check

on:
  pull_request_target:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: self-hosted
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.10'
      - name: Check out PR source code
        uses: actions/checkout@v4
        with:
          # 显式检出 PR 的源分支
          ref: ${{ github.event.pull_request.head.sha }}
          # 拉取完整历史以便比较
          fetch-depth: 0
          # 对于分叉的PR可能需要此参数
          # repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Fetch base branch for comparison
        run: |
          # 获取目标分支 (通常是 main/master)
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }}
          # 打印诊断信息
          echo "PR head: $(git rev-parse HEAD)"
          echo "Base branch: $(git rev-parse ${{ github.base_ref }})"
          echo "Merge base: $(git merge-base ${{ github.base_ref }} HEAD)"

      - name: Run golangci-lint with config
        id: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64
          args: >
            --config=${{ github.workspace }}/.golangci.yml
            --timeout=5m
            --new-from-rev=origin/${{ github.base_ref }}
        continue-on-error: true

      - name: Create PR review on failure
        if: steps.golangci-lint.outcome != 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.issue.number;
            
            await github.rest.pulls.createReview({
              owner,
              repo,
              pull_number,
              body: '### ❌ Lint 检查失败\n\nGolangCI-Lint 发现了一些问题，请修复这些 lint 警告后再次提交。\n\n详情请查看 [Lint 检查日志](https://github.com/'+owner+'/'+repo+'/actions/runs/'+context.runId+')',
              event: 'REQUEST_CHANGES'
            });
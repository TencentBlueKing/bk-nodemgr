name: 功能请求 / Feature Request
description: 提出新功能或改进建议 / Suggest a new feature or enhancement
title: "[FEATURE]: "
labels: ["kind/features"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提出功能建议！
        Thanks for suggesting a feature!

        提交前请先搜索现有 issues，避免重复。
        Please search existing issues before submitting to avoid duplicates.

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查 / Pre-submission Checklist
      options:
        - label: 我已搜索现有 issues，此功能尚未被提出 / I have searched existing issues and this feature has not been requested
          required: true
        - label: 我已阅读 [文档 / Documentation](https://github.com/TencentBlueKing/bk-nodemgr/blob/master/README.md)
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 问题描述 / Problem Statement
      description: 你的功能请求是否与某个问题相关？请描述。/ Is your feature request related to a problem? Please describe.
      placeholder: 当 [...] 时我总是很困扰 / I'm always frustrated when [...]
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望方案 / Proposed Solution
      description: 描述你希望的解决方案 / Describe the solution you'd like
      placeholder: 清晰简洁地描述你希望实现的效果 / A clear and concise description of what you want to happen
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives Considered
      description: 描述你考虑过的其他替代方案 / Describe any alternative solutions you've considered
      placeholder: 列出其他替代思路... / List any alternative approaches...

  - type: dropdown
    id: category
    attributes:
      label: 功能分类 / Feature Category
      description: 该功能属于哪个方向？/ What area does this feature relate to?
      options:
        - 节点管理 / Node Management
        - 节点拓扑 / Topology
        - 插件管理 / Plugin Management
        - 插件包管理 / Plugin Package
        - 进程管理 / Process Management
        - 策略管理 / Policy Management
        - 部署策略 / Deploy Policy
        - 文件分发与传输 / File Transfer
        - 节点代理 / Node Proxy & Relay
        - 任务调度与同步 / Schedule & Sync
        - 通知管理 / Notice
        - 后端能力提升 / Backend Capability Enhancement
        - 安装部署 / Installation & Deployment
        - 前端 UI / Frontend UI
        - 文档 / Documentation
        - 其他 / Other
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: 使用场景 / Use Case
      description: 此功能会如何被使用？提供一些场景示例 / How would this feature be used? Provide some examples.
      placeholder: 例如：当管理大量节点时，需要... / e.g. When managing a large number of nodes, it's needed to...

  - type: textarea
    id: additional
    attributes:
      label: 附加信息 / Additional Context
      description: 补充其他上下文、原型图或截图 / Add any other context, mockups, or screenshots

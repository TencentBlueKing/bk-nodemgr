// OperationInstance describes the operation instance informations. One
// operation may contains multi instances.
message OperationInstance {
  string instance_id = 1;
  uint64 create_at = 2;
  uint64 started_at = 3;
  uint64 ended_at = 4;
  uint64 stopped_at = 5;

  message Message {
    uint64 timestamp = 1;
    string text = 2;
  }

  message Action {
    uint64 create_at = 1;
    uint64 started_at = 2;
    uint64 ended_at = 3;
    uint64 stopped_at = 4;
    string status = 5;
    repeated Message message = 6;
  }
  repeated Action action = 6;
}

// OperationBrief describes the operation informations in brief.
message OperationBrief {
  string operation_id = 1;
  uint64 create_at = 2;
  uint64 started_at = 3;
  uint64 ended_at = 4;
  uint64 stopped_at = 5;
  int32 bk_host_id = 6;
  int32 bk_host_innerip = 7;
  int32 instance_count = 8;
}

// OperationDetail describes the operation informations in detail.
message OperationDetail {
  string operation_id = 1;
  uint64 create_at = 2;
  uint64 started_at = 3;
  uint64 ended_at = 4;
  uint64 stopped_at = 5;
  int32 bk_host_id = 6;
  int32 bk_host_innerip = 7;
  int32 instance_count = 8;
  repeated OperationInstance instances = 9;
}

// WorkflowBrief describes the workflow informations in brief.
message WorkflowBrief {
  string workflow_id = 1;
  string status = 2;
  string operator = 3;
  int32 type = 4;
  uint64 create_at = 5;
  uint64 started_at = 6;
  uint64 ended_at = 7;
  uint64 stopped_at = 8;
  int32 operation_count = 9;
}

// WorkflowDetail describes the workflow informations in detail.
message WorkflowDetail {
  string workflow_id = 1;
  string status = 2;
  string operator = 3;
  int32 type = 4;
  uint64 create_at = 5;
  uint64 started_at = 6;
  uint64 ended_at = 7;
  uint64 stopped_at = 8;
  int32 operation_count = 9;
  repeated OperationBrief operations = 10;
}

// WorkflowListReq describes the HTTP request body when list workflows in
// workflow service.
message WorkflowListReq {
  Page page = 1;

  message Conditions {}

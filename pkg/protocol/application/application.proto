    repeated int32 bk_biz_id = 6;
    repeated string bk_biz_name = 7;
    repeated int32 bk_set_id = 8;
    repeated string bk_set_name = 9;
    repeated int32 bk_module_id = 10;
    repeated string bk_module_name = 11;
    repeated int32 bk_network_area_id = 12;
    repeated string bk_network_area_name = 13;
    repeated int32 bk_network_unit_id = 14;
    repeated string bk_network_unit_name = 15;
    repeated int32 bk_operate_dept_id = 16;
    repeated string bk_operate_dept_name = 17;
    repeated string bk_host_innerip = 18;
    repeated string bk_host_innerip_v6 = 19;
    repeated string bk_host_outerip = 20;
    repeated string bk_host_outerip_v6 = 21;
    repeated string login_ip = 22;
    repeated uint32 login_port = 23;
    repeated int32 bk_os_type = 24;
  }
  Conditions conditions = 2;
}

// WorkflowHostParameter describes the host action parameters in workflows
// service. Such as installing, upgrading.
message WorkflowHostParameter {
  int32 bk_host_id = 1;

  message Topo {
    int32 bk_biz_id = 1;
    int32 bk_network_area_id = 2;
    int32 bk_network_unit_id = 3;
  }
  Topo topo = 2;

  message Attributes {
    string bk_host_innerip = 1;
    string bk_host_innerip_v6 = 2;
    string bk_host_outerip = 3;
    string bk_host_outerip_v6 = 4;
    string login_ip = 5;
    uint32 login_port = 6;
    string login_password = 7;
  }
  Attributes attributes = 3;

  message Config { string version = 1; }
  Config config = 4;
}


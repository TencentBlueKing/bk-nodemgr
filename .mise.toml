[tools]
# project depand binary
go = ["1.26.10", "1.20.14"]
node = "24.18.0"
pnpm = "9.8.0"
upx = { version = "5.1.0", os = ["linux", "windows"] }
helm = "3.21.3"
protoc = "29.3"
clang-format = "latest"

# golang tools
"go:golang.org/x/tools/gopls" = "latest"
"go:github.com/go-delve/delve/cmd/dlv" = "v1.26.3"
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "v2.9.0"
"go:github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-openapiv2" = "v2.27.2"
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "v1.36.5"

# nodejs tools
"npm:@colbymchenry/codegraph" = "latest"
"npm:@vtsls/language-server" = "latest"
"npm:@vue/language-server" = "latest"
"npm:yaml-language-server" = "latest"
"npm:bash-language-server" = "latest"
"npm:pyright" = "latest"

[tasks.install-skills]
description = "Install business skills from the upstream master branch"
tools = { "npm:skills" = "latest" }
raw = true
raw_args = true
run = "skills add https://github.com/TencentBlueKing/bk-nodemgr/tree/master/skills"

[tasks.setup-go-sdk]
description = "Reuse mise Go installations as ~/sdk SDKs so the Makefile Go launchers skip downloads"
run = '''
set -eu

# link_sdk creates $HOME/sdk/go<version> for a mise-installed Go version.
# An existing link to the same target is kept; anything else is left untouched.
link_sdk() {
    sdk="$1"
    target="$2"
    if [ -L "$sdk" ] && [ "$(readlink "$sdk")" = "$target" ]; then
        return 0
    fi
    if [ -e "$sdk" ] || [ -L "$sdk" ]; then
        printf 'Refusing to overwrite existing SDK: %s\n' "$sdk" >&2
        exit 1
    fi
    ln -s "$target" "$sdk"
    printf '%s -> %s\n' "$sdk" "$target"
}

# mark_sdk_downloaded writes the golang.org/dl sentinel so that
# `go<version> download` in the Makefiles treats the SDK as already installed.
mark_sdk_downloaded() {
    marker="$1/.unpacked-success"
    if [ -e "$marker" ]; then
        return 0
    fi
    : > "$marker"
    printf 'marked %s as already downloaded\n' "$1"
}

mise install go@1.26.10 go@1.20.14
mkdir -p "$HOME/sdk"
for version in 1.26.10 1.20.14; do
    sdk="$HOME/sdk/go$version"
    link_sdk "$sdk" "$(mise where "go@$version")"
    mark_sdk_downloaded "$sdk"
done
'''

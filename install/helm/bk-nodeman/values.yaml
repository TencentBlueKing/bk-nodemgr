## @section Global parameters
## Global Docker image parameters
## Please, note that this will override the image parameters, including dependencies, configured to use the global value
## Current available global Docker image parameters: imageRegistry, imagePullSecrets and storageClass

## @param global.imageRegistry Global Docker image registry
## @param global.imagePullSecrets Global Docker registry secret names as an array ## @param global.storageClass Global StorageClass for Persistent Volume(s)
##
global:
  imageRegistry: ""
  ## E.g.
  ## imagePullSecrets:
  ##   - myRegistryKeySecretName
  ##
  imagePullSecrets: []
  storageClass: ""

## @section Common parameters

## @param kubeVersion Override Kubernetes version
##
kubeVersion: ""
## @param nameOverride String to partially override common.names.fullname
##
nameOverride: ""
## @param fullnameOverride String to fully override common.names.fullname
##
fullnameOverride: ""
## @param commonLabels Labels to add to all deployed objects
##
commonLabels: {}
## @param commonAnnotations Annotations to add to all deployed objects
##
commonAnnotations: {}
## @param extraDeploy Array of extra objects to deploy with the release
##
extraDeploy: []

image:
  registry: "hub.bktencent.com"
  repository: blueking/bk-nodeman
  tag: v0.1.0
  ## Specify a imagePullPolicy
  ## Defaults to 'Always' if image tag is 'latest', else set to 'IfNotPresent'
  ## ref: http://kubernetes.io/docs/user-guide/images/#pre-pulling-images
  ##
  pullPolicy: IfNotPresent
  ## Optionally specify an array of imagePullSecrets.
  ## Secrets must be manually created in the namespace.
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  ## e.g:
  ## pullSecrets:
  ##   - myRegistryKeySecretName
  ##
  pullSecrets: []

## @param extraEnvVars Array with extra environment variables to add to the bk-nodeman container
## e.g:
## extraEnvVars:
##   - name: FOO
##     value: "bar"
##
extraEnvVars: []

## @param extraEnvVarsCM Name of existing ConfigMap containing extra env vars
##
extraEnvVarsCM: ""
## @param extraEnvVarsSecret Name of existing Secret containing extra env vars
##
extraEnvVarsSecret: ""

## @section bk-nodeman deployment parameters

## @param replicaCount Number of bk-nodeman replicas to deploy
## NOTE: ReadWriteMany PVC(s) are required if replicaCount > 1
##
replicaCount: 1
## @param updateStrategy.type bk-nodeman deployment strategy type
## @param updateStrategy.rollingUpdate bk-nodeman deployment rolling update configuration parameters
## ref: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
## NOTE: Set it to `Recreate` if you use a PV that cannot be mounted on multiple pods
## e.g:
## updateStrategy:
##  type: RollingUpdate
##  rollingUpdate:
##    maxSurge: 25%
##    maxUnavailable: 25%
##
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 1
## @param schedulerName Alternate scheduler
## ref: https://kubernetes.io/docs/tasks/administer-cluster/configure-multiple-schedulers/
##
schedulerName: ""
## @param serviceAccount.create Specifies whether a ServiceAccount should be created
## @param serviceAccount.name The name of the ServiceAccount to create
##
serviceAccount:
  create: true
  name: ""
## @param hostAliases [array] bk-nodeman pod host aliases
## https://kubernetes.io/docs/concepts/services-networking/add-entries-to-pod-etc-hosts-with-host-aliases/
##
hostAliases: []
## @param extraVolumes Optionally specify extra list of additional volumes for bk-nodeman pods
##
extraVolumes: []
## @param extraVolumeMounts Optionally specify extra list of additional volumeMounts for bk-nodeman container(s)
##
extraVolumeMounts: []
## @param sidecars Add additional sidecar containers to the bk-nodeman pod
## e.g:
## sidecars:
##   - name: your-image-name
##     image: your-image
##     imagePullPolicy: Always
##     ports:
##       - name: portname
##         containerPort: 1234
##
sidecars: []
## @param initContainers Add additional init containers to the bk-nodeman pods
## ref: https://kubernetes.io/docs/concepts/workloads/pods/init-containers/
## e.g:
## initContainers:
##  - name: your-image-name
##    image: your-image
##    imagePullPolicy: Always
##    command: ['sh', '-c', 'copy addons from git and push to /bk-nodeman/addons. Should work with extraVolumeMounts and extraVolumes']
##
initContainers: []

## @param initContainerResources init container resources.
initContainerResources:
  limits:
    memory: 1024Mi
    cpu: 1000m
  requests:
    memory: 128Mi
    cpu: 200m

## @param podLabels Extra labels for bk-nodeman pods
## ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
##
podLabels: {}
## @param podAnnotations Annotations for bk-nodeman pods
## ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
##
podAnnotations: {}
## @param podAffinityPreset Pod affinity preset. Ignored if `affinity` is set. Allowed values: `soft` or `hard`
## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#inter-pod-affinity-and-anti-affinity
##
podAffinityPreset: ""
## @param podAntiAffinityPreset Pod anti-affinity preset. Ignored if `affinity` is set. Allowed values: `soft` or `hard`
## Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#inter-pod-affinity-and-anti-affinity
##
podAntiAffinityPreset: soft
## Node affinity preset
## Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#node-affinity
##
nodeAffinityPreset:
  ## @param nodeAffinityPreset.type Node affinity preset type. Ignored if `affinity` is set. Allowed values: `soft` or `hard`
  ##
  type: ""
  ## @param nodeAffinityPreset.key Node label key to match. Ignored if `affinity` is set
  ##
  key: ""
  ## @param nodeAffinityPreset.values Node label values to match. Ignored if `affinity` is set
  ## E.g.
  ## values:
  ##   - e2e-az1
  ##   - e2e-az2
  ##
  values: []
## @param affinity Affinity for pod assignment
## Ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
## NOTE: podAffinityPreset, podAntiAffinityPreset, and  nodeAffinityPreset will be ignored when it's set
##
affinity: {}
## @param nodeSelector Node labels for pod assignment
## ref: https://kubernetes.io/docs/user-guide/node-selection/
##
nodeSelector: {}
## @param tolerations Tolerations for pod assignment
## ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
##
tolerations: []
##
## @param terminationGracePeriodSeconds Termination grace period in seconds
## ref: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#container-probes
##
terminationGracePeriodSeconds: 30
##
## bk-nodeman containers' resource requests and limits
## ref: http://kubernetes.io/docs/user-guide/compute-resources/
## @param resources.limits The resources limits for the bk-nodeman container
## @param resources.requests [object] The requested resources for the bk-nodeman container
##
## resources:
##   limits:
##     memory: 4096Mi
##     cpu: 2000m
##   requests:
##     memory: 512Mi
##     cpu: 500m

## Container ports
## @param containerPort bk-nodeman HTTP container port
##
containerPort: 5000
## Configure Pods Security Context
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod
## @param podSecurityContext.enabled Enabled bk-nodeman pods' Security Context
## @param podSecurityContext.fsGroup Set bk-nodeman pod's Security Context fsGroup
##
podSecurityContext:
  enabled: false
  fsGroup: 1001
## Configure Container Security Context (only main container)
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-container
## @param containerSecurityContext.enabled Enabled bk-nodeman containers' Security Context
## @param containerSecurityContext.runAsUser Set bk-nodeman container's Security Context runAsUser
##
containerSecurityContext:
  enabled: false
  runAsUser: 1001
## Configure extra options for bk-nodeman containers' liveness and readiness probes
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-probes/#configure-probes
## @param livenessProbe.enabled Enable livenessProbe
## @param livenessProbe.path Path for to check for livenessProbe
## @param livenessProbe.initialDelaySeconds Initial delay seconds for livenessProbe
## @param livenessProbe.periodSeconds Period seconds for livenessProbe
## @param livenessProbe.timeoutSeconds Timeout seconds for livenessProbe
## @param livenessProbe.failureThreshold Failure threshold for livenessProbe
## @param livenessProbe.successThreshold Success threshold for livenessProbe
##
livenessProbe:
  enabled: false
  path: /ping
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 6
  successThreshold: 1
## @param readinessProbe.enabled Enable readinessProbe
## @param readinessProbe.path Path to check for readinessProbe
## @param readinessProbe.initialDelaySeconds Initial delay seconds for readinessProbe
## @param readinessProbe.periodSeconds Period seconds for readinessProbe
## @param readinessProbe.timeoutSeconds Timeout seconds for readinessProbe
## @param readinessProbe.failureThreshold Failure threshold for readinessProbe
## @param readinessProbe.successThreshold Success threshold for readinessProbe
##
readinessProbe:
  enabled: true
  path: /healthz
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 6
  successThreshold: 1

## @param customLivenessProbe Custom livenessProbe that overrides the default one
##
customLivenessProbe: {}
## @param customReadinessProbe Custom readinessProbe that overrides the default one
#
customReadinessProbe: {}

## bk-nodeman Autoscaling configuration
## ref: https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/
## @param autoscaling.enabled Enable Horizontal POD autoscaling for bk-nodeman
## @param autoscaling.minReplicas Minimum number of bk-nodeman replicas
## @param autoscaling.maxReplicas Maximum number of bk-nodeman replicas
## @param autoscaling.targetCPU Target CPU utilization percentage
## @param autoscaling.targetMemory Target Memory utilization percentage
##
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 11
  targetCPU: 50
  targetMemory: 50

## 蓝鲸日志采集
##
bkLogConfig:
  enabled: false
  dataId: 1

## 蓝鲸APIGateway的URL配置模板
bkApiUrlTmpl: "http://bkapi.example.com/api/{api_name}"

## 蓝鲸APIGateway网关名称
bkApigatewayName: "bk-nodeman"

## 蓝鲸网关组件应用配置信息
bkComponentAppCode: "bk_nodeman"
bkComponentAppSecret: ""

## 蓝鲸APIGateway网关授权应用列表
## 示例: [{"bk_app_code":"app-1"},{"bk_app_code":"app-2"}]
bkApigatewayGrantAppCodeList: ''

## 配置bkApigatewayPublicKey用于对接apigateway解析jwt, base64
bkApigatewayPublicKey: ""

## 同步APIGateway资源配置
apigwSync:
  ## 默认为false不同步网关配置
  enabled: false

## bk-gse common base configuration
##
common:
  ## @param etc path.
  ##
  etcPath: "/bk-nodeman/etc"
  ## @param bin path.
  ##
  binPath: "/bk-nodeman/bin"
  ## @param log path.
  ##
  logPath: "/bk-nodeman/logs"
  ## @param cert path.
  ##
  certPath: "/bk-nodeman/cert"

## etcd chart configuration
## ref: https://github.com/bitnami/charts/blob/master/bitnami/etcd/values.yaml
etcd:
  enabled: true

  ## Authentication parameters
  ##
  auth:
    ## Role-based access control parameters
    ## ref: https://etcd.io/docs/current/op-guide/authentication/
    ##
    rbac:
      ## @param auth.rbac.create Switch to enable RBAC authentication
      ##
      create: false

    ## Authentication token
    ## ref: https://etcd.io/docs/latest/learning/design-auth-v3/#two-types-of-tokens-simple-and-jwt
    ##
    token:
      ## @param auth.token.enabled Enables token authentication
      ##
      enabled: false

  ## Enable persistence using Persistent Volume Claims
  ## ref: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
  ##
  persistence:
    enabled: false

## If the etcd included in the chart is disabled, bk-nodeman will use below
## parameters to connect to an external etcd service.
externalEtcd:
  endpoints:
    - "127.0.0.1:2379"
  username: ""
  password: ""
  ca: ""
  cert: ""
  key: ""

## Redis chart configuration
## ref: https://github.com/bitnami/charts/blob/master/bitnami/redis/values.yaml
redis:
  enabled: true

  ## @param architecture Redis&reg; architecture. Allowed values: `standalone` or `replication`
  ##
  architecture: standalone
  ## Redis&reg; Authentication parameters
  ## ref: https://github.com/bitnami/containers/tree/main/bitnami/redis#setting-the-server-password-on-first-run
  ##
  auth:
    ## @param auth.enabled Enable password authentication
    ##
    enabled: true
    ## @param auth.password Redis&reg; password
    ## Defaults to a random 10-character alphanumeric string if not set
    ##
    password: "defaultpassword"

  ## @param usePassword Use password authentication
  ##
  usePassword: true
  ## @param password Redis&trade; password (ignored if existingSecret set)
  ## Defaults to a random 10-character alphanumeric string if not set and usePassword is true
  ## ref: https://github.com/bitnami/bitnami-docker-redis#setting-the-server-password-on-first-run
  ##
  password: "defaultpassword"
  ## Redis&trade; Service properties for standalone mode.
  ##
  service:
    ## @param service.ports.redis Kubernetes Redis service port
    ##
    ports:
      redis: 6379
  ## Enable persistence using Persistent Volume Claims
  ## ref: https://kubernetes.io/docs/user-guide/persistent-volumes/
  ##
  persistence:
    ## @param persistence.enabled Use a PVC to persist data.
    ##
    enabled: false

## If the redis cluster included in the chart is disabled, bk-nodeman will use below
## parameters to connect to an external redis service.
externalRedis:
  ## external redis cluster service types('cluster' 'standalone' 'sentinel')
  ##
  type: "cluster"
  ## external redis cluster service host name
  ##
  host: ""
  ## external redis cluster service port
  ##
  port: 6379
  ## external redis cluster service user name
  ##
  username: "default"
  ## external redis cluster service password
  ##
  password: ""
  ## external redis cluster service sentinel master name
  ##
  sentinelMasterName: ""
  ## external redis cluster service sentinel password
  ##
  sentinelPassword: ""


## mongodb chart configuration
## ref: https://github.com/bitnami/charts/blob/master/bitnami/mongodb/values.yaml
##
mongodb:
  enabled: true
  ## @param architecture MongoDB&reg; architecture (`standalone` or `replicaset`)
  ##
  architecture: replicaset
  ## @param useStatefulSet Set to true to use a StatefulSet instead of a Deployment (only when `architecture=standalone`)
  ##
  useStatefulSet: true
  ## @param replicaSetName Name of the replica set (only when `architecture=replicaset`)
  ## Ignored when mongodb.architecture=standalone
  ##
  replicaSetName: rs0
  ## @param replicaCount Number of MongoDB&reg; nodes (only when `architecture=replicaset`)
  ## Ignored when mongodb.architecture=standalone
  ##
  replicaCount: 2

  ## Service parameters
  ##
  service:
    ## @param service.port MongoDB&reg; service port
    ##
    port: 27017

  ## MongoDB&reg; Authentication parameters
  ##
  auth:
    ## @param auth.enabled Enable authentication
    ## ref: https://docs.mongodb.com/manual/tutorial/enable-authentication/
    ##
    enabled: true
    ## @param auth.rootUser MongoDB&reg; root user
    ##
    rootUser: root
    ## @param auth.rootPassword MongoDB&reg; root password
    ## ref: https://github.com/bitnami/bitnami-docker-mongodb/blob/master/README.md#setting-the-root-password-on-first-run
    ##
    rootPassword: "defaultpassword"
    ## MongoDB&reg; custom users and databases
    ## ref: https://github.com/bitnami/bitnami-docker-mongodb/blob/master/README.md#creating-users-and-databases-on-first-run
    username: "nodeman"
    password: "defaultpassword"
    database: "nodeman"
    ## @param auth.replicaSetKey Key used for authentication in the replicaset (only when `architecture=replicaset`)
    ##
    replicaSetKey: ""
  ## Enable persistence using Persistent Volume Claims
  ## ref: https://kubernetes.io/docs/user-guide/persistent-volumes/
  ##
  persistence:
    ## @param persistence.enabled Enable MongoDB&reg; data persistence using PVC
    ##
    enabled: true
    ## @param persistence.storageClass PVC Storage Class for MongoDB&reg; data volume
    ## If defined, storageClassName: <storageClass>
    ## If set to "-", storageClassName: "", which disables dynamic provisioning
    ## If undefined (the default) or set to null, no storageClassName spec is
    ## set, choosing the default provisioner.
    ##
    storageClass: ""
    ## @param persistence.size PVC Storage Request for MongoDB&reg; data volume
    ##
    size: 10Gi

## If the Mongodb included in the chart is disabled, bk-nodeman will use below
## parameters to connect to an external mongodb.
externalMongodb:
  ## @param replicaSetName Name of the replica set
  ##
  replicaSetName: "rs0"
  ## @param externalMongodb.hosts MongoDB&reg; service host, eg:ip:port,ip:port
  ##
  hosts: ""
  ## MongoDB&reg; custom users and databases
  ## ref: https://github.com/bitnami/bitnami-docker-mongodb/blob/master/README.md#creating-users-and-databases-on-first-run
  username: "nodeman"
  password: "defaultpassword"
  database: "nodeman"
  authSource: "admin"
  authMechanism: "SCRAM-SHA-256"

## Nodeman backend.
##
backend:
  ## @param backend, enabled Enable backend
  ##
  enabled: true

  ## @param imageTag module image tag, it's empty as default.
  ## NOTE: would use root image configs when it's empty.
  imageTag: ""

  ## @param podAnnotations module pod annotations,
  ## NOTE: would use root annotations configs when it's not set.
  podAnnotations: {}

  ## @param hostNetwork module host network mode config.
  hostNetwork: true

  ## @param nodeSelector specify node labels for task pod assignment.
  ## NOTE: will be combined with the top nodeSelector in values.
  nodeSelector: {}

  ## @param terminationGracePeriodSeconds module pod termination grace period
  ## NOTE: would use root terminationGracePeriodSeconds if it's not set.
  terminationGracePeriodSeconds: 30

  ## backend containers' resource requests and limits
  ##
  resources:
    limits:
      memory: 4096Mi
      cpu: 2000m
    requests:
      memory: 2048Mi
      cpu: 1000m

  ## @param configs module configs
  ##
  config:
    ## mode: release or debug, default is release.
    runMode: "release"

    ## tenant_mode: multi or single, default is single.
    tenantMode: "single"

    ## system: define the related settings of deployment environment.
    system:
      env: bk-dev
      edition: ee

    ## encryptKey: define the key used to encrypt the sensitive data.
    encryptKey: "1234567890abcdef"

    ## defines the backend http server related settings.
    httpServer:
      bindIP: "0.0.0.0"
      port: 8000

    ## defines the backend admin server related settings.
    adminServer:
      bindIP: "0.0.0.0"
      port: 8001

    ## defines the backend callback server related settings.
    callbackServer:
      bindIP: "0.0.0.0"
      port: 8002

    ## defines the workflow related settings.
    workflow:
      # workerNum is the number of workers.
      workerNum: 1

    # defines the CMDB (BK API gateway) related settings.
    cmdb:
      # supplierAccount is a value specified by some api of CMDB that needs to be provided
      supplierAccount: "0"
      # endpoints is a seed list of host:port addresses of esb nodes.
      endpoints:
        - "https://example.com/api/bk-cmdb/prod"
      # appCode is the BlueKing app code of NodeMan to request api gateway.
      appCode: ""
      # appSecret is the BlueKing app secret of NodeMan to request api gateway.
      appSecret: ""
      # user is the BlueKing user of NodeMan to request api gateway.
      user: ""
      # authMode is the mode to do api auth verification,
      # it support 'oa' and 'ee' and 'at' mode for now.
      # 1. oa use bkTicket auth.
      # 2. ee use bkToken auth.
      # 3. at use accessToken auth.
      # 4. un use no user authentication required
      authMode: "un"
      # bkTicket is the BlueKing access ticket of costops to request api gateway.
      bkTicket: ""
      # bkToken is the BlueKing user token of costops to request api gateway.
      bkToken: ""
      # accessToken is the BlueKing access token of costops to request api gateway.
      accessToken: ""
      # defines tls related options.
      tls:
        # server should be accessed without verifying the TLS certificate.
        insecureSkipVerify: false
        # server requires TLS client certificate authentication.
        certFile: ""
        # server requires TLS client certificate authentication.
        keyFile: ""
        # trusted root certificates for server.
        caFile: ""
        # the password to decrypt the certificate.
        password: ""

    gseDeployConfs:
      - # defines the gse deploy related settings.
        generation:  2
        os_type: "linux"
        host_id_path:  "/var/lib/gse2/host/hostid"
        gse_data_ipc: "/var/run/gse2/ipc.state.report"
        gse_plugin_ipc: "/var/run/gse2/ipc.state.message"
        gse_home_dir: "/usr/local/gse2"
        gse_data_dir: "/var/lib/gse2"
        gse_run_dir: "/var/run/gse2"
        gse_log_dir: "/var/log/gse2"
        gse_environ_di: "/etc/sysconfig/gse2"
      - # defines the gse deploy related settings.
        generation: 2
        os_type: "windows"
        host_id_path: "c:\\gse2\\data\\host\\hostid"
        gse_data_ipc: "27000"
        gse_plugin_ipc: ""
        gse_home_dir: "C:\\gse2"
        gse_data_dir: "C:\\gse2\\data"
        gse_run_dir: "C:\\gse2\\data"
        gse_log_dir: "C:\\gse2\\log"
        gse_environ_di: "C:\\Windows\\System32\\config\\gse\\gse2"


    ## defines the log related settings.
    log:
      dir: "/bk-nodeman/log"
      level: "INFO"
      maxNum: 10
      maxSizeMB: 200
      toStderr: false
      alsoToStderr: false

## Nodeman application.
##
application:
  ## @param application, enabled Enable application
  ##
  enabled: true

  ## @param imageTag module image tag, it's empty as default.
  ## NOTE: would use root image configs when it's empty.
  imageTag: ""

  ## @param podAnnotations module pod annotations,
  ## NOTE: would use root annotations configs when it's not set.
  podAnnotations: {}

  ## @param hostNetwork module host network mode config.
  hostNetwork: false

  ## @param nodeSelector specify node labels for task pod assignment.
  ## NOTE: will be combined with the top nodeSelector in values.
  nodeSelector: {}

  ## @param terminationGracePeriodSeconds module pod termination grace period
  ## NOTE: would use root terminationGracePeriodSeconds if it's not set.
  terminationGracePeriodSeconds: 30

  ## application containers' resource requests and limits
  ##
  resources:
    limits:
      memory: 4096Mi
      cpu: 2000m
    requests:
      memory: 2048Mi
      cpu: 1000m

  ## @param configs module configs
  ##
  config:
    ## mode: release or debug, default is release.
    runMode: "release"

    ## tenant_mode: multi or single, default is single.
    tenantMode: "single"

    # defines the nodeman backend (BK API gateway) related settings.
    backend:
      # endpoints is a seed list of host:port addresses of esb nodes.
      endpoints:
        - "https://example.com/api/bk-nodeman/prod"
      # appCode is the BlueKing app code of NodeMan to request api gateway.
      appCode: ""
      # appSecret is the BlueKing app secret of NodeMan to request api gateway.
      appSecret: ""
      # user is the BlueKing user of NodeMan to request api gateway.
      user: ""
      # authMode is the mode to do api auth verification,
      # it support 'oa' and 'ee' and 'at' mode for now.
      # 1. oa use bkTicket auth.
      # 2. ee use bkToken auth.
      # 3. at use accessToken auth.
      # 4. un use no user authentication required
      authMode: "un"
      # bkTicket is the BlueKing access ticket of costops to request api gateway.
      bkTicket: ""
      # bkToken is the BlueKing user token of costops to request api gateway.
      bkToken: ""
      # accessToken is the BlueKing access token of costops to request api gateway.
      accessToken: ""
      # defines tls related options.
      tls:
        # server should be accessed without verifying the TLS certificate.
        insecureSkipVerify: false
        # server requires TLS client certificate authentication.
        certFile: ""
        # server requires TLS client certificate authentication.
        keyFile: ""
        # trusted root certificates for server.
        caFile: ""
        # the password to decrypt the certificate.
        password: ""

    ## defines the application http server related settings.
    httpServer:
      bindIP: "0.0.0.0"
      port: 5000

    ## defines the application admin server related settings.
    adminServer:
      bindIP: "0.0.0.0"
      port: 5001

    ## defines the log related settings.
    log:
      dir: "/bk-nodeman/log"
      level: "INFO"
      maxNum: 10
      maxSizeMB: 200
      toStderr: false
      alsoToStderr: false

## Nodeman file
##
file:
  ## @param enabled Enable file
  ##
  enabled: true

  ## @param imageTag module image tag, it's empty as default.
  ## NOTE: would use root image configs when it's empty.
  imageTag: ""

  ## @param podAnnotations module pod annotations,
  ## NOTE: would use root annotations configs when it's not set.
  podAnnotations: {}

  ## @param hostNetwork module host network mode config.
  hostNetwork: true

  ## @param nodeSelector specify node labels for task pod assignment.
  ## NOTE: will be combined with the top nodeSelector in values.
  nodeSelector: { }

  ## @param terminationGracePeriodSeconds module pod termination grace period
  ## NOTE: would use root terminationGracePeriodSeconds if it's not set.
  terminationGracePeriodSeconds: 30

  ## file containers' resource requests and limits
  ##
  resources:
    limits:
      memory: 4096Mi
      cpu: 2000m
    requests:
      memory: 2048Mi
      cpu: 1000m

  ## @param configs module configs
  ##
  config:
    ## mode: release or debug, default is release.
    runMode: "release"

    ## tenant_mode: multi or single, default is single.
    tenantMode: "single"

    ## defines the file http server related settings.
    httpServer:
      bindIP: "0.0.0.0"
      port: 7000

    ## defines the file admin server related settings.
    adminServer:
      bindIP: "0.0.0.0"
      port: 7001

    agentFileGroup:
      fullPath: "/bk-nodeman/file/agent"

    ## defines the log related settings.
    log:
      dir: "/bk-nodeman/log"
      level: "INFO"
      maxNum: 10
      maxSizeMB: 200
      toStderr: false
      alsoToStderr: false
{{- if .Values.application.enabled }}
apiVersion: {{ template "common.capabilities.deployment.apiVersion" . }}
kind: Deployment
metadata:
  name: {{ template "bk-nodeman.fullname" . }}-application
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
    values-hash: "{{ toYaml .Values.application | sha256sum | trunc 63 }}"
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ include "bk-nodeman.replicaCount" ( dict "root" .Values "module" .Values.application ) }}
  {{- if .Values.updateStrategy }}
  strategy:
    type: {{ .Values.updateStrategy.type }}
    {{- if (eq "Recreate" .Values.updateStrategy.type) }}
    rollingUpdate: null
    {{- else }}
    rollingUpdate: {{ .Values.updateStrategy.rollingUpdate | toYaml | nindent 6 }}
    {{- end }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "common.labels.matchLabels" . | nindent 6 }}
      app: nodeman-application
  template:
    metadata:
      labels:
        {{- include "common.labels.standard" . | nindent 8 }}
        {{- if .Values.podLabels }}
        {{- include "common.tplvalues.render" (dict "value" .Values.podLabels "context" $) | nindent 8 }}
        {{- end }}
        app: nodeman-application
      {{- if .Values.application.podAnnotations }}
      annotations:
        {{- include "common.tplvalues.render" (dict "value" .Values.application.podAnnotations "context" $) | nindent 8 }}
      {{- else if .Values.podAnnotations }}
      annotations:
        {{- include "common.tplvalues.render" (dict "value" .Values.podAnnotations "context" $) | nindent 8 }}
      {{- end }}
    spec:
      {{- include "bk-nodeman.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.schedulerName }}
      schedulerName: {{ .Values.schedulerName | quote }}
      {{- end }}
      {{- if .Values.hostAliases }}
      # yamllint disable rule:indentation
      hostAliases: {{- include "common.tplvalues.render" (dict "value" .Values.hostAliases "context" $) | nindent 8 }}
      # yamllint enable rule:indentation
      {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector: {{- include "common.tplvalues.render" (dict "value" (merge .Values.application.nodeSelector .Values.nodeSelector) "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations: {{- include "common.tplvalues.render" (dict "value" .Values.tolerations "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.podSecurityContext.enabled }}
      securityContext: {{- omit .Values.podSecurityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity: {{- include "common.tplvalues.render" (dict "value" .Values.affinity "context" $) | nindent 8 }}
      {{- else }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      {{- if .Values.application.hostNetwork }}
                      - nodeman-application
                      {{- else }}
                      - nodeman-no-affinity
                    {{- end }}
              topologyKey: kubernetes.io/hostname
              namespaces: []
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.application.terminationGracePeriodSeconds | default .Values.terminationGracePeriodSeconds }}
      containers:
        - name: {{ template "bk-nodeman.fullname" . }}-application
          {{- if len .Values.application.imageTag }}
          {{- if len .Values.global.imageRegistry }}
          image: {{ .Values.global.imageRegistry }}/{{ .Values.image.repository }}:{{ .Values.application.imageTag }}
          {{- else }}
          image: {{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.application.imageTag }}
          {{- end }}
          {{- else }}
          image: {{ template "bk-nodeman.image" . }}
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          command:
            - {{ .Values.common.binPath }}/bk-nodeman-application
          args: 
            - webserver
            - -f 
            - {{ .Values.common.etcPath }}/application_conf.yaml
          env:
            - name: NODEMAN-MODULE
              value: application
          ports:
            - name: service-http
              containerPort: {{ .Values.application.config.httpServer.port }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: service-http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.livenessProbe.successThreshold }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- else if .Values.customLivenessProbe }}
          livenessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.customLivenessProbe "context" $) | nindent 10 }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: service-http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.readinessProbe.successThreshold }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- else if .Values.customReadinessProbe }}
          readinessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.customReadinessProbe "context" $) | nindent 10 }}
          {{- end }}
          volumeMounts:
            - name: nodeman-cert
              mountPath: {{ .Values.common.certPath }}
            - name: {{ template "bk-nodeman.fullname" . }}-application-config
              mountPath: {{ .Values.common.etcPath }}
          {{- if .Values.resources }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          {{- else }}
          resources: {{- toYaml .Values.application.resources | nindent 12 }}
          {{- end }}

      initContainers:
        - name: {{ template "bk-nodeman.fullname" . }}-application-check-mongodb
          {{- if len .Values.application.imageTag }}
          {{- if len .Values.global.imageRegistry }}
          image: {{ .Values.global.imageRegistry }}/{{ .Values.image.repository }}:{{ .Values.application.imageTag }}
          {{- else }}
          image: {{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.application.imageTag }}
          {{- end }}
          {{- else }}
          image: {{ template "bk-nodeman.image" . }}
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          command: ["sh", "-c"]
          args:
          - |
            /bin/sh <<'EOF'

            mongobin="mongo"

            # check mongodb.
            try_times=1
            ret=1
            sleep_time=1
            while [ ${ret} -ne 0 ]
            do
                {{- if .Values.mongodb.enabled }}
                ${mongobin} {{ template "bk-nodeman.fullname" . }}-mongodb-headless:{{ .Values.mongodb.service.port }}/{{ .Values.mongodb.auth.authSource }} -u {{ .Values.mongodb.auth.username }} -p {{ .Values.mongodb.auth.password }} --eval "db.runCommand({ping: 1})"
                {{- else }}
                ${mongobin} {{ .Values.externalMongodb.hosts }}/{{ .Values.externalMongodb.authSource }} -u {{ .Values.externalMongodb.username }} -p {{ .Values.externalMongodb.password }} --eval "db.runCommand({ping: 1})"
                {{- end }}

                ret=$?
                echo try to check ${try_times} times
                try_times=$((try_times+1))
                sleep ${sleep_time}
            done

            echo "check mongodb done"
            EOF
          resources: {{- toYaml .Values.initContainerResources | nindent 12 }}
      hostNetwork: {{ .Values.application.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      volumes:
      - name: nodeman-cert
        configMap:
          name: {{ template "bk-nodeman.fullname" . }}-certs
      - name: {{ template "bk-nodeman.fullname" . }}-application-config
        configMap:
          name: {{ template "bk-nodeman.fullname" . }}-application-config
{{- end }}

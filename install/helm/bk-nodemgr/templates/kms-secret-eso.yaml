{{- if .Values.kms.enabled }}
{{- $tls := .Values.kms.tls }}
{{- $saName := include "bk-nodemgr.serviceAccountName" . }}
{{- range $name, $module := dict "global" (dict "enabled" true) "application" .Values.application "backend" .Values.backend "file" .Values.file }}
{{- if $module.enabled }}
{{- $modCfg := index $.Values.kms.modules $name }}
{{- $secretName := printf "%s-%s-kms-secret" (include "bk-nodemgr.fullname" $) $name }}
---
# apiVersion: external-secrets.io/v1
# some clusters run an older ESO, v1beta1 is used for compatibility.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ include "bk-nodemgr.fullname" $ }}-{{ $name }}-kms-secret-store
  namespace: {{ $.Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" $ | nindent 4 }}
    app: nodemgr-{{ $name }}
spec:
  provider:
    vault:
      server: {{ required "kms.server is required when kms.enabled=true" $.Values.kms.server | quote }}
      path: {{ required (printf "kms.modules.%s.path is required when kms.enabled=true" $name) $modCfg.path | quote }}
      version: "v2"
      {{- if and $tls.enabled $tls.secretName }}
      # one-way TLS: verify the KMS server certificate.
      caProvider:
        type: "Secret"
        name: {{ $tls.secretName | quote }}
        key: {{ $tls.secretCaFileName | quote }}
        namespace: {{ $.Release.Namespace | quote }}
      {{- end }}
      {{- if $tls.client.enabled }}
      # mTLS: provide the client certificate to the KMS server.
      tls:
        certSecretRef:
          name: {{ required "kms.tls.secretName is required when kms.tls.client.enabled=true" $tls.secretName | quote }}
          key: {{ $tls.client.secretCertFileName | quote }}
          namespace: {{ $.Release.Namespace | quote }}
        keySecretRef:
          name: {{ $tls.secretName | quote }}
          key: {{ $tls.client.secretKeyFileName | quote }}
          namespace: {{ $.Release.Namespace | quote }}
      {{- end }}
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: {{ required (printf "kms.modules.%s.role is required when kms.enabled=true" $name) $modCfg.role | quote }}
          serviceAccountRef:
            name: {{ $saName | quote }}
            namespace: {{ $.Release.Namespace | quote }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "bk-nodemgr.fullname" $ }}-{{ $name }}-kms-external-secret
  namespace: {{ $.Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" $ | nindent 4 }}
    app: nodemgr-{{ $name }}
spec:
  refreshInterval: {{ $.Values.kms.refreshInterval | quote }}
  secretStoreRef:
    name: {{ include "bk-nodemgr.fullname" $ }}-{{ $name }}-kms-secret-store
    kind: SecretStore
  target:
    name: {{ $secretName }}
    creationPolicy: Owner
  data:
    - secretKey: privateKey
      remoteRef:
        key: {{ required (printf "kms.modules.%s.credential is required when kms.enabled=true" $name) $modCfg.credential }}
        property: private_key
    - secretKey: envelope
      remoteRef:
        key: {{ $modCfg.credential }}
        property: envelope
{{- end }}
{{- end }}
{{- end }}

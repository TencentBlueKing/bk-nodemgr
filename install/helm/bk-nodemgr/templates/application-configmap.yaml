{{- if .Values.application.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "bk-nodemgr.fullname" . }}-application-config
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
data:
  application_conf.yaml: |
    runMode: {{ .Values.application.config.runMode }}

    tenantMode: {{ .Values.application.config.tenantMode }}

    infoServer: {{ include "bk-nodemgr.httpServerConfig" (dict "config" .Values.application.config.infoServer "terminationGracePeriodSeconds" (.Values.application.terminationGracePeriodSeconds | default .Values.terminationGracePeriodSeconds)) | nindent 6 }}
      advertiseIPV4: __ADVERTISE_IPV4__
      advertiseIPV6: __ADVERTISE_IPV6__

    adminServer: {{ include "bk-nodemgr.httpServerConfig" (dict "config" .Values.application.config.adminServer "terminationGracePeriodSeconds" (.Values.application.terminationGracePeriodSeconds | default .Values.terminationGracePeriodSeconds)) | nindent 6 }}
      advertiseIPV4: __ADVERTISE_IPV4__
      advertiseIPV6: __ADVERTISE_IPV6__

    basicServer: {{ include "bk-nodemgr.httpServerConfig" (dict "config" .Values.application.config.basicServer "terminationGracePeriodSeconds" (.Values.application.terminationGracePeriodSeconds | default .Values.terminationGracePeriodSeconds)) | nindent 6 }}
      advertiseIPV4: __ADVERTISE_IPV4__
      advertiseIPV6: __ADVERTISE_IPV6__

    front: {{ .Values.application.config.front | toYaml | nindent 6 }}

    backend: {{ .Values.application.config.backend | toYaml | nindent 6 }}

    userManager: {{ .Values.application.config.userManager | toYaml | nindent 6 }}

    access:
      {{- if hasKey (.Values.application.config.access | default dict) "virtualUser" }}
      virtualUser: {{ .Values.application.config.access.virtualUser | quote }}
      {{- else }}
      virtualUser: {{ ternary "admin" "bk_admin" (eq .Values.application.config.tenantMode "single") | quote }}
      {{- end }}

    log: {{ .Values.application.config.log | toYaml | nindent 6 }}

    file: {{ .Values.application.config.file | toYaml | nindent 6 }}

    bkSaaS: {{ .Values.application.config.bkSaaS | toYaml | nindent 6 }}

    bkPaaS: {{ .Values.application.config.bkPaaS | toYaml | nindent 6 }}

    iamV3: {{ .Values.application.config.iamV3 | toYaml | nindent 6 }}

    notice: {{ .Values.application.config.notice | toYaml | nindent 6 }}

    tracing:
      {{- omit .Values.application.config.tracing "instanceID" | toYaml | nindent 6 }}
      instanceID: "__TRACING_INSTANCEID__"

    configPolicyOption:
      filePath: {{ .Values.application.config.configPolicyOption.filePath | quote }}

    etcd:
      {{- if .Values.etcd.enabled }}
      endpoints:
        - {{ include "bk-nodemgr.etcd.fullname" . }}-headless:{{ include "bk-nodemgr.etcd.clientPort" . }}
      {{- else }}
      endpoints: {{ .Values.externalEtcd.endpoints | toYaml | nindent 6 }}
      username: {{ .Values.externalEtcd.username }}
      password: {{ .Values.externalEtcd.password }}
      tls:
        {{- if len .Values.externalEtcd.tls.ca }}
        caFile: {{ .Values.common.certPath }}/etcdca.crt
        certFile: {{ .Values.common.certPath }}/etcd.crt
        keyFile: {{ .Values.common.certPath }}/etcd.key
        password: {{ .Values.externalEtcd.tls.password }}
        {{- else if len .Values.externalEtcd.tls.secretName }}
        "caFile": "{{ .Values.common.certPath }}/{{ .Values.externalEtcd.tls.secretCaFileName }}",
        "certFile": "{{ .Values.common.certPath }}/{{ .Values.externalEtcd.tls.secretCertFileName }}",
        "keyFile": "{{ .Values.common.certPath }}/{{ .Values.externalEtcd.tls.secretKeyFileName }}",
        {{- end}}
      {{- end}}

    mongodb:
      appName: {{ template "bk-nodemgr.fullname" . }}-application
      {{- if .Values.mongodb.enabled }}
      replicaSet: {{ .Values.mongodb.replicaSetName }}
      hosts:
        - {{ template "bk-nodemgr.fullname" . }}-mongodb-headless
      username: {{ .Values.mongodb.auth.username }}
      password: {{ .Values.mongodb.auth.password }}
      database: {{ .Values.mongodb.auth.database }}
      authSource: {{ .Values.mongodb.auth.database }}
      authMechanism: SCRAM-SHA-256
      {{- else }}
      replicaSet: {{ .Values.externalMongodb.replicaSetName }}
      hosts: {{ .Values.externalMongodb.hosts | toYaml | nindent 6}}
      username: {{ .Values.externalMongodb.username }}
      password: {{ .Values.externalMongodb.password }}
      database: {{ .Values.externalMongodb.database }}
      authSource: {{ .Values.externalMongodb.authSource }}
      authMechanism: {{ .Values.externalMongodb.authMechanism }}
      tls:
        {{- if len .Values.externalMongodb.tls.ca }}
        caFile: {{ .Values.common.certPath }}/mongoca.crt
        certFile: {{ .Values.common.certPath }}/mongo.crt
        keyFile: {{ .Values.common.certPath }}/mongo.key
        password: {{ .Values.externalMongodb.tls.password }}
        {{- else if len .Values.externalMongodb.tls.secretName }}
        "caFile": "{{ .Values.common.certPath }}/{{ .Values.externalMongodb.tls.secretCaFileName }}",
        "certFile": "{{ .Values.common.certPath }}/{{ .Values.externalMongodb.tls.secretCertFileName }}",
        "keyFile": "{{ .Values.common.certPath }}/{{ .Values.externalMongodb.tls.secretKeyFileName }}",
        {{- end}}
      {{- end}}
      traceServiceName: {{ .Values.application.config.mongodb.traceServiceName }}
      traceSampleRate: {{ .Values.application.config.mongodb.traceSampleRate }}

{{- if .Values.application.config.configPolicyOption.agentOption }}
  agent_option.json: |
    {{ .Values.application.config.configPolicyOption.agentOption | toJson }}
  {{- end }}

  {{- if .Values.application.config.configPolicyOption.proxyOption }}
  proxy_option.json: |
    {{ .Values.application.config.configPolicyOption.proxyOption | toJson }}
  {{- end }}

  {{- if .Values.application.config.configPolicyOption.pluginOption }}
  plugin_option.json: |
    {{ .Values.application.config.configPolicyOption.pluginOption | toJson }}
  {{- end }}
{{- end }}

{{- if .Values.application.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "bk-nodemgr.fullname" . }}-application-config
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
data:
  application_conf.yaml: |
    runMode: {{ .Values.application.config.runMode }}

    tenantMode: {{ .Values.application.config.tenantMode }}

    infoServer: {{ .Values.application.config.infoServer | toYaml | nindent 6 }}
      advertiseIPV4: __ADVERTISE_IPV4__
      advertiseIPV6: __ADVERTISE_IPV6__

    adminServer: {{ .Values.application.config.adminServer | toYaml | nindent 6 }}
      advertiseIPV4: __ADVERTISE_IPV4__
      advertiseIPV6: __ADVERTISE_IPV6__

    basicServer: {{ .Values.application.config.basicServer | toYaml | nindent 6 }}
      advertiseIPV4: __ADVERTISE_IPV4__
      advertiseIPV6: __ADVERTISE_IPV6__

    front: {{ .Values.application.config.front | toYaml | nindent 6 }}

    backend: {{ .Values.application.config.backend | toYaml | nindent 6 }}

    log: {{ .Values.application.config.log | toYaml | nindent 6 }}

    bkSaaS: {{ .Values.application.config.bkSaaS | toYaml | nindent 6 }}

    restServer: {{ .Values.application.config.restServer | toYaml | nindent 6 }}

    etcd:
      {{- if .Values.etcd.enabled }}
      endpoints:
        - {{ template "bk-nodemgr.fullname" . }}-etcd-headless:2379
      {{- else }}
      endpoints: {{ .Values.externalEtcd.endpoints | toYaml | nindent 6 }}
      username: {{ .Values.externalEtcd.username }}
      password: {{ .Values.externalEtcd.password }}
      ca: {{ .Values.externalEtcd.ca }}
      cert: {{ .Values.externalEtcd.cert }}
      key: {{ .Values.externalEtcd.key }}
      {{- end}}

    mongodb:
      {{- if .Values.mongodb.enabled }}
      hosts:
        - {{ template "bk-nodemgr.fullname" . }}-mongodb-headless
      username: {{ .Values.mongodb.auth.username }}
      password: {{ .Values.mongodb.auth.password }}
      database: {{ .Values.mongodb.auth.database }}
      authSource: {{ .Values.mongodb.auth.database }}
      authMechanism: SCRAM-SHA-256
      {{- else }}
      hosts:
        - {{ .Values.externalMongodb.hosts }}
      username: {{ .Values.externalMongodb.username }}
      password: {{ .Values.externalMongodb.password }}
      database: {{ .Values.externalMongodb.database }}
      authSource: {{ .Values.externalMongodb.authSource }}
      authMechanism: {{ .Values.externalMongodb.authMechanism }}
      {{- end}}
{{- end }}
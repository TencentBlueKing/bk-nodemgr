{{- if .Values.application.enabled }}
{{- if .Values.application.ingress.enabled }}
{{- if not .Values.application.ingress.className }}
apiVersion: networkextension.bkbcs.tencent.com/v1
{{- else if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1
{{- else if semverCompare ">=1.14-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1beta1
{{- else -}}
apiVersion: extensions/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: {{ template "bk-nodemgr.fullname" . }}-application
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  annotations:
    networkextension.bkbcs.tencent.com/lbids: {{ .Values.application.ingress.lbid }}
  {{- if .Values.commonAnnotations }}
  {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  {{- if and .Values.application.ingress.className (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion) }}
  ingressClassName: {{ .Values.application.ingress.className }}
  {{- end }}
  rules:
  {{- if len .Values.application.ingress.certID }}
  - port: 443
    protocol: HTTPS
    certificate:
      mode: UNIDIRECTIONAL
      certID: {{ .Values.application.ingress.certID }}
  {{- else }}
  - port: 80
    protocol: HTTP
  {{- end }}
    listenerAttribute:
      lbPolicy: {{ .Values.application.ingress.lbPolicy }}
    layer7Routes:
    - domain: {{ .Values.application.ingress.domain }}
      path: /
      services:
      - serviceName: {{ template "bk-nodemgr.fullname" . }}-application
        serviceNamespace: {{ .Release.Namespace | quote }}
        servicePort: {{ .Values.application.config.basicServer.port }}
        isDirectConnect: {{ .Values.application.ingress.isDirectConnect }}
{{- end }}
{{- end }}

{{- if .Values.backend.enabled }}
apiVersion: {{ template "common.capabilities.deployment.apiVersion" . }}
kind: Deployment
metadata:
  name: {{ template "bk-nodemgr.fullname" . }}-backend
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ include "bk-nodemgr.replicaCount" ( dict "root" .Values "module" .Values.backend ) }}
  {{- if .Values.updateStrategy }}
  strategy:
    type: {{ .Values.updateStrategy.type }}
    {{- if (eq "Recreate" .Values.updateStrategy.type) }}
    rollingUpdate: null
    {{- else }}
    rollingUpdate: {{ .Values.updateStrategy.rollingUpdate | toYaml | nindent 6 }}
    {{- end }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "common.labels.matchLabels" . | nindent 6 }}
      app: nodemgr-backend
  template:
    metadata:
      labels:
        {{- include "common.labels.standard" . | nindent 8 }}
        {{- if .Values.podLabels }}
        {{- include "common.tplvalues.render" (dict "value" .Values.podLabels "context" $) | nindent 8 }}
        {{- end }}
        app: nodemgr-backend
      annotations:
        values-hash: "{{ toYaml .Values.backend.config | sha256sum | trunc 63 }}"
        profiling-hash: {{ include "bk-nodemgr.profilingConfig" (dict "config" .Values.backend.config.profiling "context" $) | sha256sum | trunc 63 | quote }}
        {{- if .Values.backend.podAnnotations }}
        {{- include "common.tplvalues.render" (dict "value" .Values.backend.podAnnotations "context" $) | nindent 8 }}
        {{- else if .Values.podAnnotations }}
        {{- include "common.tplvalues.render" (dict "value" .Values.podAnnotations "context" $) | nindent 8 }}
        {{- end }}
    spec:
      {{- include "bk-nodemgr.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "bk-nodemgr.serviceAccountName" . }}
      {{- if .Values.schedulerName }}
      schedulerName: {{ .Values.schedulerName | quote }}
      {{- end }}
      {{- if .Values.hostAliases }}
      # yamllint disable rule:indentation
      hostAliases: {{- include "common.tplvalues.render" (dict "value" .Values.hostAliases "context" $) | nindent 8 }}
      # yamllint enable rule:indentation
      {{- end }}
      {{- if or .Values.nodeSelector .Values.backend.nodeSelector }}
      nodeSelector: {{- include "common.tplvalues.render" (dict "value" (merge .Values.backend.nodeSelector .Values.nodeSelector) "context" $) | nindent 8 }}
      {{- end }}
      {{- if or .Values.tolerations .Values.backend.tolerations }}
      tolerations: {{- include "common.tplvalues.render" (dict "value" (concat .Values.tolerations .Values.backend.tolerations) "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.podSecurityContext.enabled }}
      securityContext: {{- omit .Values.podSecurityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity: {{- include "common.tplvalues.render" (dict "value" .Values.affinity "context" $) | nindent 8 }}
      {{- else }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      {{- if .Values.backend.hostNetwork }}
                      - nodemgr-backend
                      {{- else }}
                      - nodemgr-no-affinity
                    {{- end }}
              topologyKey: kubernetes.io/hostname
              namespaces: []
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.backend.terminationGracePeriodSeconds | default .Values.terminationGracePeriodSeconds }}
      containers:
        - name: {{ template "bk-nodemgr.fullname" . }}-backend
          {{- if len .Values.backend.image.tag }}
          {{- if len .Values.global.imageRegistry }}
          image: {{ .Values.global.imageRegistry }}/{{ .Values.image.repository }}:{{ .Values.backend.image.tag }}
          {{- else }}
          image: {{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.backend.image.tag }}
          {{- end }}
          {{- else }}
          image: {{ template "bk-nodemgr.image" . }}
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          lifecycle: {{- include "bk-nodemgr.lifecycleHooks" (dict "hooks" .Values.backend.lifecycleHooks "context" $) | nindent 12 }}
          command:
            - {{ .Values.common.binPath }}/bk-nodemgr-backend
          args:
            - -f
            - {{ .Values.common.etcPath }}/backend_conf.yaml
          env:
            - name: NODEMGR-MODULE
              value: backend
            {{- if .Values.kms.enabled }}
            - name: BK_NODEMGR_KMS_PRIVATE_KEY_GLOBAL
              valueFrom:
                secretKeyRef:
                  name: {{ template "bk-nodemgr.fullname" . }}-global-kms-secret
                  key: privateKey
            - name: BK_NODEMGR_KMS_PRIVATE_KEY_MODULE_BACKEND
              valueFrom:
                secretKeyRef:
                  name: {{ template "bk-nodemgr.fullname" . }}-backend-kms-secret
                  key: privateKey
            {{- end }}
          ports:
            - name: info-http
              containerPort: {{ .Values.backend.config.infoServer.port }}
            - name: basic-http
              containerPort: {{ .Values.backend.config.basicServer.port }}
            - name: callback-http
              containerPort: {{ .Values.backend.config.callbackServer.port }}
            - name: proxy-http
              containerPort: {{ .Values.backend.config.proxyServer.port }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: info-http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.livenessProbe.successThreshold }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- else if .Values.customLivenessProbe }}
          livenessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.customLivenessProbe "context" $) | nindent 10 }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: info-http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.readinessProbe.successThreshold }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- else if .Values.customReadinessProbe }}
          readinessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.customReadinessProbe "context" $) | nindent 10 }}
          {{- end }}
          volumeMounts:
            - name: nodemgr-cert
              mountPath: {{ .Values.common.certPath }}
            - name: nodemgr-etc
              mountPath: {{ .Values.common.etcPath }}
            {{- if .Values.kms.enabled }}
            - name: kms-envelope
              mountPath: {{ .Values.common.secretPath }}
              readOnly: true
            {{- end }}
          {{- if .Values.resources }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          {{- else }}
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          {{- end }}

      initContainers:
        {{- include "bk-nodemgr.storageCheckInitContainer" (dict "root" . "module" "backend" "moduleValues" .Values.backend "component" "etcd") | nindent 8 }}
        {{- include "bk-nodemgr.storageCheckInitContainer" (dict "root" . "module" "backend" "moduleValues" .Values.backend "component" "mongodb") | nindent 8 }}
        {{- include "bk-nodemgr.storageCheckInitContainer" (dict "root" . "module" "backend" "moduleValues" .Values.backend "component" "redis") | nindent 8 }}
        - name: {{ template "bk-nodemgr.fullname" . }}-backend-init
          {{- if len .Values.backend.image.tag }}
          {{- if len .Values.global.imageRegistry }}
          image: {{ .Values.global.imageRegistry }}/{{ .Values.image.repository }}:{{ .Values.backend.image.tag }}
          {{- else }}
          image: {{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.backend.image.tag }}
          {{- end }}
          {{- else }}
          image: {{ template "bk-nodemgr.image" . }}
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          command: ["sh", "-c"]
          args:
          - |
            /bin/sh <<'EOF'

            # for service api advertise ip, it may be ipv4 or ipv6 value which base on k8s node settings.
            ADVERTISE_IP=${POD_IP}

            # for agent schedule advertise ip, parsing ipv4 and ipv6 value which base on k8s node settings.
            ips=$(echo "${POD_IPS}" | sed 's/,/ /g')
            for ip in $ips; do
              echo "$ip" | grep -q : 2>/dev/null
              if [ $? -eq 0 ]; then
                ADVERTISE_IPV6=$ip
              else
                ADVERTISE_IPV4=$ip
              fi
            done

            if [ -n "{{ .Values.backend.config.advertiseIPV4 }}" ]; then
              ADVERTISE_IPV4={{ .Values.backend.config.advertiseIPV4 }}
            fi
            if [ -n "{{ .Values.backend.config.advertiseIPV6 }}" ]; then
              ADVERTISE_IPV6={{ .Values.backend.config.advertiseIPV6 }}
            fi

            # sed local config file.
            cp /tmp/backend_conf.yaml {{ .Values.common.etcPath }}/backend_conf.yaml
            sed -i "s/__ADVERTISE_IPV4__/${ADVERTISE_IPV4}/g" {{ .Values.common.etcPath }}/backend_conf.yaml
            sed -i "s/__ADVERTISE_IPV6__/${ADVERTISE_IPV6}/g" {{ .Values.common.etcPath }}/backend_conf.yaml

            if [ -n "{{ .Values.backend.config.tracing.instanceID }}" ]; then
              TRACING_INSTANCEID={{ .Values.backend.config.tracing.instanceID | quote }}
            fi
            sed -i "s/__TRACING_INSTANCEID__/${TRACING_INSTANCEID}/g" {{ .Values.common.etcPath }}/backend_conf.yaml

            echo "local module init done"
            EOF
          env:
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: POD_IPS
            valueFrom:
              fieldRef:
                fieldPath: status.podIPs
          - name: TRACING_INSTANCEID
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          volumeMounts:
            - name: {{ template "bk-nodemgr.fullname" . }}-backend-config
              mountPath: /tmp
            - name: nodemgr-etc
              mountPath: {{ .Values.common.etcPath }}
          resources: {{- toYaml .Values.initContainerResources | nindent 12 }}
      hostNetwork: {{ .Values.backend.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      volumes:
      - name: nodemgr-cert
        configMap:
          name: {{ template "bk-nodemgr.fullname" . }}-certs
      - name: {{ template "bk-nodemgr.fullname" . }}-backend-config
        configMap:
          name: {{ template "bk-nodemgr.fullname" . }}-backend-config
      - name: nodemgr-etc
        emptyDir: {}
      {{- if .Values.kms.enabled }}
      - name: kms-envelope
        projected:
          sources:
            - secret:
                name: {{ template "bk-nodemgr.fullname" . }}-global-kms-secret
                items:
                  - key: envelope
                    path: kms-global-envelope
            - secret:
                name: {{ template "bk-nodemgr.fullname" . }}-backend-kms-secret
                items:
                  - key: envelope
                    path: kms-backend-envelope
      {{- end }}
{{- end }}

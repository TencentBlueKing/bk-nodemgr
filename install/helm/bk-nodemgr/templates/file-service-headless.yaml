{{- if .Values.file.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ template "bk-nodemgr.fullname" . }}-file-headless
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
    app: nodemgr-file
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  selector:
    app: nodemgr-file
  clusterIP: None
  ports:
    - name: info-http
      port: {{ .Values.file.config.infoServer.port }}
      targetPort: info-http
    - name: admin-http
      port: {{ .Values.file.config.adminServer.port }}
      targetPort: admin-http
    - name: basic-http
      port: {{ .Values.file.config.basicServer.port }}
      targetPort: basic-http
    - name: download-http
      port: {{ .Values.file.config.downloadServer.port }}
      targetPort: download-http
    - name: export-http
      port: {{ .Values.file.config.exportServer.port }}
      targetPort: export-http
{{- end }}

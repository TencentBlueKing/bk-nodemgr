apiVersion: v2
appVersion: v0.1.0
name: bk-nodemgr
description: Blueking NodeMgr provides services to help operation and maintenance personnel to realize Agent installation, plug-in management and other back-end service management.
type: application
version: v0.1.0
dependencies:
  - name: common
    repository: https://charts.bitnami.com/bitnami
    tags:
      - bitnami-common
    version: 2.x.x
  - condition: redis.enabled
    name: redis
    alias: redis
    repository: "https://charts.bitnami.com/bitnami"
    version: 17.x.x
  - condition: mongodb.enabled
    name: mongodb
    repository: "https://charts.bitnami.com/bitnami"
    version: 13.x.x

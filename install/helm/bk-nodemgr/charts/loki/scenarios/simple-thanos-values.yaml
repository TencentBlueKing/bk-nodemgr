---
loki:
  commonConfig:
    replication_factor: 1
  useTestSchema: true

  storage:
    type: s3

    use_thanos_objstore: true

    object_store:
      type: s3

      s3:
        # Supply credentials for the target object store through deployment overrides.
        access_key_id: null
        secret_access_key: null
        region: us-east-1
        insecure: true
        endpoint: http://minio.minio.svc.cluster.local:9000
        http:
          tls_config:
            insecure_skip_verify: true

       # GCS configuration (when type is "GCS")
      gcs:
        bucket_name: test-gcs  # Name of the bucket
        service_account: service-account-test.json  # Optional service account JSON

      # Azure configuration (when type is "AZURE")
      azure:
        account_name: azure-test  # Storage account name
        account_key: null  # Supply the optional storage account key through deployment overrides.

    bucketNames:
      chunks: chunks_thanos
      ruler: ruler_thanos
      admin: admin_thanos

enterprise:
  enabled: true
  adminApi:
    enabled: true

minio:
  enabled: true

read:
  replicas: 1
write:
  replicas: 1
backend:
  replicas: 1

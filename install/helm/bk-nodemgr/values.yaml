      # 1. oa use bkTicket auth.
      # 2. ee use bkToken auth.
      # 3. at use accessToken auth.
      # 4. un use no user authentication required
      authMode: "un"
      # accessToken is the BlueKing access token of Nodemgr to request IAM v3 gateway.
      accessToken: ""
      # systemID is the system identifier registered in IAM v3.
      systemID: "bk_nodemgr"
      # cmdbSystemID is the cmdb system identifier registered in IAM v3.
      cmdbSystemID: "bk_cmdb"
      # callbackPath is the callback path for IAM resource provider.
      callbackPath: "/api/v3/iam/callback"
      # trace service name for IAM v3 client
      traceServiceName: "application-client-iam-v3"
      traceSampleRate: 0
      # defines tls related options.
      tls:
        # server should be accessed without verifying the TLS certificate.
        insecureSkipVerify: false
        # server requires TLS client certificate authentication.
        certFile: ""
        # server requires TLS client certificate authentication.
        keyFile: ""
        # trusted root certificates for server.
        caFile: ""
        # the password to decrypt the certificate.
        password: ""

    ## defines the tracing related settings.
    tracing:
      # instance id for tracing system (defaults to pod name in k8s)
      instanceID: ""
      # exporter type: stdout or otlp
      exporterType: "stdout"
      # otlp endpoint configuration
      otlpEndpoint: ""
      # otlp insecure skip verify
      otlpInsecure: false
      # otlp headers
      otlpHeaders: {}
      # global fallback trace service config
      globalService:
        traceServiceName: "application"
        traceSampleRate: 0

    # defines the config policy option settings.
    configPolicyOption:
      # file path for the config policy option JSON consumed by application service.
      filePath: /bk-nodemgr/support-files/configpolicy
      agentOption:
      proxyOption:
      pluginOption:

## Nodemgr backend.
##
backend:
  ## @param backend, enabled Enable backend
  ##
  enabled: true

  image:
    ## @param tag module image tag, it's empty as default.
    ## NOTE: would use root image configs when it's empty.
    tag: ""

  ## @param podAnnotations module pod annotations,
  ## NOTE: would use root annotations configs when it's not set.
  podAnnotations: {}

  ## @param hostNetwork module host network mode config.
  hostNetwork: true

  ## @param nodeSelector specify node labels for task pod assignment.
  ## NOTE: will be combined with the top nodeSelector in values.
  nodeSelector: {}

  ## @param tolerations module pod tolerations.
  tolerations: []

  ## @param terminationGracePeriodSeconds module pod termination grace period
  ## NOTE: would use root terminationGracePeriodSeconds if it's not set.
  terminationGracePeriodSeconds: 120

  ## @param lifecycleHooks module container lifecycle hooks.
  ## NOTE: preStop defaults to /bin/sh -c 'sleep 5' when not set.
  # lifecycleHooks:
  #   preStop:
  #     exec:
  #       command:
  #         - /bin/sh
  #         - -c
  #         - sleep 10

  ## backend containers' resource requests and limits
  ##
  resources:
    limits:
      memory: 4096Mi
      cpu: 2000m
    requests:
      memory: 2048Mi
      cpu: 1000m

  ## @param ingress support base on bk-bcs component,
  ## it's not enabled as the default config.
  ingress:
    enabled: false
    ## bk-bcs network extension lbid config.
    lbid: ""
    ## bk-bcs network lb policy: WRR, LEAST_CONN
    lbPolicy: WRR
    ## bk-bcs network direct connect mode.
    isDirectConnect: true

  ## @param configs module configs
  ##
  config:
    ## mode: release or debug, default is release.
    runMode: "release"

    ## tenant_mode: multiple or single, default is single.
    tenantMode: "single"

    ## system: define the related settings of deployment environment.
    system:
      env: gse2
      edition: ce

    ## defines the related settings of installer file group.
    installerFileGroup:
      fullPath: /bk-nodemgr/file/tools

    ## defines the default direct network unit auto-creation settings.
    networkUnit:
      defaultDirectUnit:
        # enabled controls whether the backend auto-creates a default direct network unit
        # in the default network area (id=0) after syncing networkareas from CMDB.
        enabled: false
        # name is the name of the default direct network unit.
        name: "default"
        # clusterEndpoints/fileEndpoints/dataEndpoints define the upstream GSE endpoints
        # of the default direct network unit.
        clusterEndpoints: []
        fileEndpoints: []
        dataEndpoints: []

    ## defines the local file cache used by backend SSH install flows.
    fileCache:
      # dir is the absolute path for the local file cache directory.
      dir: /bk-nodemgr/filecache
      # expirationHours is the number of hours after which an unused cache entry is evicted by GC.
      expirationHours: 72
      # gcIntervalHours is the number of hours between garbage collection runs.
      gcIntervalHours: 1
      # restoreOnStart controls whether existing cache entries on disk are loaded into
      # the in-memory index at startup. Defaults to false (cache starts empty).
      restoreOnStart: false

    ## encryptKey: define the key used to encrypt the sensitive data.
    encryptKey: "1234567890abcdef"

    ## defines the backend server advertise-ip, if not set then will use the pod-ip.
    advertiseIPV4: ""
    advertiseIPV6: ""

    ## defines the backend info server related settings.
    infoServer:
      bindIP: "0.0.0.0"
      bindIPV6: "::1"
      port: 28100
      traceServiceName: "backend-server-info"
      traceSampleRate: 0

    ## defines the backend admin server related settings.
    adminServer:
      bindIP: "0.0.0.0"
      bindIPV6: "::1"
      port: 28101
      authIdentity: rest-server
      traceServiceName: "backend-server-admin"
      traceSampleRate: 0
      # defines the JWT server configuration for authentication
      jwtServerConfig:
        # JWT encryption type: symmetric or asymmetric
        cryptoType: symmetric
        # symmetric key for JWT HMAC algorithms (HS256, HS384, HS512)
        symmetricKey: ""

    ## defines the backend basic server related settings.
    basicServer:
      bindIP: "0.0.0.0"
      bindIPV6: "::1"
      port: 28102
      authIdentity: api-gateway
      traceServiceName: "backend-server-basic"
      traceSampleRate: 0
      # defines the JWT server configuration for authentication
      jwtServerConfig:
        # JWT encryption type: symmetric or asymmetric
        cryptoType: asymmetric
        # public key in PEM format for JWT RSA/ECDSA algorithms (RS256, ES256, etc.)
        publicKeyPem: ""

    ## defines the backend callback server related settings.
    callbackServer:
      bindIP: "0.0.0.0"
      bindIPV6: "::1"
      port: 28103
      traceServiceName: "backend-server-callback"
      traceSampleRate: 0

    ## defines the backend proxy server related settings.
    proxyServer:
      bindIP: "0.0.0.0"
      bindIPV6: "::1"
      port: 28104
      traceServiceName: "backend-server-proxy"
      traceSampleRate: 0

    ## defines the workflow related settings.
    workflow:
      # workerNum is the number of workers.
      workerNum: 4096
      # gracefulShutdownTimeoutSeconds is the max seconds to wait running workflow tasks before cancelling them.
      # When absent, Helm injects backend.terminationGracePeriodSeconds / 2.
      # gracefulShutdownTimeoutSeconds: 60
      traceServiceName: "workflow"
      traceSampleRate: 0

    # defines the CMDB (BK API gateway) related settings.
    cmdb:
      # supplierAccount is a value specified by some api of CMDB that needs to be provided
      supplierAccount: "0"
      # endpoints is a seed list of host:port addresses of apigw nodes.
      endpoints:
        - "https://example.com/api/bk-cmdb/prod"
      # appCode is the BlueKing app code of Nodemgr to request api gateway.
      appCode: ""
      # appSecret is the BlueKing app secret of Nodemgr to request api gateway.
      appSecret: ""
      # user is the BlueKing user of Nodemgr to request api gateway.
      user: ""
      # authMode is the mode to do api auth verification,
      # it support 'oa' and 'ee' and 'at' mode for now.
      # 1. oa use bkTicket auth.
      # 2. ee use bkToken auth.
      # 3. at use accessToken auth.
      # 4. un use no user authentication required
      authMode: "un"
      # bkTicket is the BlueKing access ticket of bk_nodemgr to request api gateway.
      bkTicket: ""
      # bkToken is the BlueKing user token of bk_nodemgr to request api gateway.
      bkToken: ""
      # accessToken is the BlueKing access token of bk_nodemgr to request api gateway.
      accessToken: ""
      # trace service name for CMDB client
      traceServiceName: "backend-client-cmdb"
      traceSampleRate: 0
      # defines tls related options.
      tls:
        # server should be accessed without verifying the TLS certificate.
        insecureSkipVerify: false
        # server requires TLS client certificate authentication.
        certFile: ""
        # server requires TLS client certificate authentication.
        keyFile: ""
        # trusted root certificates for server.
        caFile: ""
        # the password to decrypt the certificate.
        password: ""

    # defines the gse related settings.
    gse:
      # endpoints is a seed list of host:port addresses of apigw nodes.
      endpoints:
        - "https://example.com/api/gse/prod"
      # appCode is the BlueKing app code of Nodemgr to request api gateway.
      appCode: ""
      # appSecret is the BlueKing app secret of Nodemgr to request api gateway.
      appSecret: ""
      # user is the BlueKing user of Nodemgr to request api gateway.
      user: ""
      # authMode is the mode to do api auth verification,
      # it support 'oa' and 'ee' and 'at' mode for now.
      # 1. oa use bkTicket auth.
      # 2. ee use bkToken auth.
      # 3. at use accessToken auth.
      # 4. un use no user authentication required
      authMode: "un"
      # bkTicket is the BlueKing access ticket of bk_nodemgr to request api gateway.
      bkTicket: ""
      # bkToken is the BlueKing user token of bk_nodemgr to request api gateway.
      bkToken: ""
      # accessToken is the BlueKing access token of bk_nodemgr to request api gateway.
      accessToken: ""
      # plugin SlotID and SlotToken
      pluginSlotID: 0
      pluginSlotToken: ""
      # trace service name for GSE client
      traceServiceName: "backend-client-gse"
      traceSampleRate: 0
      # defines tls related options.
      tls:
        # server should be accessed without verifying the TLS certificate.
        insecureSkipVerify: false
        # server requires TLS client certificate authentication.
        certFile: ""
        # server requires TLS client certificate authentication.
        keyFile: ""
        # trusted root certificates for server.
        caFile: ""
        # the password to decrypt the certificate.
        password: ""

    userManager:
      # endpoints is a seed list of host:port addresses of esb nodes.
      endpoints:
        - "https://example.com/api/bk-user/prod"
        # appCode is the BlueKing app code of Nodemgr to request api gateway.
      appCode: ""
      # appSecret is the BlueKing app secret of Nodemgr to request api gateway.
      appSecret: ""
      # user is the BlueKing user of Nodemgr to request api gateway.
      user: ""
      # authMode is the mode to do api access verification,
      # it support 'oa' and 'ee' and 'at' mode for now.
      # 1. oa use bkTicket access.
      # 2. ee use bkToken access.
      # 3. at use accessToken access.
      # 4. un use no user authentication required
      authMode: "un"
      # accessToken is the BlueKing access token of costops to request api gateway.
      accessToken: ""
      # trace service name for UserManager client
      traceServiceName: "backend-client-usermanager"
      traceSampleRate: 0
      # defines tls related options.
      tls:
        # server should be accessed without verifying the TLS certificate.
        insecureSkipVerify: false
        # server requires TLS client certificate authentication.
        certFile: ""
        # server requires TLS client certificate authentication.
        keyFile: ""
        # trusted root certificates for server.
        caFile: ""
        # the password to decrypt the certificate.
        password: ""

    ## defines the Monitor API gateway settings used to get or create Agent event data IDs.
    monitor:
      enabled: false
      endpoints:
        - "https://example.com"
      appCode: ""
      appSecret: ""
      user: ""
      authMode: "un"
      accessToken: ""
      traceServiceName: "backend-client-monitor"
      traceSampleRate: 0
      tls:
        insecureSkipVerify: false
        certFile: ""
        keyFile: ""
        caFile: ""
        password: ""

    ## defines the global fallback event data IDs for node configuration rendering.
    nodeEventDataID:
      default:
        agentBaseAlarmEventDataID: 1000
        taskProcEventDataID: 1100008

    creditVault:
      hostCreditVault:
        enable: false
        type: "iegtjj"
        iegtjj:
          # endpoints is a seed list of host:port addresses of apigw nodes.
          endpoints:
            - "https://example.com/api/iegtjj/prod"
          # appCode is the BlueKing app code of Nodemgr to request api gateway.
          appCode: ""
          # appSecret is the BlueKing app secret of Nodemgr to request api gateway.
          appSecret: ""
          # user is the BlueKing user of Nodemgr to request api gateway.
          user: ""
          # authMode is the mode to do api auth verification,
          # it support 'oa' and 'ee' and 'at' mode for now.
          # 1. oa use bkTicket auth.
          # 2. ee use bkToken auth.
          # 3. at use accessToken auth.
          # 4. un use no user authentication required
          authMode: "un"
          # bkTicket is the BlueKing access ticket of bk_nodemgr to request api gateway.
          bkTicket: ""
          # bkToken is the BlueKing user token of bk_nodemgr to request api gateway.
          bkToken: ""
          # accessToken is the BlueKing access token of bk_nodemgr to request api gateway.
          accessToken: ""
          # plugin SlotID and SlotToken
          pluginSlotID: 0
          pluginSlotToken: ""
          # trace service name for IEGTJJ client
          traceServiceName: "backend-client-iegtjj"
          traceSampleRate: 0
          # defines tls related options.
          tls:
            # server should be accessed without verifying the TLS certificate.
            insecureSkipVerify: false
            # server requires TLS client certificate authentication.
            certFile: ""
            # server requires TLS client certificate authentication.
            keyFile: ""
            # trusted root certificates for server.
            caFile: ""
            # the password to decrypt the certificate.
            password: ""

    gseDeployConfs:
      - # defines the gse deploy related settings.
        generation: 2

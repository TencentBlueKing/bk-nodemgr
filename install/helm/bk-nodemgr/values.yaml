## Nodemgr apigw-sync
apigwSync:
  enabled: false
  repository: "bk-nodemgr-apigw-sync"
  imageTag: "stage"
  extraEnvVars:
    - name: BK_APIGW_NAME
      value: "bk-nodemgr"
    - name: BK_APP_CODE
      value: "bk-nodemgr"
    - name: BK_APP_SECRET
      value: ""
    - name: BK_API_URL_TMPL
      value: "http://bkapi.example.com/api/{api_name}"
    - name: RELEASE_STAGES
      value: "stage"
    - name: NO_PUB
      value: "true"
  config:
    spec_version: 1
    release:
      version: "v1.0.0"
      title: "v1.0.0"
      comment: "v1.0.0"
    apigateway:
      description: "蓝鲸节点管理"
      description_en: "bk-nodemgr"
      is_public: false
      maintainers:
        - "admin"
    stages:
      - name:
        description:
        description_en:
        backends:
          - name: "default"
            config:
              timeout: 60
              loadbalance: "roundrobin"
              hosts:
                # 网关调用后端服务的默认域名或IP，不包含Path，比如：http://api.example.com
                - host: "https://example.com"
                  weight: 100
            plugin_configs:
              - type: bk-rate-limit
                yaml: |-
                  rates:
                    __default:
                    - period: 1
                      tokens: 100
    grant_permissions:
      - bk_app_code: "bk-nodemgr"
        grant_dimension: "resource"
        resource_names:
          - "resource_name_1"


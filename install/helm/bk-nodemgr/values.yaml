        baseWorkDir: "/tmp/bknm/"
        baseDeployDir: "/usr/local/"
        manualScriptPath: "/bk-nodemgr/script/manual/linux/install.sh"
        custom:
          logDir: ""
          extraConfigDir: ""
          proxyFileCacheDir: ""
          dataIPC: ""
          pluginIPC: ""
          zoneID: "default"
          cityID: "default"
        pluginCustom:
          logDir: ""
          hostIDPath: ""
          commonConstants: {}
      - # defines the gse deploy related settings.
        generation: 2
        osType: "windows"
        baseWorkDir: "c:\\tmp\\bknm\\"
        baseDeployDir: "c:\\"
        manualScriptPath: "/bk-nodemgr/script/manual/windows/install.bat"
        custom:
          logDir: ""
          extraConfigDir: ""
          dataIPC: ""
          pluginIPC: ""
          zoneID: "default"
          cityID: "default"
        pluginCustom:
          logDir: ""
          hostIDPath: ""
          commonConstants: {}

    # defines the access settings.
    access:
      # virtualUser overrides the default system user; when omitted, single mode uses admin and multiple mode uses bk_admin.
      # virtualUser: ""

    ## defines the log related settings.
    log:
      dir: "/bk-nodemgr/log"
      level: "INFO"
      maxNum: 10
      maxSizeMB: 200
      toStderr: false
      alsoToStderr: false

    ## defines the mongodb related settings.
    mongodb:
      traceServiceName: "bk_nodemgr_mongo"
      traceSampleRate: 0

    ## defines the redis related settings.
    redis:
      traceServiceName: "bk_nodemgr_redis"
      traceSampleRate: 0

    ## defines the IAM v3 related settings.
    iamV3:
      # enable indicates whether IAM v3 is enabled.
      # Disabled IAM handlers return errors; backend authorization is skipped only when both versions are disabled.
      # IAM v3 and v4 runtime authorization cannot both be enabled.
      enable: false
      # endpoints is a seed list of host:port addresses of IAM API gateway nodes.
      endpoints:
        - "https://example.com/api/bk-iam/prod"
      # appCode is the BlueKing app code of Nodemgr to request IAM v3 gateway.
      appCode: ""
      # appSecret is the BlueKing app secret of Nodemgr to request IAM v3 gateway.
      appSecret: ""
      # user is the BlueKing user of Nodemgr to request IAM v3 gateway.
      user: ""
      # authMode is the mode to do api auth verification.
      # it support 'oa' and 'ee' and 'at' and 'un' mode for now.
      # 1. oa use bkTicket auth.
      # 2. ee use bkToken auth.
      # 3. at use accessToken auth.
      # 4. un use no user authentication required
      authMode: "un"
      # accessToken is the BlueKing access token of Nodemgr to request IAM v3 gateway.
      accessToken: ""
      # systemID is the system identifier registered in IAM v3.
      systemID: "bk_nodemgr"
      # cmdbSystemID is the cmdb system identifier registered in IAM v3.
      cmdbSystemID: "bk_cmdb"
      # callbackPath is the callback path for IAM resource provider.
      callbackPath: "/api/v3/iam/callback"
      # trace service name for IAM v3 client
      traceServiceName: "backend-client-iam-v3"
      traceSampleRate: 0
      # defines tls related options.
      tls:
        # server should be accessed without verifying the TLS certificate.
        insecureSkipVerify: false
        # server requires TLS client certificate authentication.
        certFile: ""
        # server requires TLS client certificate authentication.
        keyFile: ""
        # trusted root certificates for server.
        caFile: ""
        # the password to decrypt the certificate.
        password: ""

    ## defines the IAM v4 related settings.
    iamV4:
      # Runtime authorization is independent of the iamV4.enabled initialization Job.
      # IAM v3 and v4 runtime authorization cannot both be enabled.
      # Disabled IAM handlers return errors; backend authorization is skipped only when both versions are disabled.
      enable: false
      # Full gateway URLs; the initialization Job uses the first endpoint.
      endpoints:
        - "https://example.com/api/bkiam/prod"
      appCode: ""
      appSecret: ""
      authMode: "un"
      systemID: "bk_nodemgr"
      callbackPath: "/api/v3/iam/v4/resource"

    ## defines the file related settings.
    file:
      # trace name for file service client
      traceServiceName: "backend-client-file"
      traceSampleRate: 0
      # defines the JWT client configuration for file service
      jwtClientConfig:
        # JWT encryption type: symmetric or asymmetric
        cryptoType: symmetric
        # symmetric key for JWT HMAC algorithms (HS256, HS384, HS512)
        symmetricKey: ""
        # token expiration duration (e.g., 1h, 24h)
        tokenExpirationHour: 24

    ## defines the tracing related settings.
    tracing:
      # instance id for tracing system (defaults to pod name in k8s)
      instanceID: ""
      # exporter type: stdout or otlp
      exporterType: "stdout"
      # otlp endpoint configuration
      otlpEndpoint: ""
      # otlp insecure skip verify
      otlpInsecure: false
      # otlp headers
      otlpHeaders: {}
      # global fallback trace service config
      globalService:
        traceServiceName: "backend"
        traceSampleRate: 0

## Nodemgr file
##
file:
  ## @param enabled Enable file
  ##
  enabled: true

  image:
    ## @param tag module image tag, it's empty as default.
    ## NOTE: would use root image configs when it's empty.
    tag: ""

  ## @param podAnnotations module pod annotations,
  ## NOTE: would use root annotations configs when it's not set.
  podAnnotations: {}

  ## @param hostNetwork module host network mode config.
  hostNetwork: true

  ## @param nodeSelector specify node labels for task pod assignment.
  ## NOTE: will be combined with the top nodeSelector in values.
  nodeSelector: {}

  ## @param tolerations module pod tolerations.
  tolerations: []

  ## @param terminationGracePeriodSeconds module pod termination grace period
  ## NOTE: would use root terminationGracePeriodSeconds if it's not set.
  terminationGracePeriodSeconds: 120

  ## @param lifecycleHooks module container lifecycle hooks.
  ## NOTE: preStop defaults to /bin/sh -c 'sleep 5' when not set.
  # lifecycleHooks:
  #   preStop:
  #     exec:
  #       command:
  #         - /bin/sh
  #         - -c
  #         - sleep 10

  ## file containers' resource requests and limits
  ##
  resources:
    limits:
      memory: 4096Mi
      cpu: 2000m
    requests:
      memory: 2048Mi
      cpu: 1000m

  ## @param configs module configs
  ##
  config:
    ## mode: release or debug, default is release.
    runMode: "release"

    ## tenant_mode: multiple or single, default is single.
    tenantMode: "single"

    ## defines the file server advertise-ip, if not set then will use the pod-ip.
    advertiseIPV4: ""
    advertiseIPV6: ""

    ## defines the file info server related settings.
    infoServer:
      bindIP: "0.0.0.0"
      bindIPV6: "::1"
      port: 28200
      traceServiceName: "file-server-info"
      traceSampleRate: 0

    ## defines the file admin server related settings.
    adminServer:
      bindIP: "0.0.0.0"
      bindIPV6: "::1"
      port: 28201
      authIdentity: rest-server
      traceServiceName: "file-server-admin"
      traceSampleRate: 0
      # defines the JWT server configuration for authentication
      jwtServerConfig:
        # JWT encryption type: symmetric or asymmetric
        cryptoType: symmetric
        # symmetric key for JWT HMAC algorithms (HS256, HS384, HS512)
        symmetricKey: ""

    ## defines the file basic server related settings.
    basicServer:
      bindIP: "0.0.0.0"
      bindIPV6: "::1"
      port: 28202
      authIdentity: none
      traceServiceName: "file-server-basic"
      traceSampleRate: 0

    ## defines the file download server related settings.
    downloadServer:
      bindIP: "0.0.0.0"
      bindIPV6: "::1"
      port: 28203
      traceServiceName: "file-server-download"
      traceSampleRate: 0

    ## defines the HTTP server and public address settings for exported package downloads.
    exportServer:
      # address must be a full URL with an http or https scheme.
      # When address is empty, it is built from advertiseIPV4:port, using https when the server certFile and keyFile are configured and http otherwise.
      address: ""
      bindIP: "0.0.0.0"
      bindIPV6: "::1"
      port: 28204
      authIdentity: none
      traceServiceName: "file-server-export"
      traceSampleRate: 0
      # defines the JWT server configuration for authentication
      jwtServerConfig:
        # JWT encryption type: symmetric or asymmetric
        cryptoType: symmetric
        # symmetric key for JWT HMAC algorithms (HS256, HS384, HS512)
        symmetricKey: ""
    ## downloader defines the remote package downloader settings.
    ## allowHosts allows exact hostnames/literal IPs to download from.
    ## Example:
    ##   allowHosts:
    ##     - github.com
    ##     - 127.0.0.1
    ## An empty allowHosts allows all hosts subject to blockHosts denial.
    downloader:
      allowHosts: []
      blockHosts: []
      maxBytes: 1073741824
      traceServiceName: "file-server-downloader"
      traceSampleRate: 0

    ## defines the bkrepo related settings.
    repo:
      endpoint: ""
      ## Keep projectID as the raw BKRepo project. In tenantMode=multiple, requests use tenant system and project system.<projectID>, for example blueking becomes system.blueking.
      projectID: ""
      repoName: ""
      accessKey: ""
      secretKey: ""
      # trace service name for repo client
      traceServiceName: "file-client-repo"
      traceSampleRate: 0

    workspaceFileGroup:
      fullPath: "/bk-nodemgr/workspace/"

    ## defines the local file cache used by the file service.
    ## The cache directory is derived from workspaceFileGroup.fullPath and is not separately configurable.
    fileCache:
      # expirationHours is the number of hours after which an unused cache entry is evicted by GC.
      expirationHours: 72
      # gcIntervalHours is the number of hours between garbage collection runs.
      gcIntervalHours: 1
      # restoreOnStart controls whether existing cache entries on disk are loaded into
      # the in-memory index at startup. Defaults to false (cache starts empty).
      restoreOnStart: false

    ## defines the cleanup behavior of the temp file directory used by the file manager.
    ## The temp directory is derived from workspaceFileGroup.fullPath and is not separately configurable.
    ## Set expirationHours or gcIntervalHours to 0 to disable the temp file GC.
    tempFile:
      # expirationHours is the number of hours after which an idle temp file (no access since)
      # becomes eligible for deletion by the GC.
      expirationHours: 24
      # gcIntervalHours is the number of hours between temp file GC runs.
      gcIntervalHours: 1

    mountHostDir: "/data/bk-nodemgr-file-mount/"

    # defines the gse related settings.
    gse:
      # endpoints is a seed list of host:port addresses of apigw nodes.
      endpoints:
        - "https://example.com/api/gse/prod"
      # appCode is the BlueKing app code of Nodemgr to request api gateway.
      appCode: ""
      # appSecret is the BlueKing app secret of Nodemgr to request api gateway.
      appSecret: ""
      # user is the BlueKing user of Nodemgr to request api gateway.
      user: ""
      # authMode is the mode to do api auth verification,
      # it support 'oa' and 'ee' and 'at' mode for now.
      # 1. oa use bkTicket auth.
      # 2. ee use bkToken auth.
      # 3. at use accessToken auth.
      # 4. un use no user authentication required
      authMode: "un"
      # bkTicket is the BlueKing access ticket of bk_nodemgr to request api gateway.
      bkTicket: ""
      # bkToken is the BlueKing user token of bk_nodemgr to request api gateway.
      bkToken: ""
      # accessToken is the BlueKing access token of bk_nodemgr to request api gateway.
      accessToken: ""
      # plugin SlotID and SlotToken
      pluginSlotID: 0
      pluginSlotToken: ""
      # defines tls related options.
      tls:
        # server should be accessed without verifying the TLS certificate.
        insecureSkipVerify: false
        # server requires TLS client certificate authentication.
        certFile: ""
        # server requires TLS client certificate authentication.
        keyFile: ""
        # trusted root certificates for server.
        caFile: ""
        # the password to decrypt the certificate.
        password: ""

    ## defines the log related settings.
    log:
      dir: "/bk-nodemgr/log"
      level: "INFO"
      maxNum: 10
      maxSizeMB: 200
      toStderr: false
      alsoToStderr: false

    ## defines the mongodb related settings.
    mongodb:
      traceServiceName: "bk_nodemgr_mongo"
      traceSampleRate: 0

    ## defines the tracing related settings.
    tracing:
      # instance id for tracing system (defaults to pod name in k8s)
      instanceID: ""
      # exporter type: stdout or otlp
      exporterType: "stdout"
      # otlp endpoint configuration
      otlpEndpoint: ""
      # otlp insecure skip verify
      otlpInsecure: false
      # otlp headers
      otlpHeaders: {}
      # global fallback trace service config
      globalService:
        traceServiceName: "file"
        traceSampleRate: 0

## Nodemgr apigw-sync
apigwSync:
  enabled: false
  ttlSecondsAfterFinished: 600
  backoffLimit: 10
  parallelism: 1
  extraEnvVars:
    - name: BK_APIGW_NAME
      value: "bk-nodemgr"
    - name: BK_APP_CODE
      value: "bk-nodemgr"
    - name: BK_APP_SECRET
      value: ""
    - name: BK_API_URL_TMPL
      value: "http://bkapi.example.com/api/{api_name}"
    #    - name: RELEASE_STAGES
    #      value: "stage"
    - name: NO_PUB
      value: "true"
  config:
    spec_version: 1
    release:
      version: "3.0.1-alpha.84"
      title: "bk-nodemgr"
      comment: "3.0.1-alpha.84"
    apigateway:
      description: "蓝鲸节点管理"
      description_en: "bk-nodemgr"
      is_public: false
      maintainers:
        - "admin"
    stages:
      - name:
        description:
        description_en:
        backends:
          - name: "default"
            config:
              timeout: 60
              loadbalance: "roundrobin"
              hosts:
                # 网关调用后端服务的默认域名或IP，不包含Path，比如：http://api.example.com
                - host: "https://example.com"
                  weight: 100
            plugin_configs:
              - type: bk-rate-limit
                yaml: |-
                  rates:
                    __default:
                    - period: 1
                      tokens: 100
    grant_permissions:
      - bk_app_code: "bk-nodemgr"
        grant_dimension: "gateway"
#     - bk_app_code: "bk-demo"
#       grant_dimension: "resource"
#       resource_names:
#         - "resource_name_1"

initPackages:
  enabled: false
  # If true, create init-packages Job only on `helm install`.
  # Set to false if you want it to also run on `helm upgrade` (when config/image changes, a new Job name will be generated).
  installOnly: true
  # Auto-clean completed Job after N seconds; set empty to disable.
  ttlSecondsAfterFinished: 86400
  backoffLimit: 3
  parallelism: 1
  # bk_username and login_name are needed by generate jwt token
  bkUsername: ""
  loginName: ""
  ## If any gseCert fields are provided, the init-packages Job will decode them
  ## and write files into /bk-nodemgr/file/packages/cert before uploading.
  gseCert:
    ## CA content for certificates (base64)
    ca: ""
    ## Server-side certificate (base64)
    cert: ""
    ## Server-side private key (base64)
    key: ""
    ## Certificate password key file content, used to decrypt the certificate password
    certEncryptKey: ""
    ## API client certificate
    ##
    apiClient:
      ## API client certificate (base64), used for other services to call GSE
      cert: ""
      ## API client private key (base64), used for other services to call GSE
      key: ""
    ## Agent certificate
    ##
    agent:
      ## Agent certificate (base64), used for the agent communication chain
      cert: ""
      ## Agent private key (base64), used for the agent communication chain
      key: ""

iamV3:
  enabled: false
  syncJob:
    ttlSecondsAfterFinished: 600
    backoffLimit: 3
    parallelism: 1
  system:
    id: "bk-nodemgr"
    name: "节点管理"
    name_en: "NodeManager"
    description: "蓝鲸节点管理系统, 提供节点管理, 插件管理等功能"
    description_en: "BlueKing Node Manager, provides node management, plugin management and other functions"
    clients: "bk-nodemgr"
  # Provider configuration for IAM callbacks
  provider:
    # The URL where IAM will call back to bk-nodemgr for resource queries
    # Example: http://bk-nodemgr.example.com/api/v1/iam
    host: ""
    # Authentication method for provider callbacks
    # Options: basic, none
    # Default: basic
    auth: "basic"
    # Path for IAM callbacks.
    path: "/api/v3/iam/v3/resource"
  # CMDB configuration for business resource authorization
  # These values reference CMDB's IAM resource definitions
  cmdb:
    # CMDB system ID registered in IAM
    system_id: "bk_cmdb"
    # Resource definitions from CMDB
    resource:
      # Business (biz) resource configuration
      biz:
        # Resource type ID for business in CMDB
        resource_type_id: "biz"
        # Instance selection ID for business picker in IAM
        instance_selection_id: "business"

## IAM V4 model initialization, independent of runtime authorization.
iamV4:
  enabled: false
  # Gateway endpoint and application credentials come from backend.config.iamV4.
  syncJob:
    ttlSecondsAfterFinished: 600
    backoffLimit: 3
    parallelism: 1
  system:
    id: "bk_nodemgr"
    name: "节点管理"
    description: "蓝鲸节点管理系统, 提供节点管理, 插件管理等功能"
    clients:
      - "bk-nodemgr"
  provider:
    # Externally reachable host; empty host produces an empty callback_url.
    host: ""
    path: "/api/v3/iam/v4/resource"

## ServiceMonitor configuration
##
serviceMonitor:
  ## @param serviceMonitor.enabled Creates a ServiceMonitor to monitor kube-state-metrics
  ##
  enabled: false
  ## @param serviceMonitor.namespace Namespace in which Prometheus is running
  ## e.g:
  ## namespace: monitoring
  ##
  namespace: ""
  ## @param serviceMonitor.jobLabel The name of the label on the target service to use as the job name in prometheus.
  ##
  jobLabel: ""
  ## @param serviceMonitor.interval Scrape interval (use by default, falling back to Prometheus' default)
  ## ref: https://github.com/coreos/prometheus-operator/blob/master/Documentation/api.md#endpoint
  ## e.g:
  ## interval: 10s
  ##
  interval: "30s"
  ## @param serviceMonitor.scrapeTimeout Timeout after which the scrape is ended
  ## ref: https://github.com/coreos/prometheus-operator/blob/master/Documentation/api.md#endpoint
  ## e.g:
  ## scrapeTimeout: 10s
  ##
  scrapeTimeout: ""
  ## @param serviceMonitor.selector ServiceMonitor selector labels
  ## ref: https://github.com/bitnami/charts/tree/master/bitnami/prometheus-operator#prometheus-configuration
  ## e.g:
  ## selector:
  ##   prometheus: my-prometheus
  ##
  selector: {}
  ## @param serviceMonitor.honorLabels Honor metrics labels
  ## ref: https://github.com/coreos/prometheus-operator/blob/master/Documentation/api.md#endpoint
  ## e.g:
  ## honorLabels: false
  ##
  honorLabels: false
  ## @param serviceMonitor.relabelings ServiceMonitor relabelings
  ## ref: https://github.com/coreos/prometheus-operator/blob/master/Documentation/api.md#relabelconfig
  ##
  relabelings: []
  ## @param serviceMonitor.metricRelabelings ServiceMonitor metricRelabelings
  ## ref: https://github.com/coreos/prometheus-operator/blob/master/Documentation/api.md#relabelconfig
  ##
  metricRelabelings: []

      # appCode is the BlueKing app code of Nodemgr to request api gateway.
      appCode: ""
      # appSecret is the BlueKing app secret of Nodemgr to request api gateway.
      appSecret: ""
      # user is the BlueKing user of Nodemgr to request api gateway.
      user: ""
      # authMode is the mode to do api access verification.

        certFile: ""
        # server requires TLS client certificate authentication.
        keyFile: ""
        # trusted root certificates for server.
        caFile: ""
        # the password to decrypt the certificate.
        password: ""

    # defines the user manager (BK API gateway) related settings.
    userManager:
      # endpoints is a seed list of host:port addresses of user manager apigw nodes.
      endpoints:

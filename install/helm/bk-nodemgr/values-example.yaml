## 此处描述部分配置项用于测试

## 同步APIGateway资源配置
apigwSync:
  enabled: true

## 节点管理 Web/API 服务 Ingress 示例；默认关闭。
## className 为空时使用 BCS Network Extension Ingress；非空时使用标准 Kubernetes Ingress。
application:
  ingress:
    enabled: false
    className: nginx
    domain: nodemgr.example.com
    path: /
    tlsSecretName: nodemgr-tls
    lbid: example-bcs-lb-id
    lbPolicy: WRR
    isDirectConnect: true
    certID: example-bcs-cert-id

## backend TCP Ingress 示例；默认关闭，仅支持 BCS Network Extension Ingress。
backend:
  ingress:
    enabled: false
    lbid: example-bcs-lb-id
    lbPolicy: WRR
    isDirectConnect: true

## 内嵌 Tempo 默认关闭；生产环境建议改用对象存储，不建议使用默认 local 存储。
tempo:
  enabled: false
  tempo:
    storage:
      trace:
        backend: s3
        s3:
          bucket: bk-nodemgr-tempo
          endpoint: cos.example.com
          region: ap-guangzhou
          access_key: example-access-key
          secret_key: example-secret-key
          insecure: false
        wal:
          path: /var/tempo/wal

## 内嵌 Pyroscope 默认关闭；开启后自动启用未显式设置 profiling.enabled 的服务。
## 使用单副本 filesystem 存储；开启 PVC 保留数据。
pyroscope:
  enabled: false
  pyroscope:
    persistence:
      enabled: true
      storageClassName: ""
      size: 10Gi

## OpenTelemetry Gateway 默认关闭；用于集中处理 trace fan-out、重试、队列和外部凭证。
opentelemetryGateway:
  enabled: false
  extraEnvs:
    - name: EXTERNAL_OTLP_TOKEN
      valueFrom:
        secretKeyRef:
          name: external-otlp-secret
          key: token
  alternateConfig:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        limit_mib: 512
        spike_limit_mib: 128
        check_interval: 5s
      batch: {}
    exporters:
      otlp/tempo:
        endpoint: bk-nodemgr-tempo:4317
        tls:
          insecure: true
        sending_queue:
          enabled: true
        retry_on_failure:
          enabled: true
      otlp/external:
        endpoint: external-collector.example.com:4317
        headers:
          authorization: Bearer ${env:EXTERNAL_OTLP_TOKEN}
        sending_queue:
          enabled: true
        retry_on_failure:
          enabled: true
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions:
        - health_check
      pipelines:
        traces:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - batch
          exporters:
            - otlp/tempo
            - otlp/external

## 内嵌 Prometheus 默认关闭；用于采集 bk-nodemgr application/backend/file 自身指标。
prometheus:
  enabled: false
  server:
    persistentVolume:
      enabled: true
      storageClass: ""
      size: 8Gi

## 内嵌 Loki 默认关闭；用于存储并查询 Alloy 采集的 Pod 日志。
loki:
  enabled: false
  singleBinary:
    persistence:
      enabled: true
      storageClass: ""
      size: 8Gi

## 内嵌 Alloy 默认关闭；开启后以 DaemonSet 采集 Kubernetes Pod 日志并写入内嵌 Loki。
alloy:
  enabled: false

## Optional Grafana subchart with password login and automatically provisioned data sources.
## Enable tempo.enabled, prometheus.enabled, loki.enabled, or pyroscope.enabled as the embedded backend. Retrieve the generated password from the Grafana Secret.
grafana:
  enabled: false
  rootURL: https://nodemgr.example.com/grafana/
  persistence:
    enabled: true
    storageClassName: ""
    size: 1Gi
  ingress:
    enabled: false
    ingressClassName: nginx
    hosts:
      - nodemgr.example.com
    path: /grafana
    pathType: Prefix
    tls:
      - secretName: nodemgr-grafana-tls
        hosts:
          - nodemgr.example.com

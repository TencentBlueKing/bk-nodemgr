helmBinary: ./bin/helm

helmDefaults:
  timeout: 600

releaseName: bk-nodemgr

chart:
  repository: blueking
  repositoryURL: ""
  name: bk-nodemgr
  version: v3.0.1-alpha.90

image:
  registry: hub.bktencent.com
  repository: blueking/bk-nodemgr-server
  tag: v3.0.1-alpha.90
  pullPolicy: IfNotPresent
  pullSecrets: []

apiManagerImage:
  registry: hub.bktencent.com
  repository: blueking/bk-nodemgr-apigw-sync
  tag: v3.0.1-alpha.90
  pullPolicy: IfNotPresent
  pullSecrets: []

namespaces:
  file: blueking-nodemgr-file
  backend: blueking-nodemgr-backend
  application: blueking-nodemgr-application

common:
  certPath: /bk-nodemgr/cert

certData:
  ca: ""
  cert: ""
  key: ""
  password: ""
  apiClient:
    cert: ""
    key: ""

bkApigatewayPublicKey: ""

global:
  runMode: release
  tenantMode: single
  appCode: bk-nodemgr
  appSecret: ""
  user: admin
  authMode: un
  accessToken: ""
  bkTicket: ""
  bkToken: ""
  encryptKey: "1234567890abcdef"
  log:
    dir: /bk-nodemgr/log
    level: INFO
    maxNum: 10
    maxSizeMB: 200
    toStderr: false
    alsoToStderr: false
  tracing:
    exporterType: stdout
    otlpEndpoint: ""
    otlpProtocol: grpc
    otlpInsecure: false
    otlpHeaders: {}

externalEtcd:
  endpoints:
    - 127.0.0.1:2379
  username: ""
  password: ""
  tls:
    secretName: ""
    secretCaFileName: ""
    secretCertFileName: ""
    secretKeyFileName: ""
    ca: ""
    cert: ""
    key: ""
    password: ""

externalRedis:
  type: standalone
  addrs: []
  password: ""
  db: 0
  masterName: ""
  tls:
    secretName: ""
    secretCaFileName: ""
    secretCertFileName: ""
    secretKeyFileName: ""
    ca: ""
    cert: ""
    key: ""
    password: ""

externalMongodb:
  replicaSetName: rs0
  hosts:
    - ""
  username: nodemgr
  password: defaultpassword
  database: nodemgr
  authSource: admin
  authMechanism: SCRAM-SHA-256
  tls:
    secretName: ""
    secretCaFileName: etcdca.crt
    secretCertFileName: etcd.crt
    secretKeyFileName: etcd.key
    ca: ""
    cert: ""
    key: ""
    password: ""

gateways:
  nodemgr:
    endpoints:
      - https://example.com/api/bk-nodemgr/prod
  cmdb:
    endpoints:
      - https://example.com/api/bk-cmdb/prod
  gse:
    endpoints:
      - https://example.com/api/gse/prod
    pluginSlotID: 0
    pluginSlotToken: ""
  userManager:
    endpoints:
      - https://example.com/api/bk-user/prod
  bkLogin:
    loginURL: ""
    endpoints: []
    authType: bk_token
  iamV3:
    enabled: false
    endpoints:
      - https://example.com/api/bk-iam/prod
    systemID: bk_nodemgr
    cmdbSystemID: bk_cmdb
    callbackPath: /api/v3/iam/callback
  iamV4:
    enabled: false
    endpoints:
      - https://example.com/api/bkiam/prod
    systemID: bk_nodemgr
    callbackPath: /api/v3/iam/v4/resource
  notice:
    enabled: false
    endpoints:
      - https://example.com/api/bk-notice/prod
  monitor:
    endpoints: []

modules:
  file:
    replicaCount: 1
    hostNetwork: false
    resources:
      limits:
        memory: 4096Mi
        cpu: 2000m
      requests:
        memory: 2048Mi
        cpu: 1000m
    workspaceFileGroup:
      fullPath: /bk-nodemgr/workspace/
    repo:
      endpoint: ""
      projectID: ""
      repoName: ""
      accessKey: ""
      secretKey: ""
    mountHostDir: /data/bk-nodemgr-file-mount/
  backend:
    replicaCount: 1
    hostNetwork: false
    resources:
      limits:
        memory: 4096Mi
        cpu: 2000m
      requests:
        memory: 2048Mi
        cpu: 1000m
    system:
      env: gse2
      edition: ce
    installerFileGroup:
      fullPath: /bk-nodemgr/file/tools
    networkUnit:
      defaultDirectUnit:
        enabled: false
        name: default
        clusterEndpoints: []
        fileEndpoints: []
        dataEndpoints: []
  application:
    replicaCount: 1
    hostNetwork: false
    resources:
      limits:
        memory: 4096Mi
        cpu: 2000m
      requests:
        memory: 2048Mi
        cpu: 1000m
    front:
      passwordVaultSwitch: false
      passwordVaultName: password_vault
      bkUserWebURL: ""
      bkDomain: ""
      bkDocsCenterURL: ""
      bkAppNavOpenSourceURL: ""
      windowsWMIPortDefault: 445
      windowsSSHPortDefault: 22
      unixSSHPortDefault: 22
      bkIamSaaSHost: ""
      bkUserSaaSHost: ""
    ingress:
      enabled: false
      lbid: ""
      lbPolicy: WRR
      isDirectConnect: true
      certID: ""
      domain: nodemgr.example.com
      path: /
      className: ""
      tlsSecretName: ""

hooks:
  initPackages:
    enabled: false
    installOnly: true
    ttlSecondsAfterFinished: 86400
    backoffLimit: 3
    parallelism: 1
    bkUsername: ""
    loginName: ""
    gseCert:
      ca: ""
      cert: ""
      key: ""
      certEncryptKey: ""
      apiClient:
        cert: ""
        key: ""
      agent:
        cert: ""
        key: ""
  apigwSync:
    enabled: false
  iamV3:
    enabled: false
    syncJob:
      ttlSecondsAfterFinished: 600
      backoffLimit: 3
      parallelism: 1
    system:
      id: bk-nodemgr
      name: 节点管理
      name_en: NodeManager
      description: 蓝鲸节点管理系统, 提供节点管理, 插件管理等功能
      description_en: BlueKing Node Manager, provides node management, plugin management and other functions
      clients: bk-nodemgr
    provider:
      host: ""
      auth: basic
      path: /api/v3/iam/v3/resource
    cmdb:
      system_id: bk_cmdb
      resource:
        biz:
          resource_type_id: biz
          instance_selection_id: business
  iamV4:
    enabled: false
    syncJob:
      ttlSecondsAfterFinished: 600
      backoffLimit: 3
      parallelism: 1
    system:
      id: bk_nodemgr
      name: 节点管理
      description: 蓝鲸节点管理系统, 提供节点管理, 插件管理等功能
      clients:
        - bk-nodemgr
    provider:
      host: ""
      path: /api/v3/iam/v4/resource

releaseName: bk-nodemgr

chart:
  repository: ../../helm
  name: bk-nodemgr
  version: v3.0.1-alpha.90

namespaces:
  deps: bk-nodemgr-deps
  file: blueking-nodemgr-file
  backend: blueking-nodemgr-backend
  application: blueking-nodemgr-application
  monitoring: bk-nodemgr-monitoring

monitoring:
  # Enable the embedded self-monitoring stack. External trace exporters remain independent.
  enabled: true

opentelemetryGateway:
  # Additional trace exporters, automatically added to the pipeline (alongside local Tempo when enabled).
  # Use the same endpoint in each namespace to collect traces centrally. Avoid forwarding loops.
  # otlp/tempo is reserved for the embedded Tempo. Empty keeps the chart defaults.
  # To enable an example below, remove {} and uncomment the exporter settings.
  exporters: {}
    # otlp/central:
    #   endpoint: REPLACE_WITH_SERVICE.REPLACE_WITH_NAMESPACE.svc.cluster.local:4317
    #   tls:
    #     insecure: false # TLS enabled; match this to the receiver.
    #   headers:
    #     authorization: "Bearer REPLACE_WITH_TOKEN"
    #     X-Scope-OrgID: "REPLACE_WITH_TENANT_ID"
    # otlphttp/external:
    #   endpoint: https://REPLACE_WITH_COLLECTOR_HOST:4318
    #   headers:
    #     authorization: "Bearer REPLACE_WITH_TOKEN"
    # Header names and values are receiver-specific; omit headers if not required.
    # Never commit real tokens. For Secret-backed tokens, use extraEnvs + secretKeyRef
    # in the user override and reference ${env:VARIABLE_NAME} in the header value.

global:
  tenantMode: multiple
  appCode: bk-nodemgr
  # Replace with the real BlueKing app secret before deploying to a usable environment.
  appSecret: ""
  user: bk_admin
  bkApiUrlTmpl: https://example.com/api/{gateway_name}/prod
  access:
    virtualUser: bk_admin
  serviceJwt:
    symmetricKey: bk-nodemgr-example-service-jwt-key
  ingress:
    enabled: false
    className: nginx
    domain: nodemgr.example.com
    path: /
    grafanaPath: /grafana
    tlsSecretName: ""

backend:
  config:
    jinja2x:
      portRange:
        start: 28150
        end: 28159
      traceServiceName: "backend-client-jinja2x"
    userManager:
      # Enable only on BlueKing platform 7.2; keep all three services in sync.
      useLegacyUsername: false
    wiki:
      mode: github
      github:
        repositoryURL: https://github.com/TencentBlueKing/bk-nodemgr
      application:
        prefixURL: ""
    basicServer:
      jwtServerConfig:
        publicKeyPem: ""
    networkUnit:
      defaultDirectUnit:
        enabled: false
        name: default
        clusterEndpoints: []
        fileEndpoints: []
        dataEndpoints: []
        accessPoints: []
    cmdb:
      supplierAccount: "0"
    gse:
      pluginSlotID: 0
      pluginSlotToken: ""
    gseDeployConfs:
      - generation: 2
        osType: linux
        baseWorkDir: /tmp/bknm/
        baseDeployDir: /usr/local/
        manualScriptPath: /bk-nodemgr/script/manual/linux/install.sh
        custom:
          logDir: ""
          extraConfigDir: ""
          proxyFileCacheDir: ""
          # Global Linux Proxy network settings. Empty IPs and zero ports use the built-in defaults below.
          # These values override the ones shipped in the Proxy release package env file.
          # Restart backend after changes; existing Proxy nodes also require reconfig.
          dataAgentBindIP: "::"
          dataAgentBindPort: 28625
          fileAgentBindIP: "::"
          fileAgentBindPort: 28925
          fileAgentBindPortV1: 58925
          proxyBindIP: "::"
          proxyBindPort: 28668
          fileBittorrentBindIP: "::"
          fileBittorrentBindPort: 10020
          fileBittorrentTrackerBindPort: 10030
          fileTopologyBindIP: "::"
          fileTopologyBindPort: 28930
          fileTopologyThriftBindPort: 58930
          fileMetricExporterBindPort: 29404
          dataMetricExporterBindPort: 29402
          dataIPC: ""
          pluginIPC: ""
          zoneID: default
          cityID: default
        pluginCustom:
          logDir: ""
          hostIDPath: ""
          hostIDPushMode: ""
          commonConstants: {}
          v2RunDir: ""
          v2DataDir: ""
      - generation: 2
        osType: windows
        baseWorkDir: "c:\\tmp\\bknm\\"
        baseDeployDir: "c:\\"
        manualScriptPath: /bk-nodemgr/script/manual/windows/install.bat
        custom:
          logDir: ""
          extraConfigDir: ""
          dataIPC: ""
          pluginIPC: ""
          zoneID: default
          cityID: default
        pluginCustom:
          logDir: ""
          hostIDPath: ""
          hostIDPushMode: ""
          commonConstants: {}
          v2RunDir: ""
          v2DataDir: ""
    iamV3:
      enable: false
      systemID: bk_nodemgr
      cmdbSystemID: bk_cmdb
      callbackPath: /api/v3/iam/callback
    iamV4:
      enable: false
      systemID: bk_nodemgr
      callbackPath: /api/v3/iam/v4/resource

application:
  config:
    userManager:
      # Enable only on BlueKing platform 7.2; keep all three services in sync.
      useLegacyUsername: false
    wiki:
      enabled: false
    front:
      bkUserWebURL: ""
      bkDomain: ""
      bkDocsCenterURL: ""
      bkDocsCenterNodemgrDocPath: "/markdown/NodeMgr/UserGuide/Introduce/Overview.md"
      bkSharedResBaseJSURL: ""
      opsOutBandProtocols: '[]'
      unassignedNetworkAreaID: -1
      bkIamSaaSHost: ""
      bkUserSaaSHost: ""
    bkSaaS:
      bkLogin:
        loginURL: ""
        authType: bk_token
        # Enable only for older single-tenant environments using /accounts/get_user/.
        useLegacyAPI: false
    bkPaaS:
      analysisScript: ""
    notice:
      enabled: false
    iamV3:
      enable: false
      systemID: bk_nodemgr
      cmdbSystemID: bk_cmdb
      callbackPath: /api/v3/iam/callback

file:
  config:
    userManager:
      # Enable only on BlueKing platform 7.2; keep all three services in sync.
      useLegacyUsername: false
    repo:
      endpoint: ""
      projectID: ""
      repoName: ""
      accessKey: ""
      secretKey: ""
    gse:
      pluginSlotID: 0
      pluginSlotToken: ""

## KMS credential integration via External Secrets Operator (ESO); disabled by default.
## When enabled, each module release renders a SecretStore + ExternalSecret for the global
## credential and its own module credential; private keys are injected as env vars and
## envelopes are mounted as files under common.secretPath.
## Note: ESO authenticates to KMS with the module release namespace's ServiceAccount
## (chart default serviceAccount.create=false means the "default" SA), so the KMS/Vault
## role must be bound to that SA in each module namespace.
kms:
  enabled: false
  server: "https://kms.example.com"
  tls:
    enabled: false
    secretName: ""
    secretCaFileName: ""
    client:
      enabled: false
      secretCertFileName: ""
      secretKeyFileName: ""
  refreshInterval: "1h"
  modules:
    global:
      path: "secret"
      role: "default.scope.blueking.secret.bk_nodemgr_global_config"
      credential: "default/scope/blueking/secret/bk_nodemgr_global_config"
    application:
      path: "secret"
      role: "default.scope.blueking.secret.bk_nodemgr_application_config"
      credential: "default/scope/blueking/secret/bk_nodemgr_application_config"
    backend:
      path: "secret"
      role: "default.scope.blueking.secret.bk_nodemgr_backend_config"
      credential: "default/scope/blueking/secret/bk_nodemgr_backend_config"
    file:
      path: "secret"
      role: "default.scope.blueking.secret.bk_nodemgr_file_config"
      credential: "default/scope/blueking/secret/bk_nodemgr_file_config"

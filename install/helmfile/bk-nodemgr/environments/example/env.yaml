releaseName: bk-nodemgr

chart:
  repository: ../../helm
  name: bk-nodemgr
  version: v3.0.1-alpha.90

namespaces:
  deps: bk-nodemgr-deps
  file: blueking-nodemgr-file
  backend: blueking-nodemgr-backend
  application: blueking-nodemgr-application
  monitoring: bk-nodemgr-monitoring

global:
  tenantMode: multiple
  appCode: bk-nodemgr
  # Replace with the real BlueKing app secret before deploying to a usable environment.
  appSecret: ""
  user: bk_admin
  bkApiUrlTmpl: https://example.com/api/{gateway_name}/prod
  access:
    virtualUser: bk_admin
  serviceJwt:
    symmetricKey: bk-nodemgr-example-service-jwt-key
  ingress:
    enabled: false
    className: nginx
    domain: nodemgr.example.com
    path: /
    grafanaPath: /grafana
    tlsSecretName: ""

backend:
  config:
    basicServer:
      jwtServerConfig:
        publicKeyPem: ""
    networkUnit:
      defaultDirectUnit:
        enabled: false
        name: default
        clusterEndpoints: []
        fileEndpoints: []
        dataEndpoints: []
    cmdb:
      supplierAccount: "0"
    gse:
      pluginSlotID: 0
      pluginSlotToken: ""
    gseDeployConfs:
      - generation: 2
        osType: linux
        baseWorkDir: /tmp/bknm/
        baseDeployDir: /usr/local/
        manualScriptPath: /bk-nodemgr/script/manual/linux/install.sh
        custom:
          logDir: ""
          extraConfigDir: ""
          proxyFileCacheDir: ""
          dataIPC: ""
          pluginIPC: ""
          zoneID: default
          cityID: default
        pluginCustom:
          logDir: ""
          hostIDPath: ""
          commonConstants: {}
      - generation: 2
        osType: windows
        baseWorkDir: "c:\\tmp\\bknm\\"
        baseDeployDir: "c:\\"
        manualScriptPath: /bk-nodemgr/script/manual/windows/install.bat
        custom:
          logDir: ""
          extraConfigDir: ""
          dataIPC: ""
          pluginIPC: ""
          zoneID: default
          cityID: default
        pluginCustom:
          logDir: ""
          hostIDPath: ""
          commonConstants: {}
    iamV3:
      enable: false
      systemID: bk_nodemgr
      cmdbSystemID: bk_cmdb
      callbackPath: /api/v3/iam/callback
    iamV4:
      enable: false
      systemID: bk_nodemgr
      callbackPath: /api/v3/iam/v4/resource

application:
  config:
    front:
      bkUserWebURL: ""
      bkDomain: ""
      bkDocsCenterURL: ""
      bkIamSaaSHost: ""
      bkUserSaaSHost: ""
    bkSaaS:
      bkLogin:
        loginURL: ""
        authType: bk_token
    bkPaaS:
      analysisScript: ""
    notice:
      enabled: false
    iamV3:
      enable: false
      systemID: bk_nodemgr
      cmdbSystemID: bk_cmdb
      callbackPath: /api/v3/iam/callback

file:
  config:
    repo:
      endpoint: ""
      projectID: ""
      repoName: ""
      accessKey: ""
      secretKey: ""
    gse:
      pluginSlotID: 0
      pluginSlotToken: ""
